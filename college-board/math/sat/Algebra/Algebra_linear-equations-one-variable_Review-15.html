<style>
:root{--blue:#244f93;--blue-d:#173a70;--bg:#eef2f7;--ink:#182438;--mut:#476078;--line:#cad4e3;--ok:#1e7b46;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:940px;margin:0 auto;padding:0 16px 60px}
.topbar{background:var(--blue-d);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;font-weight:600;letter-spacing:.3px;position:sticky;top:0;z-index:30}
.topbar .nm{flex:1;text-align:center}
.topbar button{padding:7px 14px;background:#fff;color:var(--blue-d);font-size:14px}
.topbar button:hover{background:#e2ecff}
.card{background:#fff;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 3px 14px #15213a14}
h1{font-size:27px;line-height:1.3;margin:.2em 0}h2{font-size:19px;margin:0 0 8px}h3{font-size:17px;margin:14px 0 6px}
.badge{color:var(--mut);font-size:13px;letter-spacing:.5px}
button{background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:9px;cursor:pointer}
button:hover{background:var(--blue-d)}button.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:disabled{opacity:.5;cursor:default}
input[type=text]{width:100%;max-width:420px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 16px}
img.q{width:100%;height:auto;display:block}

fieldset label:has(input:checked){background:#e2ecff;border-color:var(--blue);color:var(--blue-d)}
fieldset input{margin-right:6px}
.sticky{position:sticky;top:46px;z-index:20;background:var(--bg);padding:8px 0;color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.sticky .grow{flex:1;min-width:160px}
.bar{height:6px;background:#dbe3ef;border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--blue);width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--blue-d);background:#e2ecff;border-radius:8px;padding:2px 12px}
.timer.low{background:#fde7e5;color:var(--bad)}
.score{font-size:44px;font-weight:700;color:var(--blue-d);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid #dde4ef;text-align:left}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.na{color:var(--mut);font-weight:700}
.rq{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;break-inside:avoid;background:#fff}
.rq.r-ok{border-left:6px solid var(--ok)}.rq.r-bad{border-left:6px solid var(--bad)}.rq.r-na{border-left:6px solid #8a97ab}
.exp{background:#f1f5fb;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:15px}
.opt{display:flex;flex-wrap:wrap;gap:10px 22px;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafcff}
.opt label{cursor:pointer}
.hide{display:none!important}#report{display:none}
.note{color:var(--mut);font-size:14px}
#desmos-panel{position:fixed;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));height:min(560px,70vh);background:#fff;border:2px solid var(--blue);border-radius:12px;box-shadow:0 8px 30px #0005;z-index:50;display:none;flex-direction:column;overflow:hidden;resize:both;min-width:280px;min-height:280px}
#desmos-panel.open{display:flex}
#desmos-head{background:var(--blue);color:#fff;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;user-select:none;touch-action:none;font-weight:600}
#desmos-head button{background:#fff;color:var(--blue);padding:2px 10px}
#desmos-body{flex:1;min-height:0}#desmos-msg{padding:16px;color:var(--mut)}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;font-size:12.5px}.topbar,#app,#desmos-panel{display:none!important}
 #report{display:block!important}main{padding:0;max-width:none}
 .card{box-shadow:none;padding:0;margin:0 0 10px}

 .score{font-size:30px}h1{font-size:20px}
}

 if(desCalc)setTimeout(()=>desCalc.resize(),50);
}
(function(){const h=$('desmos-head'),p=$('desmos-panel');let d=null;
 h.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;const r=p.getBoundingClientRect();d={x:e.clientX-r.left,y:e.clientY-r.top};h.setPointerCapture(e.pointerId)});
 h.addEventListener('pointermove',e=>{if(!d)return;p.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-d.x))+'px';p.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-d.y))+'px';p.style.right='auto';p.style.bottom='auto'});
 h.addEventListener('pointerup',()=>{d=null;if(desCalc)desCalc.resize()});
 new ResizeObserver(()=>{if(desCalc)desCalc.resize()}).observe(p);
})();
$('desmos-btn').onclick=toggleDesmos;$('desmos-x').onclick=toggleDesmos;

const _R=(new URLSearchParams(location.search).get('retry')||'').split(',').filter(Boolean),D=_R.length?CFG.qs.filter(q=>_R.includes(String(q.n))):CFG.qs,N=D.length,KEY='clc-'+CFG.slug+(_R.length?'-retry':'');
let name="",picks=Array(N).fill(""),endAt=0,tmr=null,submitted=false;
$('badge').textContent=CFG.badge+(_R.length?' · Retry of missed questions':'');$('ttl').textContent=CFG.title;
$('intro').textContent=N+' multiple-choice questions. Choose one answer per question.'+(CFG.minutes?(' You have '+CFG.minutes+' minutes — the timer starts when you press Begin and the test is submitted automatically when time runs out.'):' There is no time limit.')+' The Desmos calculator is available at any time (top right). Your results, with a full explanation for every question, can be saved as a PDF for your teacher.';
const sid=()=>name.trim().normalize('NFKC').toLocaleLowerCase();
const hist=()=>{const h=LS.get(KEY);return Array.isArray(h)?h:[]};
function stats(){const a=hist().filter(x=>x.s===sid());return{n:a.length,best:a.length?Math.max(...a.map(x=>x.c)):0}}
function histText(){const s=stats();return 'Attempts: '+s.n+' · High score: '+s.best+' / '+N+' ('+Math.round(100*s.best/N)+'%)'}
$('nm').addEventListener('input',()=>{name=$('nm').value;$('nmerr').classList.add('hide');const s=stats();$('hist').textContent=s.n?histText():''});
function buildTest(){
 let last=null,h='';
 D.forEach((d,i)=>{
  if(d.sec&&d.sec!==last){h+=`<h2 style="margin-top:26px">${esc(d.sec)}</h2>`;last=d.sec}
  h+=`<section class="card"><h2>Question ${d.n}${d.sec?' <span class="badge">· '+esc(d.sec)+'</span>':''}</h2><img class="q" alt="Question ${d.n}" src="${d.img}"><fieldset aria-label="Answer for question ${d.n}">${'ABCD'.split('').map(l=>`<label><input type="radio" name="q${i}" value="${l}">${l}</label>`).join('')}</fieldset></section>`;
 });
 $('qs').innerHTML=h;
 document.querySelectorAll('#qs input').forEach(r=>r.addEventListener('change',()=>{picks[+r.name.slice(1)]=r.value;prog();}));
}
function prog(){const n=picks.filter(Boolean).length;$('prog').textContent=n+' / '+N+' answered';$('barf').style.width=(100*n/N)+'%';$('warn').textContent='';$('submit').textContent='Finish test';confirmSub=false}
function show(id){['s-name','s-test','s-res'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function tick(){const left=(endAt-Date.now())/1000;$('tm').textContent='⏱ '+fmt(left);$('tm').classList.toggle('low',left<=60);if(left<=0){clearInterval(tmr);finish(true)}}
function begin(){
 const v=$('nm').value.trim();if(!v){$('nmerr').classList.remove('hide');$('nm').focus();return}
 name=v;submitted=false;picks=Array(N).fill('');$('who').textContent=name;buildTest();prog();show('s-test');
 if(CFG.minutes&&!_R.length){$('tm').classList.remove('hide');endAt=Date.now()+CFG.minutes*60000;clearInterval(tmr);tmr=setInterval(tick,250);tick()}
}
$('start').onclick=begin;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
let confirmSub=false;
$('submit').onclick=()=>{const left=picks.filter(p=>!p).length;if(left&&!confirmSub){confirmSub=true;$('warn').textContent=left+' unanswered — click again to submit anyway.';$('submit').textContent='Submit anyway';return}finish(false)};
const st=i=>!picks[i]?'na':picks[i]===D[i].key?'ok':'bad';
const LAB={ok:'Correct',bad:'Incorrect',na:'Unanswered'};
function block(i){const d=D[i],s=st(i);
 return `<div class="rq r-${s}"><strong>Question ${d.n}${d.sec?' · '+esc(d.sec):''}</strong> — <span class="${s}">${LAB[s]}</span><br><span class="note">Your answer: <b>${picks[i]||'—'}</b> · Correct answer: <b>${d.key}</b></span><img class="q" alt="Question ${d.n}" src="${d.img}"><div class="exp"><b>Explanation.</b> ${esc(d.exp)}</div></div>`}
function finish(timeUp){
 if(submitted)return;submitted=true;clearInterval(tmr);
 const right=D.filter((_,i)=>st(i)==='ok').length,ans=picks.filter(Boolean).length,pct=Math.round(100*right/N);
 const h=hist();h.push({s:sid(),n:name,c:right,d:new Date().toISOString()});LS.set(KEY,h);try{window.clcReport&&clcReport({src:'cb',correct:right,total:N})}catch(_e){}
 const secs=[...new Set(D.map(d=>d.sec).filter(Boolean))];
 const secTxt=secs.map(s=>{const ix=D.map((d,i)=>d.sec===s?i:-1).filter(i=>i>=0);return s+': '+ix.filter(i=>st(i)==='ok').length+' / '+ix.length}).join(' · ');
 const sub='Answered: '+ans+' / '+N+' · Incorrect: '+(ans-right)+' · Unanswered: '+(N-ans)+(timeUp?' · Time expired — test submitted automatically':'');
 $('rname').textContent=name;$('rscore').textContent=right+' / '+N+' ('+pct+'%)';$('rsub').textContent=sub;$('rsec').textContent=secTxt;$('rhist').textContent=histText();
 $('review').innerHTML=D.map((_,i)=>block(i)).join('');
 const date=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
 const tbl=`<table><thead><tr><th>#</th><th>Your answer</th><th>Correct</th><th>Result</th></tr></thead><tbody>${D.map((d,i)=>{const s=st(i);return `<tr><td>${d.sec?esc(d.sec)+' ':''}${d.n}</td><td>${picks[i]||'—'}</td><td>${d.key}</td><td class="${s}">${LAB[s]}</td></tr>`}).join('')}</tbody></table>`;
 $('report').innerHTML=`<div class="card"><p class="badge">${esc(CFG.badge)}</p><h1>${esc(CFG.title)}</h1><p><b>Student:</b> ${esc(name)} &nbsp;·&nbsp; <b>Date:</b> ${date}</p><div class="score">Score: ${right} / ${N} (${pct}%)</div><p>${esc(sub)}</p>${secTxt?'<p>'+esc(secTxt)+'</p>':''}<p class="note">${esc(histText())}</p></div>${tbl}<h2 style="margin-top:18px">Question review and explanations</h2>${D.map((_,i)=>block(i)).join('')}`;
 show('s-res');
}
$('pdf').onclick=()=>{const t=document.title;document.title=CFG.title+' — '+name;window.print();setTimeout(()=>document.title=t,600)};
$('retry').onclick=()=>{$('nm').value=name;const s=stats();$('hist').textContent=s.n?histText():'';show('s-name')};
</script>
