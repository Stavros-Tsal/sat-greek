 rate.", "tip": "Treat \\(f(3)=2\\) and \\(f(7)=18\\) exactly like coordinate points to find the slope, then step forward from the CLOSER known point to \\(x=10\\).", "trap": "Trying to find f(10) by assuming a proportional (multiplicative) relationship between the two given values, rather than a constant additive rate, gives a wrong result since linear functions (unless through the origin) don't scale proportionally.", "fastest": ["slope \\(= (18-2)/(7-3) = 16/4 = 4\\)", "\\(f(10) = f(7) + 4(10-7) = 18 + 12\\)", "\\(f(10) = 30\\)"], "desmos": ["Not needed."], "svg": null, "num": 81}, {"id": "linear_functions_22", "skill": "linear_functions", "difficulty": "Hard", "type": "spr", "stem": "Linear function g satisfies \\(g(-2) = 9\\) and \\(g(4) = -3\\). What is g(1)?", "choices": null, "correct": "3", "rule": "Find the slope from the two given function values, then use either point to evaluate at the new input.", "tip": "Since \\(x=1\\) lies exactly halfway between −2 and 4, you can average the two given outputs directly — but computing the slope and stepping from the nearer point works just as well and generalizes better.", "trap": "Assuming \\(x=1\\) is the midpoint and averaging the OUTPUTS is only valid here because 1 truly is the midpoint of −2 and 4 — applying that shortcut when the target isn't the midpoint gives a wrong answer.", "fastest": ["slope \\(= (-3-9)/(4-(-2)) = -12/6 = -2\\)", "\\(g(1) = g(-2) + (-2)(1-(-2)) = 9 - 6\\)", "\\(g(1) = 3\\)"], "desmos": ["Not needed."], "svg": null, "num": 82}, {"id": "linear_functions_23", "skill": "linear_functions", "difficulty": "Hard", "type": "spr", "stem": "A line passes through (1, 4) and (5, −2). What is the slope of a line perpendicular to it and passing through the origin, expressed as a fraction?", "choices": null, "correct": "2/3", "rule": "Find the original line's slope first, then take the negative reciprocal for the perpendicular slope — the point (0,0) determines the equation but not the slope itself.", "tip": "Compute the original slope carefully first; the fact that the perpendicular line passes through the origin doesn't change how you find its slope, only its y-intercept (which is 0).", "trap": "Forgetting to negate when flipping the fraction (getting \\(3/2\\) instead of \\(2/3\\), or \\(-3/2\\) left unflipped) are the two most common perpendicular-slope errors.", "fastest": ["Original slope \\(= (-2-4)/(5-1) = -6/4 = -3/2\\)", "Perpendicular slope = negative reciprocal \\(= 2/3\\)"], "desmos": ["Not needed."], "svg": null, "num": 83}, {"id": "linear_functions_24", "skill": "linear_functions", "difficulty": "Medium", "type": "spr", "stem": "Line 1 has equation \\(y = (k/3)x - 5\\). Line 1 is parallel to a second line that passes through (0, −5) and (6, 1). What is the value of k?", "choices": null, "correct": "3", "rule": "Parallel lines share the same slope; find the second line's slope from its two points and set it equal to line 1's slope expression.", "tip": "Compute the second line's slope as an ordinary two-point slope first, then set \\(k/3\\) equal to that number and solve for k.", "trap": "Setting k itself (instead of k/3) equal to the computed slope skips a step and gives an answer 3 times too large.", "fastest": ["slope of second line \\(= (1-(-5))/(6-0) = 6/6 = 1\\)", "\\(k/3 = 1\\)", "\\(k = 3\\)"], "desmos": ["Not needed."], "svg": null, "num": 84}, {"id": "linear_functions_25", "skill": "linear_functions", "difficulty": "Medium", "type": "spr", "stem": "For the linear function \\(f(x) = 4x - 7\\), what is the value of \\([f(x + h) - f(x)] / h\\), for any nonzero h?", "choices": null, "correct": "4", "rule": "For any linear function, this expression (the difference quotient) always simplifies to the function's constant slope, regardless of x or h.", "tip": "Expand \\(f(x+h)\\) fully first, then subtract f(x) — the x-terms and constant will cancel, leaving only a multiple of h that divides out cleanly.", "trap": "Substituting a specific numeric value for x or h (instead of keeping them as variables) can obscure the fact that the expression is constant for every valid input.", "fastest": ["\\(f(x+h) = 4(x+h) - 7 = 4x + 4h - 7\\)", "\\(f(x+h) - f(x) = 4h\\)", "\\(4h / h = 4\\)"], "desmos": ["Not needed."], "svg": null, "num": 85}, {"id": "linear_functions_26", "skill": "linear_functions", "difficulty": "Hard", "type": "spr", "stem": "If \\(f(x) = (2/5)x + 3\\), what value of x satisfies \\(f(x) = 11\\)? (This is the value of f⁻¹(11).)", "choices": null, "correct": "20", "rule": "Finding f⁻¹(11) means finding the input x that produces an output of 11 — set f(x) equal to 11 and solve.", "tip": "Rather than deriving the full inverse function symbolically, it's often faster to just set the given expression equal to the target output and solve directly for x.", "trap": "Confusing f⁻¹(11) with \\(1/f(11)\\) (treating the −1 exponent as a reciprocal instead of function-inverse notation) leads to solving a completely different, incorrect problem.", "fastest": ["\\((2/5)x + 3 = 11\\)", "\\((2/5)x = 8\\)", "\\(x = 8 \\times (5/2) = 20\\)"], "desmos": ["Not needed."], "svg": null, "num": 86}, {"id": "linear_functions_27", "skill": "linear_functions", "difficulty": "Medium", "type": "spr", "stem": "If \\(f(x) = 3x - 2\\) and \\(g(x) = x + 4\\), what is the value of f(g(2))?", "choices": null, "correct": "16", "rule": "Evaluate the inner function first, then use that result as the input to the outer function.", "tip": "Work from the inside out: compute g(2) completely as a single number before plugging it into f.", "trap": "Evaluating f and g separately at \\(x=2\\) and then combining them some other way (like multiplying the two results) instead of composing them in the correct order gives a wrong value.", "fastest": ["\\(g(2) = 2 + 4 = 6\\)", "\\(f(g(2)) = f(6) = 3(6) - 2\\)", "\\(= 16\\)"], "desmos": ["Not needed."], "svg": null, "num": 87}, {"id": "linear_functions_28", "skill": "linear_functions", "difficulty": "Medium", "type": "spr", "stem": "The table shows values of linear function h: \\(h(1) = 5\\) and \\(h(3) = 13\\). What is h(5)?", "choices": null, "correct": "21", "rule": "Find the constant rate of change between the known points, then extend it forward by the same rate.", "tip": "Since \\(x=5\\) is the same distance from \\(x=3\\) as \\(x=3\\) is from \\(x=1\\), you can add the same output-change (found between the first two points) once more.", "trap": "Assuming the function doubles or scales by some ratio (since the x-values look evenly spaced) instead of correctly adding a constant amount each step is a common misconception with linear tables.", "fastest": ["rate \\(= (13-5)/(3-1) = 8/2 = 4\\)", "\\(h(5) = h(3) + 4(5-3) = 13 + 8\\)", "\\(h(5) = 21\\)"], "desmos": ["Not needed."], "svg": null, "num": 88}, {"id": "linear_functions_29", "skill": "linear_functions", "difficulty": "Hard", "type": "spr", "stem": "The points (1, 2), (3, 8), and (5, k) all lie on the same line. What is the value of k?", "choices": null, "correct": "14", "rule": "If three points are collinear, the slope between any two of them must be identical.", "tip": "Use the first two points (which are fully known) to find the slope, then apply that same slope from the second point to the third to solve for k.", "trap": "Computing the slope using the unknown point too early (before it's determined) creates a circular equation — always find the slope from the two FULLY known points first.", "fastest": ["slope from (1,2) to (3,8) = (8−2)/(3−1) = 3", "\\(k = 8 + 3(5-3) = 8 + 6\\)", "\\(k = 14\\)"], "desmos": ["Not needed."], "svg": null, "num": 89}, {"id": "linear_functions_30", "skill": "linear_functions", "difficulty": "Hard", "type": "spr", "stem": "A cooling object's temperature is modeled by a linear function of time. At \\(t = 0\\) minutes, the temperature is 68°F, and at \\(t = 5\\) minutes, it is 53°F. At what time t, in minutes, will the temperature reach 38°F?", "choices": null, "correct": "10", /><text x=\"228\" y=\"35\" font-size=\"9\" fill=\"#23201C\">2y=x+6</text></svg>", "num": 196}, {"id": "systems_17", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "In a system, \\(3x + 4y = 12\\) and \\(6x + 8y = k\\). The system has infinitely many solutions for exactly one value of k. What is the value of \\(\\dfrac{k}{4}\\)?", "choices": null, "correct": "6", "rule": "Infinitely many solutions require the second equation to be an exact scalar multiple of the first.", "tip": "Notice the second equation's x and y coefficients are exactly double the first's &mdash; the constant must be doubled too, by that same factor.", "trap": "Forgetting the question asks for k DIVIDED BY 4 (not k itself) after finding \\(k=24\\) is an easy final-step slip.", "fastest": ["\\(6x+8y\\) is exactly \\(2 \\times (3x+4y)\\), so \\(k = 2(12) = 24\\)", "\\(24/4 = 6\\)"], "desmos": ["Not needed."], "svg": null, "num": 197}, {"id": "systems_18", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "Tickets to a show cost $8 for children and $12 for adults. A group of 15 people paid a total of $148. How many children were in the group?", "choices": null, "correct": "8", "rule": "Set up two equations: one for the total number of people, one for the total cost, then solve the system.", "tip": "Use substitution: express adults as (15 &minus; children) from the people equation, then plug that into the cost equation.", "trap": "Accidentally swapping which price ($8 or $12) belongs to which group (children vs. adults) reverses the whole setup and gives the wrong count.", "fastest": ["\\(c + a = 15 \\to a = 15 - c\\)", "\\(8c + 12(15-c) = 148\\)", "\\(8c + 180 - 12c = 148 \\to -4c = -32 \\to c = 8\\)"], "desmos": ["Not needed."], "svg": null, "num": 198}, {"id": "systems_19", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "If \\(x + y = 12\\) and \\(x - y = 4\\), what is the value of \\(x^2 - y^2\\)?", "choices": null, "correct": "48", "rule": "Recognize the difference-of-squares identity: \\(x^2 - y^2 = (x + y)(x - y)\\).", "tip": "Don't solve for x and y individually first &mdash; multiply the two given sums directly using the difference-of-squares shortcut, which is much faster.", "trap": "Solving for x and y first (x=8, y=4) and then squaring and subtracting works but takes far longer than recognizing the factoring shortcut.", "fastest": ["\\(x^2 - y^2 = (x+y)(x-y)\\)", "\\(= (12)(4) = 48\\)"], "desmos": ["Not needed."], "svg": null, "num": 199}, {"id": "systems_20", "skill": "systems", "difficulty": "Medium", "type": "mc", "stem": "A system of two linear equations has no solution. One equation is \\(3x - y = 7\\). Which could be the other equation?", "choices": {"A": "\\(6x - 2y = 10\\)", "B": "\\(3x + y = 7\\)", "C": "\\(6x - 2y = 14\\)", "D": "\\(x - 3y = 7\\)"}, "correct": "A", "rule": "No solution requires the same slope but a different y-intercept (parallel, non-identical lines).", "tip": "Convert the given equation to slope-intercept form first \\((y=3x-7)\\) so the target slope (3) is easy to compare against each choice.", "trap": "Picking a choice with the same slope AND the same intercept (which would actually give infinitely many solutions, not no solution) is the trap baked into one of the distractors.", "fastest": ["\\(3x-y=7 \\to y=3x-7\\) (slope 3)", "Check \\(6x-2y=10 \\to y=3x-5\\) (slope 3, different intercept from &minus;7) &rarr; parallel, no solution"], "desmos": ["Not needed."], "svg": null, "num": 200}, {"id": "systems_21", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "Solve the system: \\(3x + 2y = 16\\) and \\(x - y = 2\\). What is the value of \\(x + y\\)?", "choices": null, "correct": "6", "rule": "Solve the simpler equation for one variable, substitute into the other, then add the resulting x and y values.", "tip": "Since \\(x - y = 2\\) solves easily for x \\((x = y + 2)\\), substitute that directly into the first equation rather than using elimination.", "trap": "Solving for x and y correctly but then reporting just one of them (instead of their sum, as the question asks) is a common incomplete-answer trap.", "fastest": ["\\(x = y + 2\\)", "\\(3(y+2) + 2y = 16 \\to 5y + 6 = 16 \\to y = 2\\)", "\\(x = 4\\), so \\(x + y = 6\\)"], "desmos": ["Not needed."], "svg": null, "num": 201}, {"id": "systems_22", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "Solve the system: \\(4x - 3y = 1\\) and \\(2x + y = 13\\). What is the value of \\(x - y\\)?", "choices": null, "correct": "-1", "rule": "Solve the simpler equation for one variable, substitute into the other equation, then compute the requested combination.", "tip": "Solve \\(2x + y = 13\\) for y \\((y = 13 - 2x)\\) since it isolates cleanly, then substitute into the first equation.", "trap": "Substituting into the wrong equation, or substituting an expression for x instead of y when the second equation was solved for y, is a common bookkeeping slip.", "fastest": ["\\(y = 13 - 2x\\)", "\\(4x - 3(13-2x) = 1 \\to 10x - 39 = 1 \\to x = 4\\)", "\\(y = 13 - 8 = 5\\), so \\(x - y = -1\\)"], "desmos": ["Not needed."], "svg": null, "num": 202}, {"id": "systems_23", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "A theater sold 200 tickets for a total of $1,300. Adult tickets cost $8 and child tickets cost $5. How many adult tickets were sold?", "choices": null, "correct": "100", "rule": "Set up two equations — one for the total number of tickets, one for the total revenue — then solve the system.", "tip": "Let a = number of adult tickets and c = number of child tickets; write one equation for the count and one for the money, then eliminate one variable.", "trap": "Writing the revenue equation with the ticket prices reversed (8c + 5a instead of 8a + 5c) silently swaps which variable represents which ticket type.", "fastest": ["\\(a + c = 200 \\to c = 200 - a\\)", "\\(8a + 5(200-a) = 1300 \\to 3a + 1000 = 1300\\)", "\\(3a = 300 \\to a = 100\\)"], "desmos": ["Not needed."], "svg": null, "num": 203}, {"id": "systems_24", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "Solve the system: \\(x/2 + y/3 = 7\\) and \\(x + y = 18\\). What is the value of y?", "choices": null, "correct": "12", "rule": "Clear the fraction in the first equation by multiplying through by the least common denominator, then solve the resulting system normally.", "tip": "Multiply the entire first equation by 6 to clear both denominators at once, turning it into a standard integer-coefficient equation before combining with the second.", "trap": "Multiplying only the \\(x/2\\) term by 6 (and not the \\(y/3\\) term or the right side) leaves a mismatched equation that doesn't represent the original relationship.", "fastest": ["Multiply eq. 1 by 6: \\(3x + 2y = 42\\)", "From eq. 2: \\(x = 18 - y \\to 3(18-y) + 2y = 42\\)", "\\(54 - y = 42 \\to y = 12\\)"], "desmos": ["Not needed."], "svg": null, "num": 204}, {"id": "systems_25", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "For what value of k does the system \\(kx + 2y = 6\\) and \\(3x + 4y = 8\\) have no solution?", "choices": null, "correct": "3/2", "rule": "A system of two linear equations has no solution when the lines are parallel but distinct — meaning their slopes match but their intercepts don't.", "tip": "Convert both equations to slope-intercept form (or compare coefficient ratios directly) and set the coefficient ratios for x and y equal to each other — then verify the constant ratio is different.", "trap": "Setting the ENTIRE ratio (including the constant term) equal, which would instead find the value of k that makes the lines identical (infinitely many solutions) rather than parallel and distinct.", "fastest": ["For parallel lines: \\(k/3 = 2/4\\)", "\\(k = 3/2\\)", "(Check: constants \\(6/8 \\ne 2/4\\), confirming distinct parallel lines — no solution)"], "desmos": ["Not needed."], "svg": null, "num": 205}, {"id": "systems_26", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "For what value of k does the system \\(kx + 2y = 6\\) and \\(3x + 4y = 12\\) have infinitely many solutions?", "choices": null, "correct": "3/2", "rule": "A system has infinitely many solutions when the two equations describe the exact same line — every ratio of corresponding coefficients (including the constants) must be equal.", "tip": "Set up the ratio \\(k/3 = 2/4 = 6/12\\) and confirm all three ratios truly are equal — this is what distinguishes 'infinitely many solutions' from the 'no solution' case with similar-looking equations.", "trap": "Finding a value of k that matches only the variable-coefficient ratios (as in the no-solution case) without checking that the constant ratio ALSO matches would incorrectly treat a parallel-distinct system as coincident.", "fastest": ["Check constant ratio: \\(6/12 = 1/2\\), matching \\(2/4 = 1/2\\)", "So \\(k/3\\) must also equal \\(1/2\\)", "\\(k = 3/2\\)"], "desmos": ["Not needed."], "svg": null, "num": 206}, {"id": "systems_27", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "Solve the system: \\(2x + 3y = 18\\) and \\(5x - 4y = -1\\). What is the value of x?", "choices": null, "correct": "3", "rule": "When neither variable has matching or opposite coefficients, multiply each equation by a suitable factor so one variable's coefficients become opposites, then add.", "tip": "Multiply the first equation by 4 and the second by 3 so the y-coefficients become \\(+12\\) and \\(-12\\) — then adding the equations eliminates y entirely.", "trap": "Multiplying only one of the two equations (instead of both) fails to make the coefficients true opposites, so adding the equations won't actually eliminate a variable.", "fastest": ["×4: \\(8x + 12y = 72\\) ; ×3: \\(15x - 12y = -3\\)", "Add: \\(23x = 69\\)", "\\(x = 3\\)"], "desmos": ["Not needed."], "svg": null, "num": 207}, {"id": "systems_28", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "A jar contains only quarters and dimes, 50 coins in total, worth $9.35. How many quarters are in the jar?", "choices": null, "correct": "29", "rule": "Set up one equation for the total count of coins and one for their total value, then solve the resulting system.", "tip": "Write the value equation in dollars (0.25 per quarter, 0.10 per dime) to match the $9.35 total, keeping units consistent throughout.", "trap": "Mixing units (using cents for one equation and dollars for the other, such as writing 25q + 10d = 9.35) produces a value 100 times too small on one side.", "fastest": ["\\(q + d = 50 \\to d = 50 - q\\)", "\\(0.25q + 0.10(50-q) = 9.35 \\to 0.15q + 5 = 9.35\\)", "\\(0.15q = 4.35 \\to q = 29\\)"], "desmos": ["Not needed."], "svg": null, "num": 208}, {"id": "systems_29", "skill": "systems", "difficulty": "Medium", "type": "spr", "stem": "Solve the system: \\(3x + 4y = 26\\) and \\(x - 2y = -8\\). What is the value of \\(x + 2y\\)?", "choices": null, "correct": "12", "rule": "Solve for one variable using the simpler equation, substitute into the other, then compute the requested expression.", "tip": "Solve \\(x - 2y = -8\\) for x \\((x = 2y - 8)\\) since it's already nearly isolated, then substitute into the first equation.", "trap": "After finding x and y individually, plugging them into the WRONG combination (like \\(x - 2y\\) instead of x + 2y) undoes the careful solving with a final misread.", "fastest": ["\\(x = 2y - 8\\)", "\\(3(2y-8) + 4y = 26 \\to 10y - 24 = 26 \\to y = 5\\)", "\\(x = 2\\), so \\(x + 2y = 2 + 10 = 12\\)"], "desmos": ["Not needed."], "svg": null, "num": 209}, {"id": "systems_30", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "The sum of the ages of two siblings is 63. The older sibling's age is 3 more than twice the younger sibling's age. What is the older sibling's age?", "choices": null, "correct": "43", "rule": "Translate each sentence into an equation using two variables, then solve the resulting system by substi  "A movie theater sells adult tickets for $12 and child tickets for $8. On a certain day, the theater sold a total of 150 tickets for a total of $1,560. How many adult tickets were sold?", "choices": null, "correct": "90", "rule": "Set up two equations: one for the total number of tickets and one for the total revenue, then solve the resulting system.", "tip": "Let a = adult tickets and c = child tickets; write \\(a+c=150\\) for the count and \\(12a+8c=1560\\) for the revenue, then solve.", "trap": "Setting up the revenue equation with the wrong price attached to each variable (swapping which price goes with adults vs. children) reverses the entire answer.", "fastest": ["\\(c = 150 - a\\)", "\\(12a + 8(150-a) = 1560\\)", "\\(12a + 1200 - 8a = 1560 \\to 4a = 360 \\to a = 90\\)"], "desmos": ["Not needed."], "svg": null, "num": 233}, {"id": "systems_54", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "\\(3x - 2y = 7\\)<br>\\(-6x + 4y = k\\)<br>For what value of k does this system have infinitely many solutions?", "choices": null, "correct": "-14", "rule": "For infinitely many solutions, the second equation must be an exact scalar multiple of the first, including the constant term.", "tip": "Multiply the entire first equation by the same factor that relates its x-coefficient to the second equation's x-coefficient (here, &minus;2), and apply that factor to the constant too.", "trap": "Matching only the coefficients of x and y (confirming the equations are parallel) while forgetting to also check that the constant term scales the SAME way gives a value of k that only produces a parallel, non-identical line (no solution instead of infinite solutions).", "fastest": ["Multiply eq 1 by \\(-2\\): \\(-6x+4y = -14\\)", "For the equations to be identical (infinitely many solutions), k must equal \\(-14\\)"], "desmos": ["Not needed."], "svg": null, "num": 234}, {"id": "systems_55", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "The sum of two numbers is 45. Three times the smaller number is 5 more than the larger number. What is the value of the smaller number?", "choices": null, "correct": "12.5", "rule": "Translate each sentence into its own equation using two variables, then solve the resulting system by substitution.", "tip": "Let s = smaller number and l = larger number; write \\(s+l=45\\) for the sum, and \\(3s = l+5\\) for the second condition, then substitute.", "trap": "Reversing which variable represents 'smaller' and which represents 'larger' in the second equation (swapping s and l) sets up an inconsistent system.", "fastest": ["\\(l = 45-s\\)", "\\(3s = (45-s)+5 = 50-s\\)", "\\(4s = 50 \\to s = 12.5\\)"], "desmos": ["Not needed."], "svg": null, "num": 235}, {"id": "systems_56", "skill": "systems", "difficulty": "Hard", "type": "mc", "stem": "A system of two linear equations is graphed, and the two lines are shown to have the same slope but different y-intercepts. What does this indicate about the system's solution set?", "choices": {"A": "The system has no solution", "B": "The system has exactly one solution", "C": "The system has infinitely many solutions", "D": "Cannot be determined without more information"}, "correct": "A", "rule": "Two distinct lines with the SAME slope are parallel and never intersect, meaning the system they represent has no solution.", "tip": "Recall the three possible outcomes for a system of two linear equations: different slopes (one solution), same slope and same intercept (infinite solutions), or same slope and different intercept (no solution).", "trap": "Confusing 'same slope' alone with 'the same line' overlooks that the DIFFERENT y-intercepts specifically rule out the lines being identical, leaving parallel-but-distinct as the only possibility.", "fastest": ["Same slope + different y-intercepts = parallel, non-identical lines", "Parallel lines never intersect → no solution"], "desmos": ["Not needed."], "svg": null, "num": 236}, {"id": "systems_57", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "\\(4x + y = 11\\)<br>\\(2x - 3y = -5\\)<br>What is the value of y in the solution to this system?", "choices": null, "correct": "3", "rule": "Solve one equation for a single variable, then substitute that expression into the other equation to solve for the remaining variable.", "tip": "Solve the first equation for y \\((y = 11-4x)\\), since it's already nearly isolated, then substitute into the second equation.", "trap": "Substituting into the WRONG equation (plugging the expression for y back into the same equation it came from) doesn't provide any new information and can't solve the system.", "fastest": ["\\(y = 11-4x\\)", "\\(2x-3(11-4x)=-5 \\to 2x-33+12x=-5 \\to 14x=28 \\to x=2\\)", "\\(y = 11-4(2) = 3\\)"], "desmos": ["Not needed."], "svg": null, "num": 237}, {"id": "systems_58", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "A chemist mixes a 20% acid solution with a 50% acid solution to create 12 liters of a 30% acid solution. How many liters of the 20% solution are needed?", "choices": null, "correct": "8", "rule": "Set up a system with one equation for the total volume and one equation for the total amount of pure acid, then solve.", "tip": "Let x = liters of the 20% solution; the remaining \\((12-x)\\) liters must be the 50% solution, and the acid amounts must add up correctly.", "trap": "Averaging the two percentages directly (assuming equal amounts of each solution) ignores that the actual mixture ratio must be solved algebraically to hit the specific target concentration.", "fastest": ["\\(0.20x + 0.50(12-x) = 0.30(12)\\)", "\\(0.20x + 6 - 0.50x = 3.6\\)", "\\(-0.30x = -2.4 \\to x = 8\\) liters"], "desmos": ["Not needed."], "svg": null, "num": 238}, {"id": "systems_59", "skill": "systems", "difficulty": "Hard", "type": "spr", "stem": "If (x, y) is a solution to the system \\(7x + 2y = 25\\) and \\(3x - 2y = 5\\), what is the value of x?", "choices": null, "correct": "3", "rule": r distractor in choice D.", "fastest": ["\\(-9 < -3x\\)", "Divide by \\(-3\\) and FLIP: \\(3 > x\\), i.e., \\(x < 3\\)"], "desmos": ["Not needed."], "svg": null, "num": 259}, {"id": "inequalities_20", "skill": "inequalities", "difficulty": "Hard", "type": "mc", "stem": "A store sells notebooks for $3 and pens for $2. Braden has at most $30 to spend and wants to buy at least 5 notebooks. Which combination of (notebooks, pens) satisfies both constraints?", "choices": {"A": "(8, 5)", "B": "(4, 6)", "C": "(5, 10)", "D": "(5, 5)"}, "correct": "D", "rule": "Translate both conditions into inequalities (a budget constraint and a minimum-quantity constraint), then check each choice against BOTH.", "tip": "Check the SIMPLER constraint first (at least 5 notebooks) to quickly eliminate choices, before doing the more effortful budget-total arithmetic.", "trap": "Checking only the budget total and forgetting to also verify the 'at least 5 notebooks' requirement lets a budget-satisfying but notebook-insufficient choice slip through.", "fastest": ["Constraints: \\(3n + 2p \\le 30\\) and \\(n \\ge 5\\)", "Test (5,5): cost \\(= 15+10=25 \\le 30\\) &check;, \\(n=5 \\ge 5\\) &check;"], "desmos": ["Not needed."], "svg": null, "num": 260}, {"id": "inequalities_21", "skill": "inequalities", "difficulty": "Medium", "type": "spr", "stem": "What is the smallest integer value of x that satisfies \\(-3x + 7 \\le 22\\)?", "choices": null, "correct": "-5", "rule": "Isolate x as usual, but remember to flip the inequality sign whenever you multiply or divide both sides by a negative number.", "tip": "After subtracting 7 from both sides, you'll divide by −3 — that's the exact moment the inequality sign must flip direction. Since the inequality is non-strict (≤ becomes ≥), the boundary value itself is included.", "trap": "Forgetting to flip the inequality sign when dividing by −3 gives \\(x \\le -5\\), which would make the answer 'no smallest integer' instead of the correct boundary value.", "fastes (12x > 200 \\to x > 16.67\\)", "Smallest whole number: \\(x = 17\\)"], "desmos": ["Not needed."], "svg": null, "num": 263}, {"id": "inequalities_24", "skill": "inequalities", "difficulty": "Medium", "type": "spr", "stem": "How many integer values of x satisfy \\(|2x - 3| < 7\\)?", "choices": null, "correct": "6", "rule": "An inequality \\(|\\text{expr}| < c\\) \\((c > 0)\\) is equivalent to the compound inequality \\(-c < \\text{expr} < c\\); solve for the range, then count integers within it.", "tip": "Rewrite the absolute value inequality as a three-part compound inequality first, solve for the full range, then count integers — remembering both endpoints are excluded since the inequality is strict.", "trap": "Including one or both endpoints (−2 or 5) in the count would be incorrect, since this is a strict inequality and neither boundary value is actually part of the solution set.", "fastest": ["\\(-7 < 2x - 3 < 7\\)", "Add 3, divide by 2: \\(-2 < x < 5\\)", "Integers −1 through 4: 6 values"], "desmos": ["Not needed."], "svg": null, "num": 264}, {"id": "inequalities_25", "skill": "inequalities", "difficulty": "Hard", "type": "mc", "stem": "What is the solution to \\(|x + 4| \\ge 6\\)?", "choices": {"A": "\\(x \\le -10\\) or \\(x \\ge 2\\)", "B": "\\(x \\ge 2\\)", "C": "\\(x \\le -10\\)", "D": "\\(-10 \\le x \\le 2\\)"}, "correct": "A", "rule": "An inequality \\(|\\text{expr}| \\ge c\\) \\((c > 0)\\) splits into two separate cases connected by 'or': \\(\\text{expr} \\ge c\\) or \\(\\text{expr} \\le -c\\).", "tip": "Solve both cases completely and separately, connecting them with 'or' rather than treating them as a single combined range — the solution set has two disconnected pieces.", "trap": "Choice D combines both boundary values into a single 'between' interval (as you would for a < inequality) instead of the correct two-branch 'or' structure required for a ≥ inequality.", "fastest": ["Case 1: \\(x + 4 \\ge 6 \\to x \\ge 2\\)", "Case 2: \\(x + 4 \\le -6 \\to x \\le -10\\)", "Solution: \\(x \\le -10\\) or \\(x \\ge 2\\)"], "desmos": ["Not needed."], "svg": null, "num": 265}, {"id": "inequalities_26", "skill": "inequalities", "difficulty": "Medium", "type": "mc", "stem": "Which of the following points satisfies the inequality \\(y > 2x - 3\\)?", "choices": {"A": "(3, 2)", "B": "(0, −5)", "C": "(1, 0)", "D": "(2, 1)"}, "correct": "C", "rule": "A point satisfies an inequality in two variables if substituting its coordinates makes the inequality a true statement.", "tip": "Substitute each point's x and y values directly into the inequality and check whether the resulting numerical statement is true — a point exactly ON the boundary line does NOT satisfy a strict inequality.", "trap": "Choice D lies exactly ON the boundary line \\(y = 2x - 3\\) (since 1 = 2(2)−3), which does NOT satisfy the strict inequality \\(y > 2x - 3\\) — a common point of confusion with strict vs. non-strict inequalities.", "fastest": ["Test (1,0): \\(2(1)-3 = -1\\), and \\(0 > -1\\) is true", "Test (2,1): \\(2(2)-3 = 1\\), and \\(1 > 1\\) is false (boundary point)", "(1,0) is the only point that works"], "desmos": ["Not needed."], "svg": null, "num": 266}, {"id": "inequalities_27", "skill": "inequalities", "difficulty": "Hard", "type": "mc", "stem": "Which of the following points satisfies BOTH \\(y \\le x + 2\\) and \\(y \\ge -x + 1\\)?", "choices": {"A": "(−3, 3)", "B": "(0, 2)", "C": "(0, −5)", "D": "(6, 10)"}, "correct": "B", "rule": "A point satisfies a system of inequalities only if it makes EVERY inequality in the system true simultaneously.", "tip": "Check each point against BOTH inequalities separately — a point can satisfy one inequality in the system while failing the other, so check all conditions before concluding.", "trap": "Stopping after confirming a point satisfies just the FIRST inequality (without checking the second) can lead to selecting a point that fails the overall system, since points D and C each satisfy only one of the two conditions.", "fastest": ["Test (0,2): \\(2\\le0+2=2\\) true (boundary); \\(2\\ge-0+1=1\\) true", "Both conditions hold for (0,2)", "Other choices fail at least one condition"], "desmos": ["Not needed."], "svg": null, "num": 267}, {"id": "inequalities_28", "skill": "inequalities", "difficulty": "Hard", "type": "spr", "stem": "An online store charges a flat $15 shipping fee plus $8 per item. If a customer has a budget of $100, what is the maximum whole number of items they can buy?", "choices": null, "correct": "10", "rule": "Write the total cost as an inequality that must be less than or equal to the budget, then solve and round down to a whole number of items.", "tip": "Since only whole items can be purchased, solve the inequality algebraically first, then round DOWN to the nearest integer — rounding up would exceed the budget.", "trap": "Rounding up to 11 items (the nearest whole number to 10.625) would actually cost more than the $100 budget allows — always round down for a maximum-quantity constraint.", "fastest": ["\\(15 + 8x \\le 100\\)", "\\(8x \\le 85 \\to x \\le 10.625\\)", "Maximum whole number of items: 10"], "desmos": ["Not needed."], "svg": null, "num": 268}, {"id": "inequalities_29", "skill": "inequalities", "difficulty": "Medium", "type": "spr", "stem": "What is the smallest integer value of x that satisfies \\((x - 2)/3 \\ge 4\\)?", "choices": null, "correct": "14", "rule": "Clear the fraction by multiplying both sides by the denominator, then isolate x to find the boundary of the solution set.", "tip": "Multiply both sides by 3 (a positive number, so the inequality direction stays the same) before adding 2 to isolate x — since the inequality is non-strict, the boundary value itself is included.", "trap": "Assuming the smallest integer must be one MORE than the boundary (as with a strict inequality) overlooks that ≥ already includes the boundary value itself.", "fastest": ["Multiply by 3: \\(x - 2 \\ge 12\\)", "Add 2: \\(x \\ge 14\\)", "Smallest integer sa const SKILLS = [["linear_one_var", "Linear Equations in One Variable"], ["linear_functions", "Linear Functions"], ["linear_two_var", "Linear Equations in Two Variables"], ["systems", "Systems of Two Linear Equations in Two Variables"], ["inequalities", "Linear Inequalities in One or Two Variables"]];
const SKILL_LABEL = {}; SKILLS.forEach(s => SKILL_LABEL[s[0]] = s[1]);
const ORDERED_QUESTIONS = [];
SKILLS.forEach(([skey]) => {
  ['Easy','Medium','Hard'].forEach(diff => {
    QUESTIONS.forEach((q, i) => { if (q.skill === skey && q.difficulty === diff) ORDERED_QUESTIONS.push(i); });
  });
});
const SKILL_NUM = {};
SKILLS.forEach(([skey]) => {
  ['Easy','Medium','Hard'].forEach(diff => {
    let n = 1;
    QUESTIONS.forEach(q => { if (q.skill === skey && q.difficulty === diff) SKILL_NUM[q.id] = n++; });
  });
});
window.QUESTIONS = QUESTIONS; window.SKILLS = SKILLS; window.SKILL_LABEL = SKILL_LABEL;

let state = { screen: 'intro', mode: null, selectedSkill: null, selectedDiffs: [],
  sessionOrder: [], current: null, answers: {}, flagged: {}, timeLeft: 0, timerId: null, timedMode: true,
  openSkill: null, openDifficulty: null, timerHidden: false, checked: {}, reportGroup: null };

function fmtTime(s) { const m = Math.floor(s/60), sec = s%60; return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0'); }

function startTimer() {
  if (!state.timedMode) return;
  const timerEl = document.getElementById('timer');
  timerEl.textContent = fmtTime(state.timeLeft);
  timerEl.style.color = 'var(--crimson)';
  if (state.timerHidden) timerEl.classList.add('hidden-timer');
  state.timerId = setInterval(() => {
    state.timeLeft--;
    const t = document.getElementById('timer');
    if (t) t.textContent = fmtTime(state.timeLeft);
    if (state.timeLeft <= 300 && t) t.style.color = '#B3261E';
    if (state.timeLeft <= 0) { clearInterval(state.timerId); showReview(true); }
  }, 1000);
}

function toggleTimerVisibility() {
  state.timerHidden = !state.timerHidden;
  const t = document.getElementById('timer');
  const btn = document.getElementById('hideTimerBtn');
  if (t) t.classList.toggle('hidden-timer', state.timerHidden);
  if (btn) btn.textContent = state.timerHidden ? 'Show Timer' : 'Hide Timer';
}

function openCalc() {
  window.open('https://www.desmos.com/calculator', 'clc_desmos', 'noopener');
  const toast = document.getElementById('calc-toast');
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 6000);
}

function toggleFlag() { const q = QUESTIONS[state.current]; state.flagged[q.id] = !state.flagged[q.id]; render(); }
function selectChoice(qid, letter) { if (state.locked) return; state.answers[qid] = letter; state.checked[qid] = false; render(); }
function sprInput(qid, val) { if (state.locked) return; state.answers[qid] = val; state.checked[qid] = false; }
function checkAnswer() {
  if (state.locked) return;
  const q = QUESTIONS[state.current];
  if (q.type === 'spr') {
    const el = document.querySelector('.spr-input');
    if (el) state.answers[q.id] = el.value;
  }
  const a = state.answers[q.id];
  if (a === undefined || a === null || a === '') return;
  state.checked[q.id] = true;
  render();
}
function revealAnswer() {
  const q = QUESTIONS[state.current];
  state.checked[q.id] = true;
  state.revealed = state.revealed || {};
  state.revealed[q.id] = true;
  render();
}
function sessionPos(idx) { return state.sessionOrder.indexOf(idx); }
function setCurrent(idx) {
  state.current = idx;
}
function goTo(idx) { setCurrent(idx); render(); }
function nextQ() { const pos = sessionPos(state.current); if (pos < state.sessionOrder.length-1) { setCurrent(state.sessionOrder[pos+1]); render(); } else { requestReview(); } }
function prevQ() { const pos = sessionPos(state.current); if (pos > 0) { setCurrent(state.sessionOrder[pos-1]); render(); } }
function toggleSkillPanel(skey) {
  if (state.openSkill === skey) { state.openSkill = null; state.openDifficulty = null; }
  else { state.openSkill = skey; state.openDifficulty = null; }
  render();
}
function toggleDifficultyPanel(skey, diff) {
  state.openSkill = skey;
  state.openDifficulty = (state.openDifficulty === diff) ? null : diff;
  render();
}
function formatEstTime(n) {
  const mins = Math.round(n * 1.5);
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0) return m > 0 ? `~${h}h ${m}m` : `~${h}h`;
  return `~${m} min`;
}

// ══ Mode selection & session setup ══

function backToIntro() {
  if (state.timerId) clearInterval(state.timerId);
  state.screen = 'intro';
  state.mode = null;
  state.selectedSkill = null;
  state.selectedDiffs = [];
  document.getElementById('toolbar').style.display = 'none';
  render();
}

function selectMode(mode) {
  state.mode = mode;
  if (mode === 'chapter') {
    startChapterReview();
  } else if (mode === 'skill') {
    state.screen = 'skillpick';
    render();
  } else if (mode === 'rapid') {
    startRapidFire();
  }
}

function showBrief(opts) {
  const o = document.getElementById('briefOverlay');
  const whole = opts.minutes >= 60 && opts.minutes % 60 === 0;
  const big = whole ? (opts.minutes / 60) : opts.minutes;
  const unit = whole ? (opts.minutes === 60 ? 'hour' : 'hours') : 'minutes';
  o.innerHTML = `<div class="brief-card" role="dialog" aria-modal="true">
    <div class="brief-kicker">Before you begin</div>
    <div class="brief-title">${opts.title}</div>
    <div class="brief-sub">${opts.subtitle}</div>
    <div class="brief-ring"><div class="br-num">${big}</div><div class="br-unit">${unit}</div></div>
    <div class="brief-stats">
      <div class="brief-stat"><b>${opts.count}</b><span>Questions</span></div>
      <div class="brief-stat"><b>${opts.minutes}</b><span>Minutes</span></div>
      <div class="brief-stat"><b>${opts.pace}</b><span>Per question</span></div>
    </div>
    <div class="brief-note">The timer starts as soon as you press <strong>Start</strong>. You can flag questions and move freely between them.</div>
    <div class="brief-actions">
      <button class="btn-ghost" onclick="closeBrief()">Cancel</button>
      <button class="btn-primary" onclick="confirmBrief()">Start &rarr;</button>
    </div>
  </div>`;
  window.__briefStart = opts.onStart;
  o.classList.add('show');
}
function closeBrief() { document.getElementById('briefOverlay').classList.remove('show'); window.__briefStart = null; }
function confirmBrief() { const fn = window.__briefStart; closeBrief(); if (fn) fn(); }
function paceText(minutes, count) { const sec = Math.round(minutes * 60 / count); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }


function startChapterReview() {
  showBrief({ title: 'Chapter Marathon', subtitle: 'All ' + QUESTIONS.length + ' Algebra questions, from the first skill to the last.',
    minutes: 180, count: QUESTIONS.length, pace: paceText(180, QUESTIONS.length),
    onStart: () => startSession(ORDERED_QUESTIONS.slice(), 180 * 60, true) });
}

function pickSkill(skey) {
  state.selectedSkill = skey;
  state.selectedDiffs = [];
  state.screen = 'diffpick';
  render();
}

function toggleDiffChoice(diff) {
  const i = state.selectedDiffs.indexOf(diff);
  if (i === -1) state.selectedDiffs.push(diff); else state.selectedDiffs.splice(i, 1);
  render();
}

function buildSkillOrder(skey, diffs) {
  const order = [];
  ['Easy','Medium','Hard'].forEach(d => {
    if (diffs.indexOf(d) === -1) return;
    QUESTIONS.forEach((q, i) => { if (q.skill === skey && q.difficulty === d) order.push(i); });
  });
  return order;
}

function startSkillReview() {
  if (state.selectedDiffs.length === 0) return;
  const order = buildSkillOrder(state.selectedSkill, state.selectedDiffs);
  const minutes = state.selectedDiffs.length <= 1 ? 35 : 75;
  showBrief({ title: 'Skill Builder', subtitle: SKILL_LABEL[state.selectedSkill] + ' \u00b7 ' + state.selectedDiffs.join(', '),
    minutes: minutes, count: order.length, pace: paceText(minutes, order.length),
    onStart: () => startSession(order, minutes * 60, true) });
}

function startRapidFire() {
  startSession(ORDERED_QUESTIONS.slice(), 0, false);
}

function startSession(order, seconds, timed) {
  state.sessionOrder = order;
  state.current = order[0];
  state.answers = {};
  state.flagged = {};
  state.checked = {};
  state.revealed = {};
  state.locked = false;
  state.timeLeft = seconds;
  state.timedMode = timed;
  state.openSkill = QUESTIONS[order[0]].skill;
  state.openDifficulty = null;
  state.reportGroup = null;
  state.screen = 'test';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('endReviewBtn').style.display = (state.mode === 'skill') ? 'none' : '';
  document.getElementById('timerWrap').style.display = timed ? 'flex' : 'none';
  document.getElementById('rapidBadge').style.display = timed ? 'none' : '';
  if (state.timerId) clearInterval(state.timerId);
  if (timed) startTimer();
  render();
}

function showReview(fromTest) {
  if (state.timerId) clearInterval(state.timerId);
  if (lockedMode()) state.locked = true; // Skill Builder / Speed Round: results are final
  state.reportGroup = (state.mode === 'skill') ? state.selectedSkill : null;
  state.screen = 'review';
  document.getElementById('toolbar').style.display = 'none';
  render();
}

function lockedMode() { return state.mode === 'skill' || state.mode === 'rapid'; }

// Skill Builder / Speed Round: explain what happens before results open (results are final, answers lock)
function requestReview(gkey) {
  const go = () => { if (gkey) showGroupReport(gkey); else showReview(true); };
  if (!lockedMode() || state.screen !== 'test') { go(); return; }
  const scope = gkey ? state.sessionOrder.filter(i => QUESTIONS[i].skill === gkey) : state.sessionOrder;
  const unanswered = scope.filter(i => { const a = state.answers[QUESTIONS[i].id]; return a === undefined || a === null || String(a).trim() === ''; }).length;
  const warn = unanswered > 0
    ? `<div class="rv-warn"><strong>${unanswered} question${unanswered === 1 ? ' is' : 's are'} still unanswered.</strong> Unanswered questions count as incorrect. Press <em>Keep Working</em> to go back and answer ${unanswered === 1 ? 'it' : 'them'}.</div>`
    : `<div class="rv-ok">All questions are answered.</div>`;
  const o = document.getElementById('briefOverlay');
  o.innerHTML = `<div class="brief-card" role="dialog" aria-modal="true" style="max-width:480px;">
    <div class="brief-kicker">Before you see your results</div>
    <div class="brief-title">Finish &amp; Review</div>
    ${warn}
    <ul class="rv-list">
      <li><b>Results are final.</b> Once you press <em>Show Results</em> your answers are locked &mdash; you cannot return to the questions or change anything.</li>
      <li>You will see <b>only the questions you got wrong</b> (or left blank), each with the correct answer and the full explanation.</li>
      <li>Want another attempt? Use <b>Reset</b> on the results page to clear everything and start over, or <b>Back to Menu</b> to leave.</li>
      <li>Not ready yet? Press <em>Keep Working</em> &mdash; nothing is lost.</li>
    </ul>
    <div class="brief-actions">
      <button class="btn-ghost" onclick="closeBrief()">Keep Working</button>
      <button class="btn-primary" onclick="confirmBrief()">Show Results &rarr;</button>
    </div>
  </div>`;
  window.__briefStart = go;
  o.classList.add('show');
}

function showGroupReport(gkey) {
  if (lockedMode()) state.locked = true; // Skill Builder / Speed Round: results are final
  state.reportGroup = gkey;
  if (state.timerId) clearInterval(state.timerId);
  state.screen = 'review';
  document.getElementById('toolbar').style.display = 'none';
  render();
}

function closeGroupReport() {
  state.locked = false;
  state.reportGroup = (state.mode === 'skill') ? state.selectedSkill : null;
  state.screen = 'test';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('endReviewBtn').style.display = (state.mode === 'skill') ? 'none' : '';
  document.getElementById('timerWrap').style.display = state.timedMode ? 'flex' : 'none';
  document.getElementById('rapidBadge').style.display = state.timedMode ? 'none' : '';
  if (state.timerId) clearInterval(state.timerId);
  if (state.timedMode) startTimer();
  render();
}

function resetSkill(skey) {
  if (!window.confirm('Reset all answers for ' + SKILL_LABEL[skey] + '? This cannot be undone.')) return;
  QUESTIONS.forEach(q => {
    if (q.skill === skey) {
      delete state.answers[q.id];
      delete state.flagged[q.id];
      delete state.checked[q.id];
      delete state.revealed[q.id];
    }
  });
  const firstIdx = state.sessionOrder.find(idx => QUESTIONS[idx].skill === skey);
  state.current = firstIdx >= 0 ? firstIdx : state.sessionOrder[0];
  closeGroupReport();
}

function resetAll() {
  if (!window.confirm('Reset this ENTIRE session \u2014 all answers, flags, and progress? This cannot be undone.')) return;
  state.answers = {};
  state.flagged = {};
  state.checked = {};
  state.revealed = {};
  state.locked = false;
  state.current = state.sessionOrder[0];
  state.reportGroup = (state.mode === 'skill') ? state.selectedSkill : null;
  state.timeLeft = state.mode === 'chapter' ? 180*60 : (state.mode === 'skill' ? (state.selectedDiffs.length<=1?35:75)*60 : 0);
  state.screen = 'test';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('endReviewBtn').style.display = (state.mode === 'skill') ? 'none' : '';
  document.getElementById('timerWrap').style.display = state.timedMode ? 'flex' : 'none';
  document.getElementById('rapidBadge').style.display = state.timedMode ? 'none' : '';
  if (state.timerId) clearInterval(state.timerId);
  if (state.timedMode) startTimer();
  render();
}

function normalize(s) { return String(s).trim().toLowerCase().replace(/\s+/g,''); }

function parseNumericAnswer(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/\$/g, '').replace(/,/g, '').replace(/\s+/g, '');
  if (s === '') return NaN;
  const fracMatch = s.match(/^(-?(?:\d+\.?\d*|\.\d+))\/(-?(?:\d+\.?\d*|\.\d+))$/);
  if (fracMatch) {
    const num = parseFloat(fracMatch[1]);
    const den = parseFloat(fracMatch[2]);
    return den !== 0 ? num / den : NaN;
  }
  if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return NaN;
}

// Number of decimal digits the student typed (Infinity for a fraction such as 8/3).
function decimalsIn(s) {
  s = String(s).trim().replace(/\$/g, '').replace(/,/g, '').replace(/\s+/g, '');
  if (s.indexOf('/') !== -1) return Infinity;
  const m = s.match(/\.(\d+)$/);
  return m ? m[1].length : 0;
}

// Strict grading (SAT-style):
//  - any exactly equivalent value is accepted (fraction, decimal, leading-dot, trailing zeros);
//  - if the key is a fraction with a non-terminating decimal, a decimal is accepted only when it has
//    at least 3 decimal places AND equals the correctly rounded or truncated value;
//  - if the question asks for rounding (roundedKey), a MORE precise answer that rounds to the key is accepted;
//  - nothing else is accepted (no +/- 0.01 tolerance).
function answersMatch(given, correct, roundedKey) {
  if (correct.indexOf('|') !== -1) {
    return correct.split('|').some(part => answersMatch(given, part.trim(), roundedKey));
  }
  if (correct.indexOf('RANGE:') === 0) {
    const bounds = correct.split(':');
    const lo = parseFloat(bounds[1]);
    const hi = parseFloat(bounds[2]);
    const numGiven = parseNumericAnswer(given);
    if (!isNaN(numGiven) && !isNaN(lo) && !isNaN(hi)) {
      return numGiven >= lo - 1e-9 && numGiven <= hi + 1e-9;
    }
    return false;
  }
  if (normalize(given) === normalize(correct)) return true;
  const g = parseNumericAnswer(given);
  const v = parseNumericAnswer(correct);
  if (isNaN(g) || isNaN(v)) return false;
  if (Math.abs(g - v) <= 1e-9 * Math.max(1, Math.abs(v))) return true;
  const kg = decimalsIn(given);
  if (correct.indexOf('/') !== -1) {
    if (kg === Infinity || kg < 3 || kg > 12) return false;
    const f = Math.pow(10, kg);
    const rounded = Number(v.toFixed(kg));
    const truncated = Math.trunc(v * f + (v > 0 ? 1e-9 : -1e-9)) / f;
    return Math.abs(g - rounded) < 1e-12 || Math.abs(g - truncated) < 1e-12;
  }
  if (roundedKey) {
    const d = decimalsIn(correct);
    if (kg > d && Math.abs(g - v) < 0.5 * Math.pow(10, -d) - 1e-9) return true;
  }
  return false;
}

function isCorrect(q) {
  const a = state.answers[q.id];
  if (a === undefined || a === null || a === '') return false;
  if (q.type === 'mc') return a === q.correct;
  return answersMatch(String(a), String(q.correct), /\bround(?:ed|ing)?\b|nearest|decimal place|tenth|hundredth|thousandth/i.test(q.stem || ''));
}

function renderPalette() {
  const skillsToShow = state.mode === 'skill' ? SKILLS.filter(([k]) => k === state.selectedSkill) : SKILLS;
  const allowedDiffs = state.mode === 'skill' ? state.selectedDiffs : ['Easy','Medium','Hard'];
  const showReviewTab = state.mode === 'skill'; // "purple" per-skill review only in Skill Builder mode
  let html = '<div id="palette">';
  skillsToShow.forEach(([skey, slabel]) => {
    const skillEntries = [];
    QUESTIONS.forEach((q, i) => { if (q.skill === skey && state.sessionOrder.indexOf(i) !== -1) skillEntries.push([q, i]); });
    const answeredCount = skillEntries.filter(([q]) => state.answers[q.id]).length;
    const flaggedCount = skillEntries.filter(([q]) => state.flagged[q.id]).length;
    const isOpen = state.openSkill === skey;
    html += `<div class="palette-skill ${isOpen ? 'open' : ''}">
      <button class="palette-skill-header" onclick="toggleSkillPanel('${skey}')">
        <span class="psh-chevron">&#9656;</span>
        <span class="psh-title">${slabel}</span>
        <span class="psh-progress">${answeredCount}/${skillEntries.length}</span>
      </button>
      <div class="palette-skill-collapse"><div class="palette-skill-inner">
        <div class="psh-submeta"><span>&#9201;&#65039; ${formatEstTime(skillEntries.length)}</span>${flaggedCount > 0 ? `<span class="psh-flag-badge">&#128278; ${flaggedCount}</span>` : ''}</div>
        <div class="diff-subgroups">`;
    allowedDiffs.forEach(diff => {
      const diffEntries = skillEntries.filter(([q]) => q.difficulty === diff);
      if (diffEntries.length === 0) return;
      const diffAnswered = diffEntries.filter(([q]) => state.answers[q.id]).length;
      const isDiffOpen = isOpen && state.openDifficulty === diff;
      html += `<div class="diff-subgroup ${isDiffOpen ? 'open' : ''}">
        <button class="diff-subgroup-header" onclick="toggleDifficultyPanel('${skey}','${diff}')">
          <span class="dsh-chevron">&#9656;</span>
          <span class="dsh-title">${diff}</span>
          <span class="dsh-progress">${diffAnswered}/${diffEntries.length}</span>
        </button>
        <div class="diff-subgroup-collapse"><div class="diff-subgroup-inner">
          <div class="pgrid">`;
      diffEntries.forEach(([q, i]) => {
        let cls = 'pbtn';
        if (state.answers[q.id]) cls += ' answered';
        if (i === state.current) cls += ' current';
        if (state.flagged[q.id]) cls += ' flagged';
        html += `<button class="${cls}" onclick="goTo(${i})">${SKILL_NUM[q.id]}</button>`;
      });
      html += `</div></div></div></div>`;
    });
    if (showReviewTab) {
      html += `<div class="diff-subgroup review-tab">
        <button class="diff-subgroup-header" onclick="requestReview('${skey}')">
          <span class="dsh-chevron">&#128196;</span>
          <span class="dsh-title">Review</span>
        </button>
      </div>`;
    }
    html += `</div>`;
    html += `</div></div></div>`;
  });
  html += '</div>';
  return html;
}

function renderQuestion() {
  const q = QUESTIONS[state.current];
  const diffClass = 'tag-diff-' + q.difficulty.toLowerCase();
  let choicesHtml = '';
  if (q.type === 'mc') {
    choicesHtml = '<div class="choices">';
    ['A','B','C','D'].forEach(letter => {
      if (!q.choices[letter]) return;
      const sel = state.answers[q.id] === letter ? 'selected' : '';
      choicesHtml += `<div class="choice ${sel}" onclick="selectChoice('${q.id}','${letter}')">
        <div class="letter">${letter}</div><div>${q.choices[letter]}</div></div>`;
    });
    choicesHtml += '</div>';
  } else {
    const val = state.answers[q.id] || '';
    choicesHtml = `<input class="spr-input" type="text" placeholder="Enter your answer" value="${val}"
      oninput="sprInput('${q.id}', this.value)">`;
  }
  const flagged = state.flagged[q.id];
  const figureHtml = q.svg ? `<div class="figure">${q.svg}</div>` : '';
  const hasAnswer = state.answers[q.id] !== undefined && state.answers[q.id] !== null && state.answers[q.id] !== '';
  const isChecked = !!state.checked[q.id];
  const isRevealed = !!(state.revealed && state.revealed[q.id]);
  let feedbackHtml = '';
  if (isRevealed && !(isChecked && hasAnswer)) {
    feedbackHtml = `<div class="check-feedback bad">Correct answer: ${q.correct}</div>
       <div class="rt-box rt-fastest"><span class="rt-label">Fastest Way to Solve</span><ol>${q.fastest.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
  } else if (isChecked && hasAnswer) {
    const correct = isCorrect(q);
    feedbackHtml = correct
      ? `<div class="check-feedback ok">&#10003; Correct!</div>`
      : `<div class="check-feedback bad">&#10007; Not quite &mdash; correct answer: ${q.correct}</div>
         <div class="rt-box rt-fastest"><span class="rt-label">Fastest Way to Solve</span><ol>${q.fastest.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
  }
  const pos = sessionPos(state.current);
  // Skill Builder & Speed Round: no Check/Show Answer — answers are revealed only at the end (wrong ones only)
  const noCheck = state.mode === 'skill' || state.mode === 'rapid';
  if (noCheck) feedbackHtml = '';
  return `
  <div id="main">
    <div class="card">
      <div class="qmeta">
        <span class="qnum">Question ${SKILL_NUM[q.id]}</span>
        <span class="tag tag-skill">${SKILL_LABEL[q.skill]}</span>
        <span class="tag ${diffClass}">${q.difficulty}</span>
      </div>
      <div class="stem">${q.stem}</div>
      ${figureHtml}
      ${choicesHtml}
      ${noCheck ? '' : `<div class="check-row"><button class="btn-ghost" onclick="checkAnswer()">Check Answer</button></div>`}
      ${feedbackHtml}
      <div class="navbtns">
        <div><button class="btn-ghost" onclick="prevQ()" ${pos===0?'disabled':''}>Back</button></div>
        <div><button class="flagbtn ${flagged?'on':''}" onclick="toggleFlag()">${flagged?'Flagged':'Flag for Review'}</button>
        <button class="btn-primary" onclick="nextQ()">${pos===state.sessionOrder.length-1?'Finish':'Next'}</button></div>
      </div>
    </div>
  </div>`;
}

function renderReview() {
  const reportMode = !!state.reportGroup;
  const reviewQuestions = reportMode
    ? state.sessionOrder.filter(idx => QUESTIONS[idx].skill === state.reportGroup).map(idx => QUESTIONS[idx])
    : state.sessionOrder.map(idx => QUESTIONS[idx]);

  let correctCount = 0;
  reviewQuestions.forEach(q => { if (isCorrect(q)) correctCount++; });
  if (!reportMode && state.mode === 'chapter' && window.clcRecordSpecificAttempt && !window.__clcSpecificRecorded) {
    window.__clcSpecificRecorded = true;
    clcRecordSpecificAttempt('Algebra', correctCount, QUESTIONS.length);
  }

  let skillRows = '';
  if (!reportMode && state.mode === 'chapter') {
    SKILLS.forEach(([skey, slabel]) => {
      const qs = QUESTIONS.filter(q => q.skill === skey);
      const c = qs.filter(isCorrect).length;
      skillRows += `<div class="skillrow"><span>${slabel}</span><span>${c} / ${qs.length}</span></div>`;
    });
  }

  let blocks = '';
  const flaggedCount = reviewQuestions.filter(q => state.flagged[q.id]).length;
  const onlyWrong = state.mode === 'skill' || state.mode === 'rapid';
  const shownQuestions = onlyWrong ? reviewQuestions.filter(q => !isCorrect(q)) : reviewQuestions;
  if (onlyWrong) {
    blocks += shownQuestions.length === 0
      ? `<div class="review-block" style="text-align:center;"><strong>Perfect score \u2014 no incorrect answers!</strong></div>`
      : `<div style="text-align:center;margin:0 0 14px;font-size:14px;color:var(--red);font-weight:700;">Incorrect answers (${shownQuestions.length}) \u2014 correct answers shown below</div>`;
  }
  shownQuestions.forEach(q => {
    const correct = isCorrect(q);
    const given = state.answers[q.id];
    const isFlagged = !!state.flagged[q.id];
    let choicesReview = '';
    if (q.type === 'mc') {
      ['A','B','C','D'].forEach(letter => {
        if (!q.choices[letter]) return;
        let cls = 'review-choice';
        if (letter === q.correct) cls += ' correct';
        else if (letter === given) cls += ' wrongpick';
        choicesReview += `<div class="${cls}"><strong>${letter}.</strong> ${q.choices[letter]}</div>`;
      });
    } else {
      choicesReview = `<div class="review-choice correct"><strong>Correct answer:</strong> ${q.correct}</div>` +
        (given ? `<div class="review-choice ${correct?'correct':'wrongpick'}"><strong>Your answer:</strong> ${given}</div>` : `<div class="review-choice"><em>No answer given</em></div>`);
    }
    const figureHtml = q.svg ? `<div class="figure">${q.svg}</div>` : '';
    const flagTag = isFlagged ? `<span class="tag tag-flagged">\ud83d\udd16 Marked for Review</span>` : '';
    blocks += `<div class="review-block${isFlagged ? ' flagged-block' : ''}">
      <div class="qmeta">
        <span class="qnum">Question ${SKILL_NUM[q.id]}</span>
        <span class="tag tag-skill">${SKILL_LABEL[q.skill]}</span>
        <span class="tag tag-diff-${q.difficulty.toLowerCase()}">${q.difficulty}</span>
        <span class="tag" style="background:${correct?'#e4f3e8':'#fbe4e2'};color:${correct?'#1F7A3D':'#B3261E'};">${correct?'Correct':'Incorrect'}</span>
        ${flagTag}
      </div>
      <div class="stem">${q.stem}</div>
      ${figureHtml}
      ${choicesReview}
      <div class="rt-box rt-rule"><span class="rt-label">Formula / Rule</span>${q.rule}</div>
      <div class="rt-box rt-tip"><span class="rt-label">Tip</span>${q.tip}</div>
      <div class="rt-box rt-trap"><span class="rt-label">Trap</span>${q.trap}</div>
      <div class="rt-box rt-fastest"><span class="rt-label">Fastest Way to Solve</span><ol>${q.fastest.map(s=>`<li>${s}</li>`).join('')}</ol></div>
      <div class="rt-box rt-desmos"><span class="rt-label">Desmos Guide</span><ol>${q.desmos.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    </div>`;
  });

  const groupLabel = reportMode ? SKILL_LABEL[state.reportGroup] : null;
  const titleText = reportMode ? `Section Report &mdash; ${groupLabel}` : 'Results';
  const backBtn = `${state.locked ? '' : '<button class="btn-ghost" onclick="closeGroupReport()">&larr; Back to Test</button>'}
    <button class="btn-ghost" onclick="backToIntro()">&larr; Back to Menu</button>`;
  const resetBtn = reportMode
    ? `<button class="btn-ghost" style="color:var(--red);" onclick="resetSkill('${state.reportGroup}')">Reset Skill</button>`
    : `<button class="btn-ghost" style="color:var(--red);" onclick="resetAll()">Reset All</button>`;

  return `<div class="screen-center" style="max-width:760px;">
    <h1 class="serif" style="color:var(--crimson);">${titleText}</h1>
    <div class="scorebig">${correctCount} / ${reviewQuestions.length}</div>
    ${state.locked ? `<div style="max-width:520px;margin:0 auto 14px;font-size:13px;color:#555;">Results are final and your answers are locked. Use <strong>Reset</strong> to start over, or <strong>Back to Menu</strong> to leave.</div>` : ''}
    ${skillRows ? `<div style="max-width:420px;margin:18px auto;text-align:left;">${skillRows}</div>` : ''}
    ${flaggedCount > 0 ? `<div style="max-width:420px;margin:0 auto 18px;text-align:left;font-size:13px;color:var(--gold);">\ud83d\udd16 ${flaggedCount} question${flaggedCount===1?'':'s'} marked for review \u2014 see gold-highlighted questions below</div>` : ''}
    <div class="noprint" style="margin:20px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      ${backBtn}
      <button class="btn-gold" onclick="window.print()">Export ${reportMode ? 'Section' : 'Full'} Review to PDF</button>
      ${resetBtn}
    </div>
  </div>
  <div id="main" style="max-width:760px;margin:0 auto 60px;">${blocks}</div>`;
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'intro') { app.innerHTML = renderIntro(); }
  else if (state.screen === 'skillpick') { app.innerHTML = renderSkillPick(); }
  else if (state.screen === 'diffpick') { app.innerHTML = renderDiffPick(); }
  else if (state.screen === 'test') { app.innerHTML = `<div class="navwrap">${renderPalette()}${renderQuestion()}</div>`; }
  else { app.innerHTML = renderReview(); }
  if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([app]).catch(() => {}); }
}

render();
</script>


<div id="briefOverlay"></div>
</body></html>
