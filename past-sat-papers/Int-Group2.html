 "skill": "Inferences", "dom": "Information and Ideas", "ans": "A", "choices": ["patterns of electricity use are shaped in part by consumer discretion.", "the use of DRS will guarantee that the supply of electricity remains sufficient.", "increased reliance on renewable energy will be possible in the future.", "the success of DRS will prompt other nations to develop renewable energy sources."], "rev": {"formula": ["DRS only makes sense if consumers can choose when they use electricity."], "steps": ["DRS rewards consumers for shifting habits.", "So it assumes that people’s use patterns can be changed by their own choices."], "tip": ["Complete the sentence in your own words using only what the text states."], "trap": ["Choosing B, which overstates DRS with \"guarantee\"."], "desmos": []}, "p": "Countries whose electricity grids are heavily dependent on renewable energy—Colombia, for instance, obtains over 65% of its energy from such sources—often struggle to meet consumer demand during peak hours (times of the day when electricity use is very high).\n\nConcerns about electrical supply limitations have led some nations to utilize demand-response systems (DRS) that motivate consumers to change habits through lower electricity prices during off-peak hours. These efforts reflect an assumption that ____", "n": 40, "id": "f3c33145", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "A", "choices": ["Y. evonymella and A. caja likely exhibit a form of protective mimicry in which distinct species with chemical defenses develop a nearly identical signal to repel predators.", "Y. evonymella is an example of a phenomenon in which palatable species gain protection from predators by resembling or mimicking unpalatable or otherwise well-defended species.", "like certain moths in the Arctiinae family, several species of moths belonging to the genus Yponomeuta produce ultrasonic pulses to communicate noxiousness rather than to disrupt bat echolocation.", "in both small-bodied and large-bodied moths, acoustic aposematic signaling is more prevalent than previous studies of defenses against bat predation had suggested."], "rev": {"formula": ["Both moths are noxious and their signals are nearly identical, so they share a mimicry-type defense."], "steps": ["Y. evonymella is noxious and mimics another noxious species’ signal.", "So both defended species likely share a protective signal."], "tip": ["Complete the sentence in your own words using only what the text states."], "trap": ["Choosing B, which says the mimic is palatable; the text says Y. evonymella is noxious."], "desmos": []}, "p": "To combat predation by Arizona myotis (Myotis occultus) and other insectivorous bats, some moth species—including [[i]]Euchaetes egle[[/i]], a moth native to North America—have evolved the ability to produce ultrasonic pulses that, for instance, disrupt the echolocation bats rely on to forage in low-light conditions or, alternatively, serve as aposematic signals (warning of toxicity or distastefulness).\n\nDavid J.L. Agassiz et al. found that [[i]]Yponomeuta evonymella[[/i]], a species of small-bodied moths that produces noxious substances, emits ultrasonic pulses that closely resemble the acoustic aposematic signals of [[i]]Arctia caja[[/i]], a noxious moth species in the large-bodied Arctiinae family whose distribution overlaps with that of [[i]]Y. evonymella[[/i]]. The researchers therefore concluded that ____", "n": 41, "id": "242e37e8", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "C", "choices": ["probate inventories from 1600 to 1750 that have been analyzed by scholars exaggerated the number of consumer goods that relatively prosperous individuals possessed.", "scholars’ previous conclusions based on analysis of probate inventories from 1600 to 1750 overstated broader demographic shifts in the possession of consumer goods.", "advocates of the consumer-revolution argument may have failed to account for the possibility that the increased acquisition of consumer goods in England between 1600 and 1750 was attributable to an increase in the proportion of wealthy individuals in the period.", "wage increases in England between 1600 and 1750 did not account for the widespread acquisition of consumer goods among less-wealthy individuals."], "rev": {"formula": ["Inventories increasingly represent wealthier people, so rising goods may reflect more wealthy people in the sample, not a broader revolution."], "steps": ["Documentation increasingly represents affluent individuals.", "So the apparent rise in goods could stem from a larger share of wealthy people."], "tip": ["Complete the sentence in your own words using only what the text states."], "trap": ["Choosing A or B, which claim the records were wrong or exaggerated; Clark says they appear consistent."], "desmos": []}, "p": "Support for the argument that a “consumer revolution,” in which possession of consumer goods among an increasingly wide range of socioeconomic groups surged despite only marginal wage growth, occurred in England between 1600 and 1750 has largely hinged on scholars’ analyses of probate inventories (detailed legal records of deceased persons’ possessions).\n\nReexamining these data, Gregory Clark notes that while inventories from the period appear consistent with the consumer-revolution argument, the proportion of the population whose wills included such documentation decreased considerably between 1600 and 1750, with this documentation increasingly representing more affluent individuals. Clark’s findings thus directly raise the possibility that ____", "n": 42, "id": "4afe40f4", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Sentence boundaries", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "C", "choices": ["2003, revolutionizing the field of economic research, before", "2003. Revolutionizing the field of economic research before", "2003, revolutionizing the field of economic research. Before", "2003, revolutionizing the field of economic research before"], "rev": {"formula": ["Each complete idea must be a proper sentence; \"Before its release, ...\" starts a new sentence."], "steps": ["\"This comprehensive resource was first published in 2003, revolutionizing the field of economic research.\" is complete.", "\"Before its release, gaps ... hindered researchers’ ability\" is a separate complete sentence."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing A or D, which run the two sentences together without correct punctuation."], "desmos": []}, "p": "Angus Maddison’s [[i]]The World Economy: Historical Statistics[[/i]] includes estimated total market values for the world’s largest economies dating back to 1 CE. This comprehensive resource was first published in ____ its release, gaps in historical records hindered researchers’ ability to analyze economic trends across centuries.", "n": 43, "id": "a2dfe19f", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Modifier placement", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "D", "choices": ["future lexicographers considered the dictionary, which preserved knowledge of the Hopi language, as a model.", "the dictionary’s preservation of knowledge of the Hopi language was considered a model for future lexicographers.", "knowledge of the Hopi language was preserved by the dictionary, which was considered a model for future lexicographers.", "the dictionary preserved knowledge of the Hopi language and was considered a model for future lexicographers."], "rev": {"formula": ["An opening participial phrase (\"Containing almost 30,000 entries\") must be followed by the noun it describes: the dictionary."], "steps": ["The dictionary contained the entries.", "Only D (and B) begin with the dictionary; D keeps the sentence logical and parallel (preserved ... and was considered)."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing C: the entries would be \"knowledge\", not the dictionary, so the modifier dangles."], "desmos": []}, "p": "Emory Sekaquaptewa, a Hopi anthropologist and lexicographer, helped compile a bilingual Hopi-English dictionary published in 1998. Containing almost 30,000 entries, ____", "n": 44, "id": "62fd53f7", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Boundaries", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "D", "choices": ["handwriting", "handwriting,", "handwriting-which", "handwriting;"], "rev": {"formula": ["A semicolon joins two complete sentences."], "steps": ["\"The facsimile ... handwriting\" is a complete sentence.", "\"in legal transactions, for example, signed documents could now be transmitted\" is also complete, so a semicolon is needed."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing a comma, which creates a comma splice."], "desmos": []}, "p": "Early electronic telecommunications systems, like telegraphy, could only transmit basic text. The facsimile (or fax) system, developed in the 1980s, coupled rapid message transmission with the ability to accurately render formatting and ____ in legal transactions, for example, signed documents could now be transmitted across continents in minutes.", "n": 45, "id": "be21572d", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Parenthetical expressions", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "D", "choices": ["example. With", "example with", "example and with", "example, with"], "rev": {"formula": ["\"for example\" is an interrupter and needs a comma after it; \"with a total area...\" is a modifier."], "steps": ["\"for example,\" introduces the illustration.", "The comma after \"example\" separates it from the phrase \"with a total area of about 9,200,000 km²\"."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing A, which makes a fragment."], "desmos": []}, "p": "Within Earth’s biomes, there are four main types of desert: arid, semiarid, coastal, and cold. The Sahara Desert in northern Africa is an arid desert, for ____ a total area of about 9,200,000 km², it is also one of the largest deserts of any type.", "n": 46, "id": "a2ac20ee", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb forms", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "A", "choices": ["indicating", "indicates", "can indicate", "will indicate"], "rev": {"formula": ["A clause that already has a main verb (\"has revealed\") needs a participle for the extra information, not a second finite verb."], "steps": ["\"the DNA analysis indicating consumption of ...\" is an absolute phrase attached to the main clause.", "Finite verbs would create a comma splice."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing \"indicates\": two independent clauses joined only by a comma."], "desmos": []}, "p": "Metagenomic analysis of chewed tree pitch unearthed at Sweden’s Huseby Klev archaeological site has revealed concrete information about Mesolithic humans’ dietary practices, the DNA analysis ____ consumption of hazelnuts, red deer, fish from the salmon family, and various bird species.", "n": 47, "id": "f4418e9b", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb forms", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "C", "choices": ["will form", "form", "forming", "can form"], "rev": {"formula": ["The first clause is complete, so the second part must be a participial phrase."], "steps": ["\"The process ... depends on specialized geological conditions\" is complete.", "\"the gems typically forming as ...\" is an absolute phrase, correct after a comma."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing \"form\" or \"can form\": a second main clause would be a comma splice."], "desmos": []}, "p": "The process by which Colombian emeralds are created depends on specialized geological conditions, the gems typically ____ as hydrothermal fluids interact with carbon-rich black shales.", "n": 48, "id": "a0dc1e58", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "D", "choices": ["Moreover,", "For instance,", "Admittedly,", "By contrast,"], "rev": {"formula": ["Holotype (original specimen) is contrasted with neotype (not the original)."], "steps": ["First reference organism: holotype.", "Second: neotype, a different kind.", "\"By contrast\" signals the difference."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"For instance\" or \"Moreover\", which would not signal a difference."], "desmos": []}, "p": "At the Museum of Natural History in Washington, DC, a single specimen of the planktonic marine organism [[i]]T. iota[[/i]] is preserved as the reference organism for the species. This specimen is a holotype, meaning it was the basis of the first formal scientific description of [[i]]T. iota[[/i]]. ____ the reference organism for the planktonic [[i]]G. truncatulinoides[[/i]], preserved at the Natural History Museum in London, is a neotype, meaning it acts as a reference organism but is not the exact specimen originally described.", "n": 49, "id": "0f16efba", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "C", "choices": ["for example,", "likewise,", "that is,", "in contrast,"], "rev": {"formula": ["The second clause restates and explains what tetrachromatic vision means."], "steps": ["\"Tetrachromatic\" = having a fourth type of cone cell.", "\"That is,\" introduces the explanation."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"in contrast\": nothing contrasts with the previous clause here."], "desmos": []}, "p": "Whereas humans have trichromatic vision (a function of having three types of cone cells in the retina), birds have tetrachromatic vision; ____ birds have a fourth type of cone cell in their retinas, one sensitive to ultraviolet (UV) light, which allows them to see UV-reflective patterns in plumage that reveal male-female distinctions invisible to human eyes.", "n": 50, "id": "1b45537b", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "D", "choices": ["however,", "similarly,", "in sum,", "consequently,"], "rev": {"formula": ["Lacking organic realism causes further processing to be needed."], "steps": ["Cause: perfect geometric shapes lack organic realism.", "Effect: post-modeling processes are needed.", "\"Consequently\" signals the result."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"however\", which wrongly signals a contrast."], "desmos": []}, "p": "Photogrammetry, used by digital artists to develop 3D assets for video games, yields objects with precise mathematical proportions. Granted, as they are formed from perfect geometric shapes, such 3D elements lack organic realism; ____ post-modeling processes such as UV surface mapping are needed to achieve the level of verisimilitude gamers expect.", "n": 51, "id": "69bb681a", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "The student wants to emphasize a similarity between the two films. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "D", "choices": ["In [[i]]Alf’s Button[[/i]] (1930), actress Merle Oberon played a nameless, uncredited role; however, in [[i]]Désirée[[/i]] (1954), she played a credited role—that of Empress Josephine.", "Early in her career, Merle Oberon wasn’t listed in some film credits, such as the credits for the film [[i]]Alf’s Button[[/i]], where she played a nameless, uncredited role.", "[[i]]Alf’s Button[[/i]] (1930) was released early in actress Merle Oberon’s career, whereas [[i]]Désirée[[/i]] (1954) came out later.", "[[i]]Alf’s Button[[/i]] and [[i]]Désirée[[/i]] are both films that include Merle Oberon, the first Indian-born actress to be nominated for an Academy Award."], "rev": {"formula": ["A similarity means something the two films share."], "steps": ["Both films include Merle Oberon.", "D is the only choice that states what they have in common; the others stress differences."], "tip": ["Read the goal word (similarity vs. difference) before choosing."], "trap": ["Choosing A or C, which emphasize differences."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Merle Oberon (1911–1979) was an actress born in Mumbai (then known as Bombay), India.\n• She was of Indian, Maori, and Irish heritage.\n• She was the first Indian-born actress to be nominated for an Academy Award.\n• Early in her career, she played many nameless, uncredited roles, such as her role in [[i]]Alf’s Button[[/i]] (1930).\n• Later, she played many named, credited roles, such as Empress Josephine in [[i]]Désirée[[/i]] (1954).", "n": 52, "id": "716def32", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "The student wants to distinguish Bourne’s proposed theory from Bigelow’s. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "A", "choices": ["In contending with the truth-maker objection, ersatz presentism diverges from Lucretianism’s use of past-tensed properties by positing an “ersatz” time-outside-time capable of representing past things.", "Following Bigelow’s 1996 proposal, Bourne accepted the existence of past-tensed properties to solve the truth-maker problem with one caveat: a form of “ersatz” time that exists outside temporal time.", "The presentist approaches of Bigelow (1996) and Bourne (2006) differ in whether they consider truths about the past—the statement “dinosaurs existed,” for example—to be made true by anything at all.", "In 2006, Bourne proposed ersatz presentism, disagreeing with Bigelow’s earlier hypothesis that only present things exist."], "rev": {"formula": ["To distinguish two theories, state what makes each different from the other."], "steps": ["Lucretianism: past-tensed properties make past statements true.", "Ersatz presentism: an abstract time outside time represents the past.", "Choice A contrasts these two mechanisms."], "tip": ["Both are presentist and both address the truth-maker objection; the difference is the truth-maker."], "trap": ["Choosing D: both theorists are presentists, so Bourne does not disagree that only present things exist."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Philosophers espousing presentism (the view that only present things exist) must contend with the truth-maker objection (TO).\n• TO: If past things don’t exist, what makes true statements about the past (e.g., “dinosaurs existed”) true? 1996: Presentist philosopher John Bigelow proposed “Lucretianism.”\n• Lucretianism posits that the statement is made true by the world’s acceptance of the past-tensed property of “having contained dinosaurs.”\n• 2006: Presentist philosopher Craig Bourne proposed “ersatz presentism.” Ersatz presentism posits that the statement is made true by an abstract (“ersatz”) time that exists outside temporal time and represents how things were in the past.", "n": 53, "id": "351767b5", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "The student wants to make and support a claim about the LNF rock art style based on Motta et al.’s study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "D", "choices": ["The distinct style displayed by the LNF rock art forms a bridge between the styles of the earlier IIAP animal figures and the later Gwion representations of humans.", "The LNF rock art should be considered its own distinct style because its depictions of animal forms reveal a categorical departure from the art of the previous period.", "The differences between the LNF rock art and earlier IIAP depictions of animals show a notable increase in detail and variety, proving that rock art figures became more detailed over time.", "The study by Motta et al. showed that the LNF figures were clearly layered in between anthropomorphic figures of distinct styles that took place millennia apart."], "rev": {"formula": ["The answer must state the study’s finding (superimposition) and stay within what the notes say."], "steps": ["Study: LNF appear on top of Gwion (12,000–14,000 years ago) and underneath Wanjina (up to 5,000 years ago).", "So LNF lies between two styles millennia apart."], "tip": ["Avoid overclaims such as \"proving\" or \"categorical departure\" and wrong chronology."], "trap": ["Choosing A: IIAP and Gwion are not shown to bridge anything with LNF in the notes."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Prehistoric rock art in the Kimberley region of Australia consists of several distinct styles across various time periods.\n• Irregular Infill Animal Period (IIAP) rock art from 13,000 to 17,000 years ago consists of naturalistic animal figures showing detailed features and a variety of poses.\n• Gwion rock art from 12,000 to 14,000 years ago features elaborately ornamented anthropomorphic figures.\n• Wanjina rock art from up to 5,000 years ago features human ancestor figures along with animal motifs.\n• A 2025 study of Kimberley rock art by Ana Paula Motta et al. identified 98 figures depicting outlines of animal forms with simple anatomical details and posed predominantly in profile.\n• The study’s superimposition analysis showed that these Linear Naturalistic Figures (LNF) consistently appear on top of Gwion and underneath Wanjina figures.", "n": 54, "id": "232fab66", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "What is the area, in square centimeters, of a rectangle with a length of $52$ centimeters and a width of $37$ centimeters?", "cat": "Area of a rectangle", "skill": "Area & Volume", "dom": "Geometry & Trigonometry", "ans": "A", "rev": {"formula": ["Area $=$ length $\\times$ width"], "tip": ["Multiply the two side lengths"], "trap": ["Adding the sides or doubling the sum gives perimeter-type answers ($89$ or $178$)"], "steps": ["$52\\times 37=1{,}924$"], "desmos": ["Type 52*37 and read 1924"]}, "choices": ["$1{,}924$", "$1{,}820$", "$89$", "$178$"], "n": 55, "id": "345ffe3a"}, {"diff": "Easy", "type": "spr", "q": "The function $f$ is defined by $f(x)=7x-4$. What is the value of $f(x)$ when $x=80$?", "cat": "Function evaluation", "skill": "Linear Functions", "dom": "Algebra", "ans": "556", "rev": {"formula": ["Substitute the given $x$-value into the rule"], "tip": ["Replace $x$ with $80$ and follow the order of operations"], "trap": ["Subtracting before multiplying"], "steps": ["$f(80)=7(80)-4$", "$=560-4=556$"], "desmos": ["Type 7*80-4 and read 556"]}, "n": 56, "id": "4a1ce5f9"}, {"diff": "Easy", "type": "mc", "q": "Each face of a fair $18$-sided die is labeled with a number from $1$ through $18$, with a different number appearing on each face. If the die is rolled one time, what is the probability of rolling a $5$?", "cat": "Probability", "skill": "Probability & Conditional Probability", "dom": "Problem-Solving & Data Analysis", "ans": "C", "rev": {"formula": ["$P=\\frac{\\text{favorable outcomes}}{\\text{total outcomes}}$"], "tip": ["Only one face shows a $5$"], "trap": ["Choosing $\\frac{17}{18}$ (probability of NOT rolling a 5) or $\\frac{5}{18}$ (using the number instead of the count)"], "steps": ["Favorable outcomes: $1$", "Total outcomes: $18$", "$P=\\frac{1}{18}$"], "desmos": ["Type 1/18"]}, "choices": ["$\\frac{13}{18}$", "$\\frac{5}{18}$", "$\\frac{1}{18}$", "$\\frac{17}{18}$"], "n": 57, "id": "e603a360"}, {"diff": "Easy", "type": "mc", "q": "If $5x=8$, what is the value of $15x$?", "cat": "One-variable equations", "skill": "Linear Equations in One Variable", "dom": "Algebra", "ans": "A", "rev": {"formula": ["Multiply both sides of an equation by the same number"], "tip": ["$15x$ is $3$ times $5x$"], "trap": ["Solving for $x$ first and making an arithmetic slip, or choosing $8$"], "steps": ["$15x=3(5x)$", "$=3(8)=24$"], "desmos": ["Type 3*8 and read 24"]}, "choices": ["$24$", "$\\frac{8}{3}$", "$120$", "$8$"], "n": 58, "id": "61820113"}, {"diff": "Medium", "type": "mc", "q": "A number $f$ is $125\\%$ greater than a positive number $g$. A number $h$ is $40\\%$ less than the number $f$. The number $h$ is how many times the number $g$?", "cat": "Percent chains", "skill": "Percentages", "dom": "Problem-Solving & Data Analysis", "ans": "A", "rev": {"formula": ["$p\\%$ greater: multiply by $1+\\frac{p}{100}$", "$p\\%$ less: multiply by $1-\\frac{p}{100}$"], "tip": ["Chain the multipliers: $f=2.25g$ and $h=0.6f$"], "trap": ["Adding the percents ($125-40=85$) or choosing $1.85$"], "steps": ["$f=(1+1.25)g=2.25g$", "$h=(1-0.40)f=0.6f$", "$h=0.6(2.25g)=1.35g$"], "desmos": ["Type 2.25*0.6 and read 1.35"]}, "choices": ["$1.35$", "$1.85$", "$0.90$", "$0.54$"], "n": 59, "id": "ce5470ad"}, {"diff": "Easy", "type": "mc", "q": "The function $f$ is defined by $f(x)=-\\frac{5}{12}x+9$. What is the slope of the graph of $y=f(x)$ in the $xy$-plane?", "cat": "Slope of a line", "skill": "Linear Functions", "dom": "Algebra", "ans": "D", "rev": {"formula": ["$y=mx+b$: $m$ is the slope and $b$ is the $y$-intercept"], "tip": ["The slope is the coefficient of $x$, including its sign"], "trap": ["Choosing $9$ (the $y$-intercept) or dropping the negative sign"], "steps": ["Compare with $y=mx+b$", "$m=-\\frac{5}{12}$"], "desmos": ["Graph the line and read the rise over the run"]}, "choices": ["$-9$", "$5$", "$\\frac{1}{12}$", "$-\\frac{5}{12}$"], "n": 60, "id": "a2114254"}, {"diff": "Easy", "type": "mc", "q": "Line $k$ is defined by $y=-3x+17$. Line $j$ is perpendicular to line $k$ in the $xy$-plane. What is the slope of line $j$?", "cat": "Perpendicular lines", "skill": "Linear Equations in Two Variables", "dom": "Algebra", "ans": "D", "rev": {"formula": ["Perpendicular slopes are negative reciprocals: $m_1m_2=-1$"], "tip": ["Flip the fraction and change the sign"], "trap": ["Choosing $-\\frac13$ (only the reciprocal) or $3$ (only the sign change)"], "steps": ["Slope of $k$: $-3$", "Negative reciprocal: $-\\frac{1}{-3}=\\frac13$"], "desmos": ["Check: $-3\\cdot\\frac13=-1$"]}, "choices": ["$3$", "$-\\frac{1}{3}$", "$-3$", "$\\frac{1}{3}$"], "n": 61, "id": "5c1c2e0e"}, {"diff": "Easy", "type": "mc", "q": "What is the $y$-coordinate of the $y$-intercept of the graph of $y=156(24)^x$ in the $xy$-plane?", "cat": "Exponential functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "A", "rev": {"formula": ["The $y$-intercept occurs at $x=0$", "Any nonzero number to the power $0$ equals $1$"], "tip": ["Set $x=0$"], "trap": ["Computing $156\\cdot24=3{,}744$"], "steps": ["$y=156(24)^0$", "$=156\\cdot1=156$"], "desmos": ["Graph the function and read the point where $x=0$"]}, "choices": ["$156$", "$3{,}744$", "$24$", "$1$"], "n": 62, "id": "9d4ff9cb"}, {"diff": "Easy", "type": "spr", "q": "For the values $j$ and $k$, the ratio of $j$ to $k$ is $9$ to $5$. If $j$ is multiplied by $12$, what is $k$ multiplied by in order to maintain the same ratio?", "cat": "Ratios", "skill": "Ratios, Rates & Proportions", "dom": "Problem-Solving & Data Analysis", "ans": "12", "rev": {"formula": ["Multiplying both parts of a ratio by the same factor keeps the ratio unchanged"], "tip": ["The same factor must be applied to $k$"], "trap": ["Answering $\\frac{20}{3}$ or $\\frac{5}{9}\\cdot 12$ by solving a different problem"], "steps": ["$\\frac{9\\cdot12}{5\\cdot c}=\\frac{9}{5}$", "$c=12$"], "desmos": ["Type 9*12/(5*c)=9/5 and solve for c"]}, "n": 63, "id": "c895264e"}, {"diff": "Medium", "type": "mc", "q": "In the figure shown, triangle $CAE$ is similar to triangle $CBD$. The measure of angle $CBD$ is $47^\\circ$, and $AE=19(BD)$. What is the measure of angle $CAE$?", "cat": "Similar triangles", "skill": "Lines, Angles & Triangles", "dom": "Geometry & Trigonometry", "ans": "B", "rev": {"formula": ["In similar triangles, corresponding angles are equal"], "tip": ["The scale factor ($19$) is a distractor; angles do not change under scaling"], "trap": ["Computing $90-47=43$ or $180-47=133$"], "steps": ["$A$ corresponds to $B$ because $CAE\\sim CBD$", "$\\angle CAE=\\angle CBD=47^\\circ$"], "desmos": ["No calculator needed"]}, "choices": ["$43^\\circ$", "$47^\\circ$", "$90^\\circ$", "$133^\\circ$"], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAAFFCAIAAAB+OfFLAAAzWUlEQVR42u3deVwV5eIG8Jk5C2cDZN9R1ERR6WoplmnWNSuXrG5ZJlpuuHJYXEBDMkVEEERBRQE1Tc28deta5r6nqeQu7ux42OHs68z8/pjiR1rdGMUQn+8ffozFOHM4z3ned2bel2RZlgAAeHgoHAIAQKwAAGIFABArAACIFQBArAAAYgUA4K8Q4hAAtG3ctWk0Tev1eqFQKJVKKapl+wTaCkDbxzDM+fPnJ06cuGTJEo1Gw7Jsi14Hi1gBeCJi5eDBg/v27fvqq69KSkpomkZbAYAHolarjx079sknn0gkkvPnz5MkSbTkTTuIFYA2jiTJ8+fPl5aWDh8+fMCAAbt37yZJkiUwCAKAP2Aymfbv33/o0CGTyXTPp1iWZRjGbDZv3bq1Z8+eXl5egwcPPnnyZEFBAfHrVC5iBQB+g2GYQ4cOTZkyJTo6urCw8He/pqCg4Mcff3zhhRcEAkGnTp0cHR2zsrJadHoFsQLwuKJp+vDhw1OnTi0tLbVarfb29vcPf1iWPXLkSFlZ2caNG998883w8PCqqqrdu3erVKqW+8Fw3QrAY0mv1//73//++OOPTSaTWCwmSZIkyfsHQVqtdvfu3a+88srQoUO5y1Vu3ryZk5Nz8eJFHx8fiqRIikSsADzRWJYlWIJm6M8++2zx4sVCoTA+Pj4jI+OPvv7SpUvXr1/Pysp68cUXSYIkSKK+vv6bb745ffr0q6++SgpJknj4sYJBEMDj1lMM+szMzNjYWIlEkpOd8/bbbwuFwj+afz148KC7u/vTTz8tEAgEQgFFUS7OLmPHjj1y5IhOp7u/4KCtADxhPYUg9Hp9ampqcnJyly5dkpKSBg8eXFVV9SffFRgY+I9//KNdu3ZNPzh27Fh7e3uGYVroRyWxli3A4xIrDMNERUVt2LDB2dn5P//5T48ePUQiUYWq4p+D/0lR1L59+3x8fO75Fu4F3jjz0vh6Z1n2d6djMAgCeFIChWXZioqKqKiodevW9enTZ9++fb169RKJRP+jNZAkRVEURTXGB/mrph/EIAjgSYwVvV4fHR39/fffh4SEZGZmdurUicuIxj9bFcQKQKsOFIIgiouLp0+ffvTo0cGDB2/btk0uk//m7A1JkL+2kFbyY2MQBNCKY4Vhb968GR4efvjw4XfffTctLU0mk7X+HxttBaD1unHzRmho6LVr1z788MPU1FSpVNoKhzxoKwCPzfDn5MmTEydOvHHjxtSpU5OSkmQyGUVRjWdwOCzLsgzL/jKry7b0+kxoKwCPsdOnTyuVyjt37syaNSsyItLBwYHrKS29XiRiBaBN1ROuaNhstgMHDkyZMkWtVi9YsGDmzJl2YjuS+v0ZWZIkW+KmHsQKQNtJFoZhdu/eHRMTY7VaExMTJ06cKJFI/ud8Skvc14NYAWgLrFbr5s2bFy5cyLJsTk7Oyy+/bGdn9zg+EEzZArSC4Q/DmkymzZs3z58/XyaTZWVlDR06lDvv81ic+kFbAWhFgcL9Ra1Rp6enZ2dne3h4LF++/KWXXnqsHxdiBeBvZjQa09LSEhISgoKCtm3bFhwc/Lg/IsQKwN+DW5egtqZ2eerynJyckJCQxMTEbt26tYGHhlgB+NtGQBqNZs7cOTt37gwJCdm4caOfnx9FtoXpTkzZAvwNgWKz2VQqVXR09M6dOwcOHLhy5Uo/Pz+ pression $(4x+3)(x+6)$ can be written in the form $ax^2+bx+c$, where $a$, $b$, and $c$ are constants. What is the value of $a+b+c$?", "cat": "Expanding expressions", "skill": "Equivalent Expressions", "dom": "Advanced Math", "ans": "49", "rev": {"formula": ["FOIL: $(p+q)(r+s)=pr+ps+qr+qs$"], "tip": ["Shortcut: $a+b+c$ equals the expression evaluated at $x=1$"], "trap": ["Forgetting the middle terms: $4+18=22$"], "steps": ["$(4x+3)(x+6)=4x^2+24x+3x+18$", "$=4x^2+27x+18$", "$a+b+c=4+27+18=49$", "Shortcut: $(4+3)(1+6)=7\\cdot7=49$"], "desmos": ["Type (4+3)(1+6) and read 49"]}, "n": 65, "id": "9876ed42"}, {"diff": "Easy", "type": "spr", "q": "An angle has a measure of $\\frac{7\\pi}{20}$ radians. What is the measure of the angle in degrees?", "cat": "Radians and degrees", "skill": "Circles", "dom": "Geometry & Trigonometry", "ans": "63", "rev": {"formula": ["Degrees $=$ radians $\\times\\frac{180}{\\pi}$"], "tip": ["The $\\pi$ cancels"], "trap": ["Multiplying by $\\frac{\\pi}{180}$ instead"], "steps": ["$\\frac{7\\pi}{20}\\cdot\\frac{180}{\\pi}$", "$=\\frac{7\\cdot180}{20}=63$"], "desmos": ["Type 7*180/20 and read 63"]}, "n": 66, "id": "05e323c6"}, {"diff": "Easy", "type": "mc", "q": "A farmer gave two groups of chickens different types of chicken feed for six weeks to measure the effect on egg production. The lists give the number of eggs collected from each chicken in each of the two groups. Group G: $9, 15, 17, 17, 22$. Group H: $15, 17, 17, 22$. Which statement correctly compares the median number of eggs collected for group G and the median number of eggs collected for group H?", "cat": "Median", "skill": "One-Variable Data", "dom": "Problem-Solving & Data Analysis", "ans": "D", "rev": {"formula": ["The median is the middle value of an ordered list; with an even count, average the two middle values"], "tip": ["Both lists are already in order"], "trap": ["Assuming the extra value $9$ lowers the median"], "steps": ["Group G has $5$ values: median is the 3rd value, $17$", "Group H has $4$ values: median is $\\frac{17+17}{2}=17$", "The medians are equal"], "desmos": ["Enter each list in a table and use the median function"]}, "choices": ["There is not enough information to compare the median number of eggs collected for group G and the median number of eggs collected for group H.", "The median number of eggs collected for group G is less than the median number of eggs collected for group H.", "The median number of eggs collected for group G is greater than the median number of eggs collected for group H.", "The median number of eggs collected for group G is equal to the median number of eggs collected for group H."], "n": 67, "id": "5cf0697b"}, {"diff": "Easy", "type": "mc", "q": "$\\sqrt{26}=\\sqrt{\\dfrac{1}{x}}$. What is the solution to the given equation?", "cat": "Radical equations", "skill": "Nonlinear Equations", "dom": "Advanced Math", "ans": "A", "rev": {"formula": ["Square both sides to remove the square roots"], "tip": ["Square both sides, then solve for $x$"], "trap": ["Choosing $26$ or $676$ by squaring only one side"], "steps": ["$26=\\frac{1}{x}$", "$x=\\frac{1}{26}$"], "desmos": ["Test each choice in the equation"]}, "choices": ["$\\frac{1}{26}$", "$26$", "$676$", "$\\frac{1}{676}$"], "n": 68, "id": "032c7650"}, {"diff": "Medium", "type": "mc", "q": "For a certain isotope, at the end of every $31$-year period, the mass of a sample of the isotope has decayed to half its mass at the beginning of the $31$-year period. The function $s(t)=320(0.5)^{\\frac{t}{31}}$ gives the approximate mass of this isotope, in grams, that remains $t$ years after a $320$-gram sample starts to decay. Which statement is the best interpretation of $s(4\\cdot31)=20$ in this context?", "cat": "Interpreting exponential functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "C", "rev": {"formula": ["$s(t)$ is the mass (grams) and $t$ is time (years)"], "tip": ["Inside the parentheses is the time; the output is the mass"], "trap": ["Swapping input and output, or treating $4\\cdot 31$ as years rather than as four $31$-year periods"], "steps": ["Input: $t=4\\cdot31=124$ years, i.e. $4$ periods of $31$ years", "Output: $s=20$ grams", "Check: $320(0.5)^4=20$"], "desmos": ["Type 320*0.5^4 and read 20"]}, "choices": ["The mass of the sample is approximately $4$ grams $20$ $31$-year periods after the sample starts to decay.", "The mass of the sample is approximately $4$ grams $20$ years after the sample starts to decay.", "The mass of the sample is approximately $20$ grams $4$ $31$-year periods after the sample starts to decay.", "The mass of the sample is approximately $20$ grams $4$ years after the sample starts to decay."], "n": 69, "id": "b2a46458"}, {"diff": "Easy", "type": "mc", "q": "The graph of the polynomial function $f$ in the $xy$-plane, where $y=f(x)$, passes through the point $(9,6)$. What is the value of $f(9)$?", "cat": "Function notation", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "D", "rev": {"formula": ["If $(a,b)$ is on the graph of $y=f(x)$, then $f(a)=b$"], "tip": ["The $y$-coordinate is the function value"], "trap": ["Choosing $9$ (the input) or multiplying $9\\cdot6=54$"], "steps": ["Point $(9,6)$ means $x=9$, $y=6$", "$f(9)=6$"], "desmos": ["Read the $y$-value at $x=9$"]}, "choices": ["$15$", "$54$", "$9$", "$6$"], "n": 70, "id": "8e0e82e3"}, {"diff": "Easy", "type": "spr", "q": "The product of a positive number $x$ and the number that is $6$ more than $x$ is $247$. What is the value of $x$?", "cat": "Quadratic equations", "skill": "Nonlinear Equations", "dom": "Advanced Math", "ans": "13", "rev": {"formula": ["Translate to $x(x+6)=247$ and solve the quadratic"], "tip": ["Look for two numbers $6$ apart whose product is $247$"], "trap": ["Giving the larger number $19$ instead of $x$"], "steps": ["$x^2+6x-247=0$", "$(x-13)(x+19)=0$", "$x=13$ (positive)"], "desmos": ["Graph $y=x(x+6)-247$ and read the positive zero"]}, "n": 71, "id": "66f71740"}, {"diff": "Medium", "type": "spr", "q": "Object A has a mass of $k$ hectograms. The mass, in hectograms, of object B is $135\\%$ of the mass of object A. The positive difference between the mass of object B and the mass of object A is $98$ hectograms. What is the value of $k$?", "cat": "Percent change", "skill": "Percentages", "dom": "Problem-Solving & Data Analysis", "ans": "280", "rev": {"formula": ["$135\\%$ of $k$ is $1.35k$"], "tip": ["Difference $=1.35k-k=0.35k$"], "trap": ["Using $1.35k=98$ and getting $72.6$"], "steps": ["$1.35k-k=98$", "$0.35k=98$", "$k=280$"], "desmos": ["Type 98/0.35 and read 280"]}, "n": 72, "id": "cf6ded0b"}, {"diff": "Medium", "type": "mc", "q": "For the linear function $f$, $f(3)=19$ and $f(7)=3$. Which equation defines $f$?", "cat": "Equation of a line", "skill": "Linear Functions", "dom": "Algebra", "ans": "B", "rev": {"formula": ["$m=\\frac{y_2-y_1}{x_2-x_1}$, then $y=mx+b$"], "tip": ["Slope is negative because $f$ decreases"], "trap": ["Choosing $-4x+35$ (an arithmetic slip in $b$)"], "steps": ["$m=\\frac{3-19}{7-3}=-4$", "$19=-4(3)+b\\Rightarrow b=31$", "$f(x)=-4x+31$"], "desmos": ["Plot $(3,19)$ and $(7,3)$ and compare with each choice"]}, "choices": ["$f(x)=\\frac14x-2$", "$f(x)=-4x+31$", "$f(x)=-\\frac14x+20$", "$f(x)=-4x+35$"], "n": 73, "id": "5a73df15"}, {"diff": "Medium", "type": "mc", "q": "In triangle $QRS$ shown, $QR<RS$. Which expression represents the length of line segment $QS$?", "cat": "Right triangle trigonometry", "skill": "Right Triangles & Trigonometry", "dom": "Geometry & Trigonometry", "ans": "B", "rev": {"formula": ["$\\sin Q=\\frac{\\text{opposite}}{\\text{hypotenuse}}$"], "tip": ["$RS=24$ is opposite angle $Q$ and $QS$ is the hypotenuse"], "trap": ["Using $\\cos Q$, which relates $QR$ (the adjacent side), not $RS$"], "steps": ["$\\sin Q=\\frac{RS}{QS}=\\frac{24}{QS}$", "$QS=\\frac{24}{\\sin Q}$"], "desmos": ["Choose a test angle and compare each choice"]}, "choices": ["$24\\cos Q$", "$\\dfrac{24}{\\sin Q}$", "$  table can seat $6$ people.", "Each large table can seat $6$ people."], "n": 77, "id": "15d06a97"}, {"diff": "Easy", "type": "mc", "q": "The scatterplot shows the relationship between two variables, $x$ and $y$. A line of best fit is also shown. Which of the following is closest to the slope of this line of best fit?", "cat": "Scatterplots and lines of best fit", "skill": "Two-Variable Data & Scatterplots", "dom": "Problem-Solving & Data Analysis", "ans": "D", "rev": {"formula": ["Slope $=\\frac{\\text{rise}}{\\text{run}}$ using two points on the line"], "tip": ["The line goes down from left to right, so the slope is negative"], "trap": ["Picking a positive slope"], "steps": ["The line passes through about $(0,12.8)$ and $(9,0)$", "Slope $\\approx\\frac{0-12.8}{9-0}\\approx-1.4$"], "desmos": ["Plot the points and read the slope"]}, "choices": ["$-4.2$", "$1.4$", "$4.2$", "$-1.4$"], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAACCCAIAAADUo9TzAAArBUlEQVR42u19aWwb55k/OTMc3sP7JkWKtG5L1mnHR5zDiZOF3Tbd7XaTYj8knwrstotiUXcX2w8t9kCBAItNsy3QxaIIFrsNthsnThs3jq86sS3HlmzdlkSJEk/xpijeQ871//D+w7KyLZ+yNcr7+2CI0ng4z3v85nme9zmEHMcJICAgIB4dEDgEEBAQkFYgICAgrUBAQEBagYCAgHhitMJxXCqVSiaTHMeRJDk9PU2SJBxWCAhIKw+F3//+9x9++CFN0xcvXvznf/5nhmHgsEJAQFp5KGi12mAwmE6nf/Ob3/zkJz+RyWRwWCEgIK08FFwuVzQavXTpUnt7u8vlEgqFcFghICCt3BM4jmuMnat/NJlMxWLx7Nmzhw4dggMKAQFxr7TCsmypVKIoqv6xUChQFMVxHIIgWq22ra2tpaUFQeDREgQEpJV7w9LS0sjISDQa5TiOZdnV1dVz586trq4WCoUzZ84oFIrXX38dwzA4oBAQEPdKBBqNplKp0DTNcRxFUZcuXSIIgmGYcDi8trZ27NgxjUYDLCM4plsB28PDBZbTdpLlS7KohPcu7dzcnEgkcrlcN2/elMlkyWTS6XRaLBbwfaFQKJPJNDc3i0QiXo8dy7J8N+WEQiHDMEKhcBtsSJZlURTluxTbYDqAu0OhUDxKbQXcVygUkiQZCoVwHI/H4wKBwGw2C4XCUqn0T//0T5cuXfq3f/u35557rpHY+EXSLMtWq1W5XM73FUBRFIIgEomE77uRJEmlUsl3PaVYLKrVal4vKoZhMpnMo6QVlmXD4XAikcAwTCaTvfzyywzDTE5OOhwOoVDIcdzJkyffe+89mqa//e1vj4yMmM1mnr7wWZZlGEYmk/GdVsC7he8xRDRNMwwjlUr5Ph3lclkqlfJaC2YYJpvN3uPF9yonQRDt7e0tLS0ymUwkEonF4q6uLr1eLxQKfT7fL37xi6effrqjo8Ptdr/zzju1Wg06WZ64DQwDiCCeFO6JVhAEUavVZrPZZDKpVCqwZOVyOYZ ": ["The question asks for $2t$, not $t$"], "trap": ["Answering $t=22.5$"], "steps": ["$6t-21+t=24+5t$", "$7t-21=24+5t$", "$2t=45$"], "desmos": ["Type 3(2t-7)+t=24+5t and read t=22.5, then double it"]}, "n": 79, "id": "0076ebec"}, {"diff": "Medium", "type": "mc", "q": "The function $j$ is defined by $j(x)=\\frac{8x+4}{5p}$, and the function $k$ is defined by $k(x)=\\frac{j(x)\\,p}{x+2}$, where $p$ is a positive constant. What is the value of $k(7)$?", "cat": "Function composition and evaluation", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "B", "rev": {"formula": ["Substitute $x=7$ into $j$, then into $k$"], "tip": ["The constant $p$ cancels"], "trap": ["Leaving $p$ in the answer or forgetting to divide by $x+2=9$"], "steps": ["$j(7)=\\frac{60}{5p}=\\frac{12}{p}$", "$k(7)=\\frac{(12/p)\\,p}{9}=\\frac{12}{9}=\\frac43$"], "desmos": ["Replace p with any positive number such as 1 and compute"]}, "choices": ["$\\frac{28}{5}$", "$\\frac{4}{3}$", "$\\frac{20}{3}$", "$\\frac{8}{5}$"], "n": 80, "id": "9b3dadd9"}, {"diff": "Medium", "type": "spr", "q": "The solution to the system of equations $2x+7y=5$ and $6x-3y=39$ is $(x,y)$. What is the value of $8x-6y$?", "cat": "Systems of equations", "skill": "Systems of Linear Equations", "dom": "Algebra", "ans": "54", "rev": {"formula": ["Solve the system by elimination or substitution"], "tip": ["Find $x$ and $y$, then substitute into $8x-6y$"], "trap": ["Adding the two equations ($8x+4y$) instead of combining as asked"], "steps": ["Multiply the first equation by $3$: $6x+21y=15$", "Subtract: $24y=-24\\Rightarrow y=-1$", "$2x-7=5\\Rightarrow x=6$", "$8(6)-6(-1)=48+6=54$"], "desmos": ["Enter both equations in Desmos and read the intersection $(6,-1)$"]}, "n": 81, "id": "b7d9f42c"}, {"diff": "Medium", "type": "mc", "q": "An environmental scientist studies the decomposition of paper bags when the bags are placed in an environment with a certain type of bacteria. The exponential function $f(x)=640(0.92)^x$ gives the e }$"], "desmos": ["Replace p with 1 and verify"]}, "choices": ["$(p,0)$", "$\\left(\\frac{3}{p},0\\right)$", "$\\left(\\frac{p}{18},0\\right)$", "$\\left(\\frac{1}{18},0\\right)$"], "n": 88, "id": "48eb45a3"}, {"diff": "Medium", "type": "mc", "q": "In the $xy$-plane, an equation of circle $A$ is $(x+4)^2+(y-11)^2=361$. Circle $B$ is obtained by shifting circle $A$ $6$ units to the right and $4$ units down. Which equation represents circle $B$?", "cat": "Circles", "skill": "Circles", "dom": "Geometry & Trigonometry", "ans": "B", "rev": {"formula": ["Center $(h,k)$ in $(x-h)^2+(y-k)^2=r^2$"], "tip": ["Shift the center, keep the radius"], "trap": ["Shifting in the wrong direction (e.g. $(x+10)^2$) or changing the radius"], "steps": ["Center of $A$: $(-4,11)$", "Right $6$, down $4$: $(2,7)$", "$(x-2)^2+(y-7)^2=361$"], "desmos": ["Graph the circle and the choices"]}, "choices": ["$(x+10)^2+(y-7)^2=361$", "$(x-2)^2+(y-7)^2=361$", "$(x+10)^2+(y-15)^2=361$", "$(x-2)^2+(y-15)^2=361$"], "n": 89, "id": "6b42663a"}, {"diff": "Medium", "type": "spr", "q": "A right square pyramid has a height of $12$ inches and a volume of $324$ cubic inches. What is the perimeter, in inches, of the base of this pyramid?", "cat": "Volume of a pyramid", "skill": "Area & Volume", "dom": "Geometry & Trigonometry", "ans": "36", "rev": {"formula": ["$V=\\frac13Bh$, where $B=s^2$"], "tip": ["Find the side $s$ first, then multiply by $4$"], "trap": ["Answering $9$ (side) or $81$ (area)"], "steps": ["$324=\\frac13s^2(12)=4s^2$", "$s^2=81\\Rightarrow s=9$", "Perimeter $=4(9)=36$"], "desmos": ["Type 3*324/12 and read 81, then take the square root and multiply by 4"]}, "n": 90, "id": "80c52b19"}, {"diff": "Medium", "type": "mc", "q": "$5xy+8xt-22yt=0$. In the given equation, $x$ and $y$ are positive and $x<y$. Which equation correctly expresses $t$ in terms of $x$ and $y$?", "cat": "Isolating a variable", "skill": "Equivalent Expressions", "dom": "Advanced Math", "ans": "D", "rev": {"formula": ["Move the terms without $t$ to one side, factor out $t$, then divide"], "tip": ["Collect the $t$-terms: $t(8x-22y)=-5xy$"], "trap": ["Dropping the negative sign (choice C)"], "steps": ["$8xt-22yt=-5xy$", "$t(8x-22y)=-5xy$", "$t=\\frac{-5xy}{8x-22y}=\\frac{5xy}{22y-8x}$"], "desmos": ["Substitute x=1, y=2 and test each choice"]}, "choices": ["$t=\\dfrac{xy}{4(y-x)}$", "$t=\\dfrac14$", "$t=\\dfrac{5xy}{8x-22y}$", "$t=\\dfrac{5xy}{22y-8x}$"], "n": 91, "id": "1aa5896c"}, {"diff": "Hard", "type": "mc", "q": "$f(x)=(1.06)^{3-5x}$. The function $f$ is defined by the given equation. The equation can be rewritten as $f(x)=a\\left(1-\\frac{p}{100}\\right)^x$, where $a$ and $p$ are constants. Which of the following is closest to the value of $p$?", "cat": "Exponential functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "C", "rev": {"formula": ["$b^{m+nx}=b^m\\cdot(b^n)^x$"], "tip": ["The base of the rewritten form is $1.06^{-5}$"], "trap": ["Choosing $1.06^5-1\\approx 34$ percent growth or $18$"], "steps": ["$f(x)=1.06^3\\cdot(1.06^{-5})^x$", "$1.06^{-5}\\approx0.7473$", "$1-\\frac{p}{100}=0.7473\\Rightarrow p\\approx25.3$"], "desmos": ["Type 1.06^(-5) and read 0.7473, then 1-0.7473"]}, "choices": ["$75$", "$52$", "$25$", "$18$"], "n": 92, "id": "25747c78"}, {"diff": "Easy", "type": "mc", "q": "For a function $f$, the value of $f(x)$ is multiplied by $3$ for every increase of $1$ in the value of $x$. When $x=0$, $f(x)=7$. Which of the following equations defines $f$?", "cat": "Exponential functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "B", "rev": {"formula": ["$f(x)=a\\,b^x$, with $a=f(0)$ and $b=$ growth factor"], "tip": ["'Multiplied by $3$' per unit means the base is $3$"], "trap": ["Choosing $7(3x)$ (linear) or swapping $a$ and $b$"], "steps": ["$a=7$, $b=3$", "$f(x)=7(3)^x$"], "desmos": ["Test $x=0$ and $x=1$: $7$ and $21$"]}, "choices": ["$f(x)=7(3x)$", "$f(x)=7(3)^x$", "$f(x)=3(7)^x$", "$f(x)=7+3x$"], "n": 93, "id": "e2983a01"}, {"diff": "Medium", "type": "spr", "q": "In triangle $PQR$, the measure of angle $P$ is $(4x+17)^\\circ$, the measure of angle $Q$ is $(5x+16)^\\circ$, $PQ=6$, and $QR=6$. Side $PR$ is extended through point $R$ to point $S$. The measure of angle $QRS$ is $y^\\circ$. What is the value of $y$?", "cat": "Triangle angles", "skill": "Lines, Angles & Triangles", "dom": "Geometry & Trigonometry", "ans": "123", "rev": {"formula": ["Equal sides have equal opposite angles", "Angles in a triangle sum to $180^\\circ$; exterior angle $=180^\\circ-$ interior angle"], "tip": ["$PQ=QR$, so angles $P$ and $R$ are equal"], "trap": ["Answering $57$ (the interior angle $R$)"], "steps": ["$\\angle R=\\angle P=4x+17$", "$(4x+17)+(5x+16)+(4x+17)=180\\Rightarrow x=10$", "$\\angle R=57^\\circ$", "$y=180-57=123$"], "desmos": ["Solve 13x+50=180 for x"]}, "n": 94, "id": "95992b09"}, {"diff": "Hard", "type": "mc", "q": "A right square pyramid has a height of $15$ centimeters (cm). A second right square pyramid has a height of $30$ centimeters. The area of the base of each pyramid is $100\\ \\text{cm}^2$. Which of the following is closest to the difference in the surface area of the second pyramid and the surface area of the first pyramid, in $\\text{cm}^2$?", "cat": "Surface area of a pyramid", "skill": "Area & Volume", "dom": "Geometry & Trigonometry", "ans": "C", "rev": {"formula": ["Surface area $=$ base $+4\\cdot\\frac12\\cdot s\\cdot\\ell$, with slant height $\\ell=\\sqrt{h^2+(s/2)^2}$"], "tip": ["The base is the same, so the difference is the lateral area difference; the base side is $10$"], "trap": ["Using the height instead of the slant height"], "steps": ["Base side $s=10$; half-side $=5$", "$\\ell_1=\\sqrt{15^2+5^2}\\approx15.81$, $\\ell_2=\\sqrt{30^2+5^2}\\approx30.41$", "Lateral area $=2s\\ell=20\\ell$", "$20(30.41-15.81)\\approx292$"], "desmos": ["Type 20*(sqrt(925)-sqrt(250)) and read 292.05"]}, "choices": ["$315$", "$506$", "$292$", "$214$"], "n": 95, "id": "f70dad07"}, {"diff": "Hard", "type": "spr", "q": "The function $f$ is defined by $f(x)=\\frac{|x|}{a}-12$, where $a<0$. What is the product of $f(14a)$ and $f(5a)$?", "cat": "Absolute value functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "442", "rev": {"formula": ["$|x|=-x$ when $x<0$; here $a<0$, so $|ka|=-ka$ for $k>0$"], "tip": ["Since $a<0$, $\\frac{|14a|}{a}=\\frac{14|a|}{a}=-14$"], "trap": ["Treating $\\frac{|a|}{a}$ as $+1$"], "steps": ["$f(14a)=\\frac{14|a|}{a}-12=-14-12=-26$", "$f(5a)=-5-12=-17$", "$(-26)(-17)=442$"], "desmos": ["Pick a=-1: f(-14)=14/(-1)-12=-26, f(-5)=-17"]}, "n": 96, "id": "2f121638"}, {"diff": "Easy", "type": "mc", "q": "$234$ is $p\\%$ greater than $18$. What is the value of $p$?", "cat": "Percent change", "skill": "Percentages", "dom": "Problem-Solving & Data Analysis", "ans": "A", "rev": {"formula": ["Percent change $=\\frac{\\text{new}-\\text{old}}{\\text{old}}\\times100$"], "tip": ["Compare to the original, $18$"], "trap": ["Answering $1{,}300$ (the percent of $18$, not the percent greater) or $216$ (the difference)"], "steps": ["$\\frac{234-18}{18}=\\frac{216}{18}=12$", "$12\\times100=1{,}200$"], "desmos": ["Type (234-18)/18*100 and read 1200"]}, "choices": ["$1{,}200$", "$1{,}300$", "$216$", "$234$"], "n": 97, "id": "3e287f1c"}, {"diff": "Hard", "type": "mc", "q": "Which expression is a factor of $y^2(x-4)-49(x-4)^3$?", "cat": "Factoring", "skill": "Equivalent Expressions", "dom": "Advanced Math", "ans": "C", "rev": {"formula": ["Factor out the common factor $(x-4)$, then use the difference of squares $a^2-b^2=(a-b)(a+b)$"], "tip": ["$49(x-4)^2=[7(x-4)]^2$"], "trap": ["Stopping after one factor"], "steps": ["$=(x-4)\\left[y^2-49(x-4)^2\\right]$", "$=(x-4)\\left[y-7(x-4)\\right]\\left[y+7(x-4)\\right]$", "$y+7(x-4)=y+7x-28$"], "desmos": ["Test x=5, y=1: expression value $-48$; $y+7x-28=8$ divides it"]}, "choices": ["$y(x-4)$", "$y+x-4$", "$y+7x-28$", "$(x-7)(x-4)$"], "n": 98, "id": "72fb8ee8"}], "mods": [{"name": "Module 1 · Read   if(n==='overline'){const a=grp();return '<span class="ov">'+a+'</span>'}
  if(n==='frac'||n==='dfrac'||n==='tfrac'){const a=grp(),b=grp();return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'}
  if(n==='sqrt'){let ix='';if(s[i]==='['){const j=s.indexOf(']',i);ix=s.slice(i+1,j);i=j+1}const a=grp();return (ix?'<sup class="ix">'+sub(ix)+'</sup>':'')+'√<span class="rt">'+a+'</span>'}
  if(n==='text'||n==='mathrm'){const a=grpRaw();return '<span class="tx">'+a+'</span>'}
  if(n in SYM){const v=SYM[n];return ['le','ge','leq','geq','neq','ne','approx'].includes(n)?'<span class="op">'+v+'</span>':v}
  return n}
 function grpRaw(){ if(s[i]==='{'){let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='{')d++;else if(s[j]==='}')d--;j++}const t=s.slice(i+1,j-1);i=j;return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')} return ''}
 function run(){let out='';while(i<s.length){const c=s[i];let piece;
   if(c==='^'){i++;piece='<sup>'+grp()+'</sup>'}
   else if(c==='_'){i++;piece='<sub>'+grp()+'</sub>'}
   else if(c==='{'){piece=grp()}
   else piece=one();
   out+=piece;last=piece.replace(/<[^>]*>/g,'').slice(-1)||last;}
  return out}
 return run()}
function rich(t){ if(t==null)return '';const parts=String(t).replace(/\\\$/g,'\uE000').split(/(\$[^$]+\$)/);return parts.map(p=>p[0]==='$'&&p.length>1&&p.endsWith('$')?'<span class="m">'+mathHtml(p.slice(1,-1))+'</span>':esc(p)).join('').replace(/\n/g,'<br>').replace(/\uE000/g,'$').replace(/\[\[(\/?)(u|i|b)\]\]/g,'<$1$2>')}
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ---------- state ---------- */
const Q=TEST.questions,N=Q.length;
const S={phase:'home',cur:0,ans:Array(N).fill(null),flag:Array(N).fill(false),mult:1,left:0,total:0,secs:0,tint:null,timerHidden:false};
const $=id=>document.getElementById(id);
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.title=TEST.title+' · Greek SAT';$('htitle').textContent='Greek SAT · '+TEST.title;
function parseNum(v){v=String(v).trim().replace(/\s+/g,'').replace('−','-').replace(/,/g,'');if(!v)return NaN;let m=v.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);m=v.match(/^-?\d*\.?\d+$/)||v.match(/^-?\d+\.?$/);return m?parseFloat(v):NaN}
function isRight(i){const q=Q[i],a=S.ans[i];if(a==null||a==='')return false;if(q.type==='mc')return a===q.ans;
 const x=parseNum(a);if(isNaN(x))return false;return q.ans.split(';').some(k=>{const y=parseNum(k);return Math.abs(x-y)<=(Number.isInteger(y)?1e-9:0.0007)})}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
/* ---------- screens ---------- */

/* ---------- full-length: two locked modules ---------- */
const MODS=TEST.mods; S.mod=0;
const DOMS=['Algebra','Advanced Math','Problem-Solving & Data Analysis','Geometry & Trigonometry'];
function modOf(i){return MODS.findIndex(m=>i>=m.s&&i<m.e)}
function home(){S.phase='home';$('hmod').textContent=TEST.kindLabel;$('timer').textContent='';
  const base=TEST.minutes;
  $('app').innerHTML=`<div class="card"><div class="kick">${esc(TEST.domain)}</div><h2>${esc(TEST.title)}</h2>
  <p>${MODS.length>1?MODS.length+' modules · '+MODS.map(m=>m.e-m.s).join(' + ')+' questions':(MODS[0].e-MODS[0].s)+' questions · one module'} · 32 min per Reading & Writing module, 35 min per Math module · Desmos calculator and reference sheet available in the Math modules.</p>
  <p class="muted">${esc(TEST.note)}</p>
  <h3>Choose your timing (applies to each module)</h3><p><label><input type="radio" name="t" value="1" checked> Standard (32 / 35 min per module)</label><br>
  <label><input type="radio" name="t" value="1.25"> +25% extra time (${Math.round(32*1.25)} / ${Math.round(35*1.25)} min per module)</label><br><label><input type="radio" name="t" value="1.5"> +50% extra time (${Math.round(32*1.5)} / ${Math.round(35*1.5)} min per module)</label></p>
  <div class="stop">Within a module you can move back and forth, flag questions for review and open the overview to see what you have answered. Once you submit a module it is locked, and you cannot return to a module once the next one begins. Answers and explanations appear only after you finish the last module.</div>
  <button class="btn" onclick="begin()">Begin Module 1</button></div>`}
function begin(){const r=document.querySelector('input[name=t]:checked');if(r)S.mult=parseFloat(r.value);startMod()}
function startMod(){S.total=Math.round(MODS[S.mod].min*60*S.mult);S.left=S.total;S.phase='test';
  clearInterval(S.tint);S.tint=setInterval(()=>{S.left--;if(S.left<=0){clearInterval(S.tint);endMod(true)}tick()},1000);
  (MODS[S.mod].rw?['tt']:['tt','calcb','refb']).forEach(i=>$(i).classList.remove('hide'));$('hmod').textContent=MODS[S.mod].name;tick();S.cur=MODS[S.mod].s;render()}
function tick(){$('timer').textContent=S.timerHidden?'--:--':fmt(S.left)}
function toggleTimer(){S.timerHidden=!S.timerHidden;$('tt').textContent=S.timerHidden?'Show':'Hide';tick()}
function stemEl(q){const f=q.fig?`<div class="nqfig"><img alt="Figure" src="${q.fig}"></div>`:'';const ps=q.p?`<div class="rwp">${rich(q.p)}</div>`:'';return `${f}${ps}<div class="nqstem">${rich(q.q)}</div>`}
function render(){const q=Q[S.cur],i=S.cur,m=MODS[S.mod];let inp='';
  if(q.type==='mc'){inp='<div class="nqch">'+q.choices.map((c,k)=>{const L='ABCD'[k];return `<button class="nqc ${S.ans[i]===L?'sel':''}" onclick="pick('${L}')"><b>${L})</b><span>${rich(c)}</span></button>`}).join('')+'</div>'}
  else{inp=`<div class="nqspr"><label>STUDENT-PRODUCED RESPONSE</label><input id="sprin" value="${esc(S.ans[i]||'')}" oninput="S.ans[${i}]=this.value;$('sprprev').textContent=this.value" autocomplete="off"><small>Enter a number or a fraction, such as 3/4 or -2.5. Your answer: <b id="sprprev">${esc(S.ans[i]||'')}</b></small></div>`}
  const last=i===m.e-1,lbl=S.mod===MODS.length-1?'Submit Module '+(S.mod+1):'Submit Module '+(S.mod+1);
  $('app').innerHTML=`<div class="nq"><div class="nqh"><div class="nqn">${i-m.s+1}</div><div class="nqs"><span>${esc(m.name)}</span><span>${q.type==='mc'?'Multiple choice':'Student-produced response'}<button class="nqflag ${S.flag[i]?'on':''}" onclick="toggleFlag()">${S.flag[i]?'\u2691 Flagged':'\u2690 Flag for review'}</button></span></div></div><div class="nqb">${stemEl(q)}${inp}</div></div>
  <div class="nav" style="max-width:760px;margin:0 auto"><span><button class="btn alt" onclick="overview()">Question ${i-m.s+1} of ${m.e-m.s} \u25BE</button></span><div>${i>m.s?'<button class="btn alt" onclick="go(-1)">Back</button> ':''}${last?`<button class="btn gold" onclick="confirmMod()">${lbl}</button>`:'<button class="btn" onclick="go(1)">Next</button>'}</div></div>`;
  window.scrollTo(0,0)}
function pick(L){S.ans[S.cur]=L;render()}
S.flag={};
function go(d){const m=MODS[S.mod],n=S.cur+d;if(n>=m.s&&n<m.e){S.cur=n;render()}}
function jump(i){S.cur=i;closeOv();render()}
function toggleFlag(){S.flag[S.cur]=!S.flag[S.cur];render()}
function closeOv(){$('ovw').classList.remove('on')}
function isAns(i){return !(S.ans[i]==null||S.ans[i]==='')}
function gridHtml(m){let h='<div class="qgrid">';for(let i=m.s;i<m.e;i++)h+=`<button class="qc ${isAns(i)?'ans':''} ${S.flag[i]?'fl':''} ${i===S.cur?'cur':''}" onclick="jump(${i})">${i-m.s+1}</button>`;return h+'</div><div class="qleg"><span><i style="background:#e9f4ee;border-color:#2e8b57"></i>Answered</span><span><i></i>Unanswered</span><span><span style="color:#0D5EAF">\u2691</span> Flagged for review</span><span><i style="border-color:#111"></i>Current</span></div>'}
function counts(m){let un=0,fl=0;for(let i=m.s;i<m.e;i++){if(!isAns(i))un++;if(S.flag[i])fl++}return{un,fl}}
function overview(){const m=MODS[S.mod],c=counts(m);$('ovwp').innerHTML=`<h3>${esc(m.name)} overview</h3><p class="muted">Unanswered: <b>${c.un}</b> &nbsp;\u00b7&nbsp; Flagged: <b>${c.fl}</b>. Click a number to go to that question.</p>${gridHtml(m)}<div class="center"><button class="btn alt" onclick="closeOv()">Close</button></div>`;$('ovw').classList.add('on')}
function confirmMod(){const m=MODS[S.mod],c=counts(m);
  $('app').innerHTML=`<div class="card"><h2>Check your work</h2><p>${esc(m.name)}: unanswered <b>${c.un}</b> \u00b7 flagged for review <b>${c.fl}</b>. Click a number to return to that question.</p>${gridHtml(m)}<div class="stop">After you submit, ${esc(m.name)} is locked and you cannot return to it.</div><button class="btn alt" onclick="S.cur=Math.min(Math.max(S.cur,${m.s}),${m.e-1});render()">Back to questions</button> <button class="btn" onclick="endMod(false)">Submit ${esc(m.name)}</button></div>`;window.scrollTo(0,0)}
function endMod(auto){clearInterval(S.tint);const m=MODS[S.mod];S['secs'+S.mod]=S.total-Math.max(S.left,0);S.auto=S.auto||auto;
  ['tt','calcb','refb'].forEach(i=>$(i).classList.add('hide'));closeCalc();closeOv();$('timer').textContent='';
  if(S.mod<MODS.length-1){S.phase='break';$('hmod').textContent=m.name+' complete';
    $('app').innerHTML=`<div class="card"><div class="kick">${esc(m.name)} submitted${auto?' (time expired)':''}</div><h2>${esc(m.name)} is locked</h2><p>You answered ${modScore(S.mod).c} of ${m.e-m.s} correctly. The focus bar below shows where to put your effort. Full explanations unlock when you finish the test.</p>${focusBar(S.mod)}<div class="stop">Module ${S.mod+2} starts when you press the button. You cannot return to ${esc(m.name)}.</div><button class="btn" onclick="S.mod++;startMod()">Begin Module ${S.mod+2}</button></div>`;window.scrollTo(0,0)}
  else{S.phase='done';S.secs=(S.secs0||0)+(S.secs1||0);results(S.auto)}}
function modScore(k){const m=MODS[k];let c=0;for(let i=m.s;i<m.e;i++)if(isRight(i))c++;return{c,n:m.e-m.s}}
/* ---------- results ---------- */
function groupBy(key,a,b){const m={};for(let i=a;i<b;i++){const q=Q[i],k=key(q);(m[k]=m[k]||{n:0,c:0}).n++;if(isRight(i))m[k].c++}return m}
function col(p){return p<50?'#0D5EAF':p<75?'#5DADE2':'#2e8b57'}
function bars(m,sub){return Object.entries(m).map(([k,v])=>({k,...v,p:Math.round(100*v.c/v.n)})).sort((a,b)=>a.p-b.p||b.n-a.n).map(b=>`<div class="frow"><div>${esc(b.k)}${sub&&sub[b.k]?`<div class="muted">${esc(sub[b.k])}</div>`:''}</div><div class="bar"><i style="width:${b.p}%;background:${col(b.p)}"></i></div><div><b>${b.p}%</b> <span class="muted">${b.c}/${b.n}</span></div></div>`).join('')}
function weakest(m,k){return Object.entries(m).map(([n,v])=>({n,...v,p:v.c/v.n})).sort((a,b)=>a.p-b.p||b.n-a.n).slice(0,k)}
function focusBar(k){const m=MODS[k],byDom=groupBy(q=>q.dom,m.s,m.e),bySk=groupBy(q=>q.skill,m.s,m.e),dom={};Q.forEach(q=>dom[q.skill]=q.dom);
  const w=weakest(bySk,3).filter(x=>x.p<1);
  return `<div class="card"><h3>${esc(m.name)} Focus Bar</h3><p class="muted">Where to emphasize: red first, then gold.</p>${bars(byDom)}
  <h4>By skill</h4>${bars(bySk,dom)}
  <div class="emph"><b>Emphasize:</b> ${w.length?w.map(x=>esc(x.n)+' ('+x.c+'/'+x.n+')').join('; '):'No weak spots in this module. Keep your pace and accuracy.'}</div></div>`}
function focusHtml(){const byDiff=groupBy(q=>q.diff,0,N);let h='';
  MODS.forEach((m,k)=>h+=focusBar(k));
  if(MODS.length===1){return h+`<div class="card"><h3>Focus Report: By difficulty</h3>${['Easy','Medium','Hard'].map(k=>{const v=byDiff[k];if(!v)return '';const p=Math.round(100*v.c/v.n);return `<div class="frow"><div>${k}</div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div><div><b>${p}%</b> <span class="muted">${v.c}/${v.n}</span></div></div>`}).join('')}</div>`}
  const all=groupBy(q=>q.dom,0,N),allS=groupBy(q=>q.skill,0,N),dom={};Q.forEach(q=>dom[q.skill]=q.dom);
  h+=`<div class="card"><h3>Whole-test Focus Report: By domain</h3>${bars(all)}</div><div class="card"><h3>Whole-test Focus Report: By skill</h3>${bars(allS,dom)}</div>`;
  h+=`<div class="card"><h3>Focus Report: By difficulty</h3>${['Easy','Medium','Hard'].filter(k=>byDiff[k]).map(k=>{const v=byDiff[k],p=Math.round(100*v.c/v.n);return `<div class="frow"><div>${k}</div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div><div><b>${p}%</b> <span class="muted">${v.c}/${v.n}</span></div></div>`}).join('')}</div>`;
  return h}
function results(auto){const R=Q.map((q,i)=>isRight(i)),tot=R.filter(Boolean).length;$('hmod').textContent='Results and Review';
  const ms=MODS.map((m,k)=>{const s=modScore(k);return `<div><div class="muted">${esc(m.name)}</div><h1 style="margin:0">${s.c} / ${s.n}</h1></div>`}).join('');
  $('app').innerHTML=`<div class="card"><div class="kick">${esc(TEST.domain)}</div><h2>Your Results${auto?' (time expired in a module)':''}</h2><div class="scorebox"><div><div class="muted">${esc(TEST.title)}</div><h1 style="margin:0">${tot} / ${N}</h1></div>${ms}<div><div class="muted">Percent correct</div><h1 style="margin:0">${Math.round(100*tot/N)}%</h1></div><div><div class="muted">Time used</div><h1 style="margin:0">${fmt(S.secs)}</h1></div></div>
  <p class="muted">Practice score only; unofficial. Use the focus bars below to decide what to study next.</p>
  <div class="noprint" style="margin-top:14px"><button class="btn alt" onclick="document.getElementById('rv').scrollIntoView()">Go to review</button> <button class="btn alt" onclick="showRev('wrong')">Show incorrect only</button> <button class="btn alt" onclick="showRev('all')">Show all</button></div></div>
  ${focusHtml()}<div id="rv"></div>
  <div class="card noprint" id="export"><h3>Export</h3><p class="muted">Save your results and the full review.</p><button class="btn" onclick="window.print()">Export review as PDF (Print → Save as PDF)</button> <button class="btn alt" onclick="csv()">Download results as CSV</button> <button class="btn alt" onclick="dl()">Download review as HTML</button></div>`;
  showRev('all');window.scrollTo(0,0)}
function lst(t,a){return a&&a.length?`<h4>${t}</h4><ul>${a.map(x=>`<li>${rich(x)}</li>`).join('')}</ul>`:''}
function ordl(t,a){return a&&a.length?`<h4>${t}</h4><ol>${a.map(x=>`<li>${rich(x)}</li>`).join('')}</ol>`:''}
function showRev(f){let h='';Q.forEach((q,i)=>{const a=S.ans[i],ok=isRight(i);if(f==='wrong'&&ok)return;const rv=q.rev;
 const body=lst(q.rw?'Key idea':'Formula',rv.formula)+ordl(q.rw?'Why it is correct':'How to solve it (steps)',rv.steps)+lst('Tip',rv.tip)+lst('Trap',rv.trap)+ordl('How to use Desmos',rv.desmos);
 const chs=q.type==='mc'?'<div class="rchoices">'+q.choices.map((c,k)=>{const L='ABCD'[k];return `<div class="rch ${L===q.ans?'right':''} ${a===L&&!ok?'wrong':''}"><span class="cl">${L}</span><span class="ctext">${rich(c)}</span></div>`}).join('')+'</div>':'';
 const corr=q.type==='mc'?q.ans:(q.disp?rich(q.disp):esc(q.ans.split(';').join(' or ')));
 h+=`<div class="card rev ${ok?'ok':'bad'}"><div><span class="qbadge">M${modOf(i)+1} · Q${i-MODS[modOf(i)].s+1}</span><span class="pill">${esc(q.skill)}</span>${q.cat.toLowerCase()===q.skill.toLowerCase()?'':`<span class="pill">${esc(q.cat)}</span>`}<span class="pill">${esc(q.diff)}</span>${q.tag?`<span class="otag">${esc(q.tag)}</span>`:''}<span class="pill g">${esc(MODS[modOf(i)].name)}</span></div>
 <p class="ansline"><b>Your answer:</b> ${a?esc(a):'<i>blank</i>'} &nbsp; <b>Correct:</b> ${corr} &nbsp; ${ok?'✓':'✗'}</p>
 ${stemEl(q)}${chs}<div class="sect">${body}</div></div>`});
 $('rv').innerHTML='<h2>Question Review</h2>'+h}
function csv(){let r=[['Q','Skill','Topic','Difficulty','Your answer','Correct','Result']];Q.forEach((q,i)=>{const a=S.ans[i];r.push([i+1,q.skill,q.cat,q.diff,a||'',q.ans.split(';').join(' / '),isRight(i)?'Correct':'Incorrect'])});
 const b=new Blob([r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GreekSAT_'+TEST.id+'_Results.csv';a.click()}
function dl(){const logo=document.querySelector('header img').src;const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(TEST.title)+' Review</title>'+document.querySelector('style').outerHTML+'</head><body><header><div class="brandrow"><img alt="Greek flag" src="'+logo+'"><div class="brand">Greek SAT · '+esc(TEST.title)+'</div></div></header><div class="wrap">'+$('app').innerHTML+'</div></body></html>';const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GreekSAT_'+TEST.id+'_Review.html';a.click()}
function openCalc(){const f=$('calc-frame');if(!f.getAttribute('src'))f.setAttribute('src','https://www.desmos.com/calculator');$('calc-overlay').classList.add('on')}
function closeCalc(){$('calc-overlay').classList.remove('on')}
function openRef(){$('refov').classList.add('on')}
home();
</script></body></html>
