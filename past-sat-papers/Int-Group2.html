<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Full Practice Test · Int-Group2 · September 2026 · Greek SAT</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--crim:#0D5EAF;--gold:#5DADE2;--ink:#1a1a1a;--bg:#faf8f4;--line:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:Jost,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif}
header{background:var(--crim);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:4px solid var(--gold)}
header .brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.5px}
header .mid{font-size:14px;opacity:.95;white-space:nowrap;margin:0 12px}
header .brand{font-size:19px!important;line-height:1.15}
.tools{display:flex;gap:8px;align-items:center}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--crim);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-size:15px;font-weight:500}
.btn.alt{background:#fff;color:var(--crim);border:1.5px solid var(--crim)}
.btn.gold{background:var(--gold)}
.hbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:5px;padding:6px 12px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px}
#timer{font-weight:600;font-size:18px;min-width:70px;text-align:center}
.qbadge{display:inline-block;background:#111;color:#fff;font-weight:600;padding:4px 12px;border-radius:3px;margin-right:10px}
.flagb{background:#fff;border:1px solid #888;border-radius:5px;padding:6px 12px;font-size:14px}.flagb.on{background:#fff3cd;border-color:var(--gold)}
.qimg{width:100%;display:block;margin:14px 0;border:1px solid #eee;background:#fff}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.opt{display:flex;align-items:center;gap:4px}
.optb{width:54px;height:54px;border-radius:50%;border:2px solid #444;background:#fff;font-size:20px;font-weight:600}
.optb.sel{background:var(--crim);color:#fff;border-color:var(--crim)}
.optb.x{opacity:.35;text-decoration:line-through}
.xb{border:0;background:none;font-size:13px;color:#777;text-decoration:underline}
.spr input{font-size:20px;padding:10px;border:2px solid #444;border-radius:6px;width:200px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin:12px 0}
.gq{height:42px;border:1.5px dashed #888;background:#fff;border-radius:4px;font-weight:600;position:relative}
.gq.ans{border-style:solid;background:#e9f3ff}.gq.cur{outline:3px solid var(--crim)}
.gq.fl::after{content:'⚑';position:absolute;top:-6px;right:2px;color:var(--gold);font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}.panel{background:#fff;border-radius:10px;padding:20px;max-width:900px;width:92%;max-height:88vh;overflow:auto}
#calc-panel{width:94%;height:88vh;max-width:1100px;display:flex;flex-direction:column}
#calc-panel iframe{flex:1;border:1px solid #ccc;border-radius:6px}
.bar{height:16px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.frow{display:grid;grid-template-columns:260px 1fr 70px;gap:12px;align-items:center;margin:8px 0;font-size:15px}
.rev{border:1px solid var(--line);border-left:6px solid var(--line)}.rev.ok{border-left-color:#2e8b57}.rev.bad{border-left-color:var(--crim)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:#eee;margin-right:6px}.pill.g{background:var(--gold);color:#fff}
.sect h4{margin:12px 0 4px;color:var(--crim);font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.sect ul{margin:0;padding-left:20px}.sect li{margin:2px 0}
.hide{display:none}.center{text-align:center}.muted{color:#666;font-size:14px}
.stop{border:2px solid #111;padding:12px;margin:14px 0;font-weight:600}
@media print{header,.noprint,.nav{display:none!important}body{background:#fff}.card{break-inside:avoid;border:1px solid #bbb}}

.qtop{display:flex;justify-content:space-between;align-items:center}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #9aa0a6;border-radius:10px;padding:10px 14px;min-height:56px}
.choice:hover{border-color:var(--crim)}
.choice.sel{border-color:var(--crim);background:#EAF4FC;box-shadow:0 0 0 2px var(--crim) inset}
.choice img,.rch img{max-width:calc(100% - 50px);height:auto;display:block}
.cl{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-weight:600;background:#fff}
.choice.sel .cl{background:var(--crim);border-color:var(--crim);color:#fff}
.rchoices{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rch{display:flex;align-items:center;gap:12px;border:1.5px solid #ccc;border-radius:8px;padding:6px 10px;background:#fff}
.rch.right{border-color:#2e8b57;background:#eef8f1}.rch.wrong{border-color:var(--crim);background:#EAF4FC}
.rch.right .cl{background:#2e8b57;color:#fff;border-color:#2e8b57}.rch.wrong .cl{background:var(--crim);color:#fff;border-color:var(--crim)}
.poe{list-style:none;padding-left:0}.poe li{padding:6px 10px;border-left:4px solid #ddd;margin:4px 0;background:#faf8f4}.poe li.best{border-left-color:#2e8b57;background:#eef8f1}
.vocab{margin-top:10px;padding:8px 12px;border:1px solid var(--gold);border-radius:6px;background:#fffaf0}
.modh{margin:26px 0 8px;color:var(--crim);border-bottom:2px solid var(--gold)}
.textstem{font-family:Georgia,serif;font-size:18px;line-height:1.65;margin:14px 0;padding:6px 2px}.textstem p{margin:0 0 12px}.ctext{font-size:17px;line-height:1.45}.otag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:#fff3cd;border:1px solid var(--gold);margin-right:6px}
.choices{gap:0;margin-top:10px}
.choice{border:0;border-bottom:1px solid #d9d9d9;border-radius:0;background:transparent;box-shadow:none!important;min-height:44px;padding:12px 8px;gap:10px;align-items:center}
.choice:hover{background:#f5f1ea;border-color:#d9d9d9}
.choice.sel{background:#E3F0FA;border-color:#d9d9d9;box-shadow:none}
.cl,.choice.sel .cl,.rch .cl,.rch.right .cl,.rch.wrong .cl{flex:0 0 auto;width:auto;height:auto;border:0;border-radius:0;background:transparent!important;color:#111!important;font-weight:700;font-size:18px;display:inline}
.cl::after{content:")"}
.choice.sel .cl{color:var(--crim)!important}
.rch{border:0;border-bottom:1px solid #e3e3e3;border-radius:0;background:transparent}
.rch.right{background:#eef8f1}.rch.wrong{background:#EAF4FC}
.brandrow{display:flex;align-items:center;gap:12px}.brandrow img{height:44px;width:auto;background:#fff;border-radius:6px;padding:2px}
.choice img,.rch img{mix-blend-mode:multiply}
/* math */
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 2px;font-size:.92em;line-height:1.2}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span+span{padding:0 3px}
.rt{border-top:1.5px solid currentColor;padding:0 2px}
.op{padding:0 .22em}
.m i{font-family:"Cambria Math",Georgia,serif}
.m .tx{font-style:normal;font-family:inherit}

.textstem .m,.ctext .m,.sect .m,.stop .m{font-size:1.04em}
.textstem{font-family:Jost,Arial,sans-serif;font-size:18px;line-height:1.7}
.textstem .fig{display:block;max-width:100%;margin:6px auto 14px}
.fr{vertical-align:middle}
.sect li .m,.sect ol li .m{font-size:1em}
.sect ol{margin:0;padding-left:22px}.sect ol li{margin:4px 0}
.ansline{margin:6px 0 4px}
.kick{font-size:12px;letter-spacing:.16em;color:var(--crim);font-weight:600;text-transform:uppercase}
.scorebox{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0}
.emph{border-left:5px solid var(--gold);background:#fffaf0;padding:10px 14px;margin:14px 0;border-radius:4px}
.hbadge{background:#fff;color:var(--crim);font-weight:600;font-size:12px;padding:3px 10px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase}
.spr input{font-family:inherit}
.textstem .qimg{width:auto;max-width:min(100%,640px);margin:10px auto;display:block}
@media print{.overlay{display:none!important}}
.ov{border-top:1.3px solid currentColor;padding-top:0}

/* Test Ninjas question layout */
.nq{background:#fff;border:1px solid #cfcfcf;border-radius:4px;padding:0 0 18px;max-width:760px;margin:0 auto 16px}
.nqh{display:flex;align-items:stretch;border-bottom:1px solid #fff}
.nqn{background:#111;color:#fff;font:600 15px Jost,Arial,sans-serif;min-width:40px;display:flex;align-items:center;justify-content:center}
.nqs{flex:1;background:#dedede;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font:600 10.5px Jost,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#333}
.nqs span:last-child{color:#777;font-weight:500}
.nqb{padding:18px 34px 0}
.nqfig{border:1px solid #e3e3e3;background:#fbfbfb;padding:10px;margin:0 0 16px;text-align:center}
.nqfig img{max-width:100%;max-height:340px;height:auto;display:inline-block;mix-blend-mode:multiply}
.nqstem{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55;color:#111;margin:0 0 14px}
.nqch{display:flex;flex-direction:column;gap:2px}
.nqc{display:flex;gap:12px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:3px;padding:5px 8px;font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:#111;cursor:pointer}
.nqc:hover{background:#f3efe7}.nqc.sel{background:#E3F0FA;outline:1.5px solid var(--crim)}
.nqc b{font-weight:600;min-width:26px}
.nqspr{border:1px solid #bbb;border-radius:3px;padding:10px 14px;margin-top:6px;max-width:420px}
.nqspr label{display:block;font:600 10.5px Jost,Arial,sans-serif;letter-spacing:.1em;color:#555;margin-bottom:8px}
.nqspr input{width:100%;border:0;border-bottom:1.5px solid #333;font:20px 'Source Serif 4',Georgia,serif;padding:4px 2px;background:transparent;outline:none}
.nqspr small{display:block;margin-top:6px;color:#777;font:12px Jost,Arial,sans-serif}
@media(max-width:600px){.nqb{padding:14px 16px 0}}
.nqflag{background:transparent;border:0;cursor:pointer;font:600 11px Jost,Arial,sans-serif;letter-spacing:.06em;color:#333;text-transform:uppercase;padding:0 0 0 14px}
.nqflag.on{color:var(--crim)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:14px 0}
.qc{position:relative;border:1.5px solid #bbb;background:#fff;border-radius:6px;padding:10px 0;font:600 15px Jost,Arial,sans-serif;cursor:pointer;color:#555}
.qc.ans{background:#e9f4ee;border-color:#2e8b57;color:#1d5c3a}.qc.cur{outline:2.5px solid #111}
.qc.fl::after{content:"\2691";position:absolute;top:-8px;right:-4px;color:var(--crim);font-size:17px}
.qleg{display:flex;gap:16px;flex-wrap:wrap;font:13px Jost,Arial,sans-serif;color:#555;margin:6px 0}
.qleg i{display:inline-block;width:14px;height:14px;border:1.5px solid #bbb;border-radius:3px;vertical-align:-2px;margin-right:5px}
.rwp{border:1px solid #ddd;border-left:5px solid var(--gold);background:#fcfbf8;border-radius:6px;padding:14px 16px;margin:0 0 16px;line-height:1.55;font-size:16px}.rwp u{text-decoration:underline}

<script>
const TEST={"id": "SEP26FULL", "title": "Digital SAT Full Practice Test · Int-Group2 · September 2026", "domain": "Digital SAT Reading & Writing + Math · Full-Length", "kindLabel": "FULL-LENGTH TEST", "minutes": 35, "note": "Reading & Writing (2 modules) followed by Math (2 modules). Questions transcribed from Digital SAT screenshots; every explanation, key idea, formula and tip is written by Greek SAT. Questions marked in the review were partly cut off in the screenshots and have been completed or reconstructed.", "questions": [{"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "A", "choices": ["enrich", "avoid", "predict", "deny"], "rev": {"formula": ["Enhancing public spaces and addressing local issues are positive effects on a community."], "steps": ["The text lists benefits of the murals (\"enhancing public spaces\").", "\"Enrich\" means to improve, which fits the positive tone."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"avoid\" or \"deny\", which clash with the clearly positive examples."], "desmos": []}, "p": "The success of the Mission District Murals in San Francisco, California—a collection of murals that reflect the area’s Latino heritage and cultural history—exemplifies how collaborative art initiatives can ____ their communities in multiple ways, including enhancing public spaces and addressing local issues.", "n": 1, "id": "fb27ea51", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "A", "choices": ["differentiated from", "surpassed by", "elevated from", "explored by"], "rev": {"formula": ["Dark blue water contrasts with the light blue shallows, so the holes are easy to tell apart."], "steps": ["The text contrasts dark blue and light blue water.", "\"Differentiated from\" means distinguished from, which explains why boaters notice them."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"explored by\" because boaters are mentioned; the clue is about color contrast, not exploration."], "desmos": []}, "p": "Blue holes, such as the Great Blue Hole and Watling’s Blue Hole, are deep sinkholes that form underwater. Because the dark blue appearance of their waters means these pits can be easily ____ shallow areas around them, where the water looks light blue, many blue holes have been discovered by people doing recreational activities like boating.", "n": 2, "id": "f82d9da0", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["obviating", "extolling", "necessitating", "rescinding"], "rev": {"formula": ["Changing external temperatures make specialized equipment necessary."], "steps": ["Conditions can affect cargo temperatures, so the equipment is required.", "\"Necessitating\" means making necessary."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"obviating\" (making unnecessary), which reverses the logic."], "desmos": []}, "p": "Commercial truck drivers sometimes transport temperature-sensitive goods like fresh produce through a variety of external conditions that can affect temperatures inside cargo areas, ____ the use of specialized equipment to continuously and automatically monitor and adjust refrigeration settings to prevent the goods from spoiling.", "n": 3, "id": "bcb09e06", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["interpret", "hasten", "transform", "overshadow"], "rev": {"formula": ["Higher prices and loyal customers can change (improve) farmers’ finances."], "steps": ["The text describes major advantages of the model.", "\"Transform\" means to change significantly, matching the scale of the benefits."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"overshadow\" or \"hasten\", which do not make sense with \"financial outlook\"."], "desmos": []}, "p": "By eliminating middlemen, direct-to-consumer sales channels allow small farms to capture retail prices rather than accept lower wholesale rates. The pricing advantages that come with adopting this model, combined with the customer loyalty that comes from forging personal connections, can ____ the financial outlook for many small agricultural producers.", "n": 4, "id": "2aad69c0", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice best states the main purpose of the text?", "cat": "Text structure and purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "A", "choices": ["To discuss the widespread impact of the invention of the automobile", "To detail how cities changed their roads to accommodate motor vehicles", "To argue that technological progress can have unintended negative effects", "To explain how the earliest automobiles worked"], "rev": {"formula": ["The main purpose is the overall goal of the passage, not one detail."], "steps": ["The text contrasts earlier transportation with the automobile.", "It then lists impacts: connecting communities, changing city layouts, giving freedom of movement.", "So the purpose is to discuss the broad impact of the automobile."], "tip": ["Pick the overall goal, not a single supporting detail."], "trap": ["Choosing B because one sentence mentions city layouts, or C because the text never discusses negative effects."], "desmos": []}, "p": "Before the invention of the automobile, personal transportation options typically consisted of riding on horseback or in horse-drawn carriages at slow speeds. When the automobile became widely available in the early 20th century, however, its influence extended far beyond just how people traveled. This invention affected society on many levels. It connected previously isolated communities, changed city layouts, and gave individuals unprecedented freedom of movement.", "n": 5, "id": "2c0b740b", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice best describes the overall structure of the text?", "cat": "Text structure and purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "B", "choices": ["It explains how one cultural institution was founded, then explains its plans to expand further.", "It discusses one cultural institution, then discusses a more recently founded cultural institution.", "It defines a certain type of cultural institution, then argues that this type of institution decisively influences society.", "It describes a trend among cultural institutions in the United States, then identifies an institution that rejects that trend."], "rev": {"formula": ["Structure means what each part of the text does and how the parts are ordered."], "steps": ["Sentences 1–2 describe the Museo de Las Americas (founded 1991).", "Sentences 3–5 describe a more recent institution, the National Museum of Puerto Rican Arts and Culture."], "tip": ["Do not read in arguments or plans that the text never states."], "trap": ["Choosing A or C because they sound like typical passage structures but add content that is not in the text."], "desmos": []}, "p": "Founded in Denver in 1991, the Museo de Las Americas is dedicated to art from Latin America, including the art of Indigenous peoples. Since its founding, it has acquired more than 4,800 objects for its permanent collection. More recently founded US-based institutions devoted to Latino cultures include the National Museum of Puerto Rican Arts and Culture. Located in Chicago, it focuses on the arts and culture of Puerto Rico and of Chicago’s Puerto Rican community.", "n": 6, "id": "69a62484", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best describes the function of the underlined sentence in the text as a whole?", "cat": "Text structure and purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "B", "choices": ["It summarizes a shift in scientists’ understanding of how [[i]]Sparus aurata[[/i]] has responded to ocean acidification.", "It elaborates on a potential consequence of Pimentel and colleagues’ reliance on a relatively small sample size.", "It emphasizes the magnitude of the effect reported by Pimentel and colleagues of ocean acidification on [[i]]Sparus aurata[[/i]].", "It counters the objection of Clark and colleagues to studies that rely on relatively small sample sizes."], "rev": {"formula": ["The underlined sentence continues Clark’s caution and explains what small samples can lead to."], "steps": ["Clark and colleagues caution that small samples can increase biased analysis.", "\"Such analysis, in turn, can contribute to reports of exaggerated effects\" names a further consequence."], "tip": ["Ask what the sentence does for the previous one, not just what it says."], "trap": ["Choosing D: the sentence supports, not counters, the objection by Clark and colleagues."], "desmos": []}, "p": "In 2016 Marta S. Pimentel and colleagues published a study concluding that ocean acidification has a strong effect on the behavior of [[i]]Sparus aurata[[/i]], a species of fish. However, Pimentel and colleagues’ study relied on a mean sample size of only 12 fish. In a 2022 review of various scientists’ conclusions about the impacts of ocean acidification on fish behavior, Timothy D. Clark and colleagues caution that relying on such a relatively small sample size can increase the potential for biased analysis. [[u]]Such analysis, in turn, can contribute to reports of exaggerated effects.[[/u]]", "n": 7, "id": "77e12603", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "What does the text indicate is a benefit of the information collected by participants in the Urban Wildlife Information Network?", "cat": "Central ideas and details", "skill": "Central Ideas and Details", "dom": "Information and Ideas", "ans": "A", "choices": ["It informs city planning and conservation efforts.", "It inspires tourists to visit metropolitan areas.", "It identifies which animal species are becoming extinct.", "It ranks the popularity of green spaces with city residents."], "rev": {"formula": ["The correct answer is stated directly in the text."], "steps": ["The last sentence says the database \"informs city planning and conservation efforts that benefit both people and wildlife\"."], "tip": ["Match the answer to a specific phrase in the passage."], "trap": ["Choosing C or D, which sound plausible but are never mentioned."], "desmos": []}, "p": "Through the Urban Wildlife Information Network, citizen scientists systematically document animals they observe in metropolitan areas. Participants record not just which species they see but also the species’ behaviors and nearby urban features, such as artificial lighting, buildings, and green spaces. The resulting database helps researchers understand how animals adapt to human-dominated landscapes and informs city planning and conservation efforts that benefit both people and wildlife.", "n": 8, "id": "d06cec0b", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which statement about data set J72T12G24 is best supported by the text?", "cat": "Central ideas and details", "skill": "Central Ideas and Details", "dom": "Information and Ideas", "ans": "D", "choices": ["The data set consists primarily of real manufacturing data collected from industrial settings, supplemented with simulated scenarios to fill gaps in production patterns.", "The data set represents the most frequently encountered manufacturing scenarios, assigning more significance to the most commonly occurring combinations of demand patterns, capacity utilization, and cost balances.", "The data set was structured to primarily target unusual manufacturing conditions, including low production capacity utilization and fluctuating demand patterns.", "The data set was designed to ensure coverage of a range of hypothetical manufacturing situations in order to effectively teach the machine learning model."], "rev": {"formula": ["Choose the statement every part of which the text supports."], "steps": ["The text calls the instances \"simulated\" and says the set \"systematically varies\" three factors.", "So it was built to cover many hypothetical situations for training the model."], "tip": ["Reject answers that add claims about real data, frequency, or \"unusual\" conditions."], "trap": ["Choosing A because \"simulated\" is mentioned, but nothing says real data was used."], "desmos": []}, "p": "Researchers created data set J72T12G24 to train a machine learning model to select the best existing algorithm for determining manufacturers’ optimal production quantities while considering capacity constraints and other limiting factors. Comprising 7,200 simulated production planning instances, each involving seventy-two products across twelve time periods, the data set systematically varies three critical factors: product demand patterns (six scenarios, including fluctuating demand), production capacity utilization rates (high and low), and the balance between set-up and inventory holding costs (three scenarios).", "n": 9, "id": "2de430d7", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which quotation from [[i]]Poems[[/i]] most effectively illustrates the claim?", "cat": "Command of evidence: textual", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "B", "choices": ["“Our world, so worn and weary, / Needs music, pure and strong, / To hush the jangle and discords / Of sorrow, pain, and wrong.” (from “Songs for the People”)", "“Let me make the songs for the people, / Songs for the old and young; / Songs to stir like a battle-cry / Wherever they are sung.” (from “Songs for the People”)", "“Welcome children of the Spring, / In your garbs of green and gold, / Lifting up your sun-crowned heads / On the verdant plain and wold.” (from “Dandelions”)", "“Only a little scrap of blue / Preserved with loving care, / But earth has not a brilliant hue / To me more bright and fair.” (from “A Little Child Shall Lead Them”)"], "rev": {"formula": ["The quotation must match both parts of the claim: her own intention to create art and appeal across generations."], "steps": ["The claim: the speaker declares an intention to create art with universal appeal across generations.", "\"Let me make the songs ... for the old and young\" states the intention and names both generations."], "tip": ["Make sure the quotation contains the specific idea in the claim, not just a related theme."], "trap": ["Choosing A, which describes a need but not the speaker’s intention to create for all ages."], "desmos": []}, "p": "[[i]]Poems[[/i]] is an 1895 collection of poetry by Frances E.W. Harper. In one of Harper’s poems, the speaker declares her intention to create art that has a universal appeal across generations, saying, ____", "n": 10, "id": "3c2b2c73", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice best describes data from the graph that weaken the student’s claim?", "cat": "Command of evidence: quantitative", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "C", "choices": ["Although agricultural exports from Mexico decreased over the five years before NAFTA, a reversal in this trend was observed over the five years after Mexico joined NAFTA.", "All the countries shown had positive growth in agricultural exports over the five years after joining their respective FTAs, but their rates of export growth varied.", "Although agricultural exports from Morocco grew over the five years after Morocco joined MAFTA, their growth rate was even higher in the five years before MAFTA.", "Over the five years after Costa Rica joined CAFTA-DR, agricultural exports from Costa Rica grew at a rate of about 13.5 percent, which is higher than the rate over the five years before Costa Rica joined the agreement."], "rev": {"formula": ["To weaken \"joining an FTA increases the growth rate\", find a country whose rate fell after joining."], "steps": ["Costa Rica: 9.9 to 13.5 (rise). Mexico: −1.5 to 13.6 (rise). Morocco: 19.6 to 4.9 (fall).", "Only Morocco’s data contradict the claim."], "tip": ["Weaken means contradict: choices that show an increase support the claim."], "trap": ["Choosing D or A, which support the claim."], "desmos": []}, "p": "To measure whether countries in free trade agreements (FTAs)—agreements among nations to reduce tariffs, duties, and other trade barriers—experience changes in total agricultural exports, economist Kayode Ajewole and colleagues calculated average export growth rates for several countries over the five years before and the five years after entering an FTA with the United States. The graph shows the results for three countries in the study. Consulting the graph, a student claims that joining an FTA increases the rate of growth of a country’s total agricultural exports.", "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0AAAAHuCAIAAAA5iPuiAACDv0lEQVR42u3deUBM++M//tfUtGpftG+iTWmhKJFIi7JXdrKW5eKSfReufd8vLhVSSfYSZQkhoU1lixbt+77N74/X73O+855Cl7jh+fhr5jVnzpx5ndec8zyv8zpnWBwOhwAAAADAz4MPVQAAAACAAAcAAAAACHAAAAAAgAAHAAAAgAAHAAAAAAhwAAAAAIAABwAAAIAABwAAAAAIcAAAAACAAAcAAACAAAcAAAAACHAAAAAAgAAHAAAAgAAHAAAAAAhwAAAAAIAABwAAAIAABwAAAAAIcAAAAACAAAcAAACAAAcAAAAACHAAAAAAgAAHv5jS0lJUArQrjY2NFRUVqAdob0pKSvCNEODgf1y4cMHS0vLgwYM/V+6x/ITw8PA22YdZWlpGRUV9Zprhw4f37t37WxJYVlaWvLz8mjVrvmXdDRw48LtWtbW1d  B, which describes the late arrival but gives no reason tied to anticipation."], "desmos": []}, "p": "[[i]]The Age of Innocence[[/i]] is a 1920 novel by Edith Wharton set in New York City in the 1870s. In the novel, Newland Archer arrives late to an opera performance, which the narrator attributes to Newland’s enjoyment of anticipation: ____", "n": 12, "id": "5ad2cebf", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which statement, if true, would best illustrate the student’s claim in the underlined text?", "cat": "Command of evidence: textual", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "B", "choices": ["Jansson resigned from creating a daily Moomin comic strip in 1959 after working on it for seven years, and her brother Lars took her place.", "Jansson was an intensely private person but still responded personally to thousands of letters from fans writing about the Moomins.", "Jansson created her own magazine when she was thirteen years old and sold copies of it at her school.", "Jansson wrote [[i]]Moominsummer Madness[[/i]] and other Moomin stories but also published many memorable political cartoons."], "rev": {"formula": ["The claim has two parts: the role was unintended, and she committed to it anyway."], "steps": ["Committing to the role of Moomin creator means continuing to engage with it despite preferring privacy.", "B shows her personally answering thousands of fan letters about the Moomins."], "tip": ["Choose evidence that supports the claim about commitment, not just facts about Jansson’s life."], "trap": ["Choosing A, which shows her stepping away from the role."], "desmos": []}, "p": "The writer and illustrator of [[i]]Moominsummer Madness[[/i]] (1970) and many other Moomin stories for children didn’t initially set out to be known as a children’s author. While Tove Jansson accomplished a great deal as a painter and cartoonist, she became widely popular as the creator of the Moomin characters—Moomintroll, Gaffsie, and other eccentric figures—she is still best remembered for today. A student who is researching children’s literature asserts that [[u]]even though this outcome wasn’t what Jansson had intended, she committed to the role she found herself in.[[/u]]", "n": 13, "id": "49c36242", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "C", "choices": ["lowest among participants who were fans of Led Zeppelin.", "higher than those for songs without syncopation.", "lower than those for “Smells Like Teen Spirit.”", "highest among participants who were fans of Nirvana."], "rev": {"formula": ["\"Contrary to the hypothesis\" means the opposite of what was expected."], "steps": ["Expected: Kashmir ratings higher than Smells Like Teen Spirit.", "Contrary: Kashmir ratings were lower than those for Smells Like Teen Spirit."], "tip": ["Complete the sentence in your own words using only what the text states."], "trap": ["Choosing B, which restates the hypothesis rather than reversing it."], "desmos": []}, "p": "In a study of groove (defined as the degree to which participants wanted to move with the music), researchers expected that a song with a moderate-complexity rhythm, such as “Kashmir” by Led Zeppelin, would elicit higher groove ratings than would a song with a low-complexity rhythm, such as “Smells Like Teen Spirit” by Nirvana. This hypothesis was based on findings about a specific form of rhythmic complexity known as syncopation (when beats played in the rhythm deviate from the steady, underlying pulse of a song), which suggested that moderate syncopation was associated with the highest groove ratings. Contrary to the hypothesis, the groove ratings participants gave for “Kashmir” were generally ____", "n": 14, "id": "405d97d3", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "D", "choices": ["ignore the predator-prey relationships between large and small mammals.", "reflect factors affecting large mammals other than increasing human activity.", "exaggerate the effect of increasing human activity on small mammals.", "overestimate the actual population sizes of large mammals."], "rev": {"formula": ["Apply the stated pattern to the new case: a large forest, so large-mammal predictions are too high."], "steps": ["Large forest: large-mammal predictions are too high.", "So the model would overestimate large-mammal population sizes."], "tip": ["Complete the sentence in your own words using only what the text states."], "trap": ["Choosing C, which refers to small mammals; the forest is large."], "desmos": []}, "p": "Scientists recently created a model to predict how increasing human activity will affect future mammal population sizes in US national forests. Unfortunately, when the model is applied to large forests, its predictions for large-mammal populations are too high, and when applied to small forests, its predictions for small-mammal populations are too high. Beaverhead-Deerlodge National Forest in Montana is a large forest, covering more than 3 million acres. If used to evaluate the effect of increasing human activity on this forest in ten years, the model would likely therefore ____", "n": 15, "id": "6d5f3bc4", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb forms", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "C", "choices": ["shape", "shaped", "shaping", "shapes"], "rev": {"formula": ["A \"with + noun\" phrase needs a participle (\"-ing\") rather than a conjugated verb."], "steps": ["The main clause is \"Audiences are entertained ...\".", "\"with Hirao rhythmically shaping trees\" is a modifying phrase and takes the -ing form."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing \"shapes\": a second finite verb would create a run-on without a conjunction."], "desmos": []}, "p": "Japanese bonsai artist Masashi Hirao has crafted an approach that transforms the acts of pruning, wiring, and planting into dynamic public performances. Audiences are entertained as they watch his creative process unfold, with Hirao rhythmically ____ trees to music.", "n": 16, "id": "838255aa", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Plurals vs. possessives", "skill": "Possessives and Plurals", "dom": "Standard English Conventions", "ans": "B", "choices": ["street’s and neighborhoods", "streets and neighborhoods", "street’s and neighborhood’s", "streets and neighborhood’s"], "rev": {"formula": ["Nothing is owned here, so both nouns should be plural with no apostrophe."], "steps": ["\"numerous\" signals plural nouns.", "The streets and neighborhoods do not possess anything, so no apostrophes."], "tip": ["Ask whether the noun owns something; if not, use a plain plural."], "trap": ["Adding an apostrophe because the noun is followed by \"that\"."], "desmos": []}, "p": "The history of Los Angeles can be read in the numerous ____ that memorialize historical figures like Isaac Newton Van Nuys, Hedy Lamarr, and Laffit Pincay Jr. with place names like Van Nuys, Lamarr Avenue, and Pincay Drive.", "n": 17, "id": "7ed89566", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Punctuating a list", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "D", "choices": ["volume the shesep, a unit of length", "volume, the shesep; a unit of length,", "volume; the shesep; a unit of length;", "volume; the shesep, a unit of length;"], "rev": {"formula": ["In a list of items that already contain commas, separate the items with semicolons."], "steps": ["The list has three items: the khar, the shesep, and the sa.", "Each item contains a comma (an appositive), so items are separated by semicolons: \"volume; the shesep, a unit of length; and the sa\"."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Using commas as separators, which makes the appositives and list items impossible to tell apart."], "desmos": []}, "p": "Writing in hieroglyphs, ancient Egyptians recorded measurements using units such as the khar, a unit of ____ and the sa, a unit of area. The khar, for instance, is written as a circular hieroglyph with horizontal lines running across it.", "n": 18, "id": "5d73de3e", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Nonessential phrases", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "A", "choices": ["compounds,", "compounds—", "compounds", "compounds;"], "rev": {"formula": ["A phrase set off in the middle of a clause needs a comma on both sides."], "steps": ["The phrase \"because of its availability and recently discovered amino compounds\" interrupts \"that ... offered\".", "A comma opens it after \"that\", so a comma must close it after \"compounds\"."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing a dash or semicolon, which would not match the opening comma."], "desmos": []}, "p": "In 1856, nineteen-year-old chemist William Perkin attempted to synthesize artificial quinine from coal tar, an industrial waste product that, because of its availability and recently discovered amino ____ offered an economical alternative to expensive natural quinine extracted from tropical tree bark. Perkin’s failed experiments instead produced a brilliant purple solution that launched the synthetic dye industry.", "n": 19, "id": "358abbb5", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Punctuating a list", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "B", "choices": ["1959, Harbour developed by Antonio Linares in 1999; and Clojure", "1959; Harbour, developed by Antonio Linares in 1999; and Clojure,", "1959; Harbour; developed by Antonio Linares in 1999; and Clojure,", "1959; Harbour, developed by Antonio Linares in 1999, and Clojure,"], "rev": {"formula": ["A list whose items contain commas uses semicolons between items; the final item also needs a comma to close its descriptive phrase."], "steps": ["Items: COBOL (with a phrase), Harbour (with a phrase), and Clojure (with a phrase).", "Semicolons separate the items; commas set off each \"developed by ...\" phrase, including the one after \"Clojure\"."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing D, which mixes a comma and a semicolon as separators."], "desmos": []}, "p": "The programming languages COBOL, developed by Grace Hopper in ____ developed by Rich Hickey in 2007, are all routinely translated into executable code by tools known as compilers.", "n": 20, "id": "c148b32d", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Parallel participles", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "C", "choices": ["Ulysses. Stamping all 4,311 “-ing” verbs onto individual corks that", "Ulysses by stamping all 4,311 “-ing” verbs onto individual corks that", "Ulysses, stamping all 4,311 “-ing” verbs onto individual corks that", "Ulysses, stamping all 4,311 “-ing” verbs onto individual corks.That"], "rev": {"formula": ["A comma followed by an -ing phrase adds action to the main clause, and the next phrase (\"creating ...\") is parallel to it."], "steps": ["\"stamping ... corks that capped empty wine bottles and creating ... postcards\" are parallel actions.", "The comma after \"Ulysses\" attaches the first participial phrase to the main clause."], "tip": ["Identify the grammatical job of the blank, then test each choice in the sentence."], "trap": ["Choosing the period options, which leave a fragment."], "desmos": []}, "p": "For her 2010 installation “Dubling,” Brazilian artist Elida Tessler extracted every gerund from James Joyce’s novel ____ capped empty wine bottles and creating 4,311 postcards featuring images of Dublin’s River Liffey, she forged a visual connection between the flowing waters so central to Joyce’s narrative and the novel’s stream-of-consciousness style.", "n": 21, "id": "916cea2e", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "A", "choices": ["Afterward,", "For example,", "Instead,", "However,"], "rev": {"formula": ["The second sentence describes what happens after the vote."], "steps": ["Sequence: voting first, then taking office.", "\"Afterward\" signals the later event."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"However\", which signals contrast that is not present."], "desmos": []}, "p": "In ancient Rome, eligible citizens would gather in public squares to vote for their leaders on election day. ____ the winning candidates would take office and begin making important decisions for the city.", "n": 22, "id": "cb9dae69", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "C", "choices": ["In summary,", "Instead of that,", "As this occurs,", "As one example,"], "rev": {"formula": ["The sinking of cooler air happens at the same time as the warm air rising."], "steps": ["Two simultaneous events form the convection current.", "\"As this occurs\" links them in time."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"Instead of that\", which suggests a replacement rather than a simultaneous process."], "desmos": []}, "p": "When air near Earth’s surface is heated, it becomes less dense and rises upward. ____ cooler, denser air sinks downward, creating a circular movement of air called a convection current.", "n": 23, "id": "47b009a5", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "D", "choices": ["On the contrary, a pollutant such as chromium can be removed from the soil;", "Moreover, the plant is potentially useful in removing accumulated metals;", "For this reason, the plant has useful applications in soil quality restoration;", "That said, the plant may not always be able to remove all of the pollutant;"], "rev": {"formula": ["The first part praises the plant; the second part names a limitation, so the transition must be concessive."], "steps": ["Positive: the plant absorbs lots of chromium.", "Limitation: roots might not reach deep enough and could leave traces.", "\"That said, the plant may not always be able to remove all of the pollutant;\" introduces the limitation and leads into the clause after the semicolon."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing B or C, which continue the positive point instead of introducing the limitation."], "desmos": []}, "p": "Plant species known as metal hyperaccumulators can help remove heavy metal pollutants from soil. [[i]]Cyperus rotundus[[/i]], or purple nutsedge, for instance, can absorb a large quantity of chromium and store it safely in its roots and shoots. ____ its roots may not reach far enough into the soil and could leave trace amounts of chromium.", "n": 24, "id": "e3f7b42e", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "C", "choices": ["By contrast,", "Similarly,", "Consequently,", "Nevertheless,"], "rev": {"formula": ["The new opportunity is a result of the law change."], "steps": ["Cause: the voting age was lowered.", "Effect: young people gained an opportunity to participate.", "\"Consequently\" marks the result."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"Nevertheless\" or \"By contrast\", which signal contrast."], "desmos": []}, "p": "On November 20, 2013, Malta’s government lowered the minimum voting age for its citizens from 18 to 16 years old. ____ many young people in Malta gained a new opportunity to participate in their country’s political process.", "n": 25, "id": "cf7d0a56", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "A", "choices": ["In reality,", "As a result,", "In other words,", "Similarly,"], "rev": {"formula": ["The first part says it seems imagined; the second says it was real."], "steps": ["\"It’s tempting to think ... only in imagination\" sets up a contrast with the truth.", "\"In reality\" introduces that truth."], "tip": ["Decide how the two ideas relate (contrast, cause, example, sequence) before choosing."], "trap": ["Choosing \"In other words\", which would restate rather than correct the first sentence."], "desmos": []}, "p": "It’s tempting to think that the chaotic scene depicted in Joseph Heintz the Younger’s painting [[i]]Competition on the Ponte dei Pugni in Venice[[/i]] (1673) could only have existed in the artist’s imagination: a bridge is covered with dozens of brawling men, some tumbling into the canal below, and throngs of excited spectators crowd the sidewalks, gondolas, and windows of surrounding buildings. ____ such dramatic competitions between rival neighborhood factions were regular occurrences in seventeenth-century Venice.", "n": 26, "id": "13310add", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "The student wants to present a finding from the study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "D", "choices": ["Participants were asked to identify the correct version of Pikachu, who is a creature with markings at the base of its tail.", "In a 2021 study, researchers asked participants to identify the correct version of Pikachu.", "Pikachu is a creature with markings at the base of its tail, but in one of the altered versions, the creature had markings at the tip of its tail.", "When participants were asked to identify the correct version of Pikachu, 26.8% selected the unaltered image."], "rev": {"formula": ["A \"finding\" is a result of the study, so the answer must report the outcome."], "steps": ["Only D states a result: 26.8% of participants chose the unaltered image.", "The others describe the setup or the character."], "tip": ["Choose the option that matches the goal in the prompt (a finding), not just any relevant detail."], "trap": ["Choosing B, which describes the method but reports no finding."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• In a 2021 study, researchers showed participants an unaltered image of a popular character or logo alongside two slightly altered versions.\n• Pikachu is a creature with markings at the base of its tail.\n• In the first alteration, the creature had markings at the tip of its tail.\n• In the second alteration, the creature’s tail had no markings.\n• Participants were asked to identify the correct version.\n• 26.8% of participants selected the unaltered image.", "n": 27, "id": "c89fecf3", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["sanitized", "estimated", "populated", "precluded"], "rev": {"formula": ["Microbes were added to sterilized soil, so the soil was filled with them."], "steps": ["The soil was sterile, then received live microbes.", "\"Populated\" means filled with living things."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"sanitized\": the soil was already sterile."], "desmos": []}, "p": "Lady Grant and colleagues ____ pots of sterilized soil with slurries of live microbes collected from soil in five sites across Colorado, including areas of sagebrush and ponderosa pine forest. Grant and team then grew mustard plants in the pots to see if the different microbial slurries affected levels of spicy glucosinolates like indole in the plants’ seeds.", "n": 28, "id": "73c00b9b", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "B", "choices": ["fraudulent", "byzantine", "rudimentary", "monotonous"], "rev": {"formula": ["Many modifications by different people produce a network that is complicated and hard to trace."], "steps": ["\"Playing detective\" and \"little effort to maintain overall organization\" show confusing wiring.", "\"Byzantine\" means extremely complicated."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"rudimentary\", which means simple, the opposite of the intended meaning."], "desmos": []}, "p": "Electricians confronting century-old wiring often find themselves playing detective, tracing circuits that were modified numerous times by different hands, each addressing—with varying levels of sophistication—immediate needs with little effort to maintain overall organization. What appears to be a simple fixture replacement can reveal a network that is truly ____.", "n": 29, "id": "e9dfee1e", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "B", "choices": ["shallowness", "rigor", "novelty", "obscurity"], "rev": {"formula": ["The dash explains the blank: consulting numerous sources to ensure accuracy shows thoroughness."], "steps": ["The clue after the dash describes careful research.", "\"Rigor\" means thoroughness and accuracy."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"obscurity\" or \"shallowness\", which contradict the clue."], "desmos": []}, "p": "The dinosaur displays at museums such as the American Museum of Natural History in New York (which has a mounted [[i]]Allosaurus fragilis[[/i]] skeleton among its holdings) are notable for the ____ of the research behind them—the museum staff consulted numerous sources to ensure the accuracy of the displays.", "n": 30, "id": "151baff9", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["pragmatic", "ambivalent", "enigmatic", "impulsive"], "rev": {"formula": ["Risky voyages to poor islands make the settlers’ reasons hard to understand today."], "steps": ["\"Thus, from our modern perspective\" signals that the motives are puzzling.", "\"Enigmatic\" means mysterious."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"pragmatic\": settling a resource-poor island by a hazardous voyage seems the opposite of practical."], "desmos": []}, "p": "While some of the Mediterranean islands inhabited by prehistoric peoples were rich in resources and easily accessible from the mainland, others were resource-poor and could only be reached by grueling, hazardous, multiday voyages in rowboats. The motivations of the people who settled the latter are thus, from our modern perspective, ____.", "n": 31, "id": "81ddb977", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "A", "choices": ["Regret", "Expect", "Repudiate", "Enumerate"], "rev": {"formula": ["\"Lament the passing of the great days\" means to express sorrow about a loss."], "steps": ["She looks back on the great days of the past with sadness.", "\"Regret\" is the closest meaning to \"lament\"."], "tip": ["Predict the word from the context clues before reading the choices."], "trap": ["Choosing \"Expect\", which does not fit talking about the past."], "desmos": []}, "p": "The following text is adapted from Virginia Woolf’s 1919 novel [[i]]Night and Day[[/i]].\n\nIn times gone by, Mrs. Hilbery had known all the poets, all the novelists. These being now either dead or secluded in their infirm glory, she made her house a meeting-place for her own relations, to whom she would lament the passing of the great days of the nineteenth century, when every department of letters and art was represented in England by two or three illustrious names.", "n": 32, "id": "74caa4e0", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice best states the main purpose of the text?", "cat": "Text structure and purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "C", "choices": ["To compare two experiments addressing the same questions", "To describe difficulties associated with preserving seeds", "To discuss an ongoing experiment", "To explain how to get rid of certain plants"], "rev": {"formula": ["The main purpose is to describe what the passage mainly does overall."], "steps": ["The text describes Beal’s 1879 experiment and its continuing periodic checks.", "So the purpose is to discuss an ongoing experiment."], "tip": ["Do not pick a choice that adds a comparison or a goal that is not in the text."], "trap": ["Choosing A because the text mentions retrievals at different times; only one experiment is discussed."], "desmos": []}, "p": "In 1879, in an effort to determine the longevity of certain seeds left in soil, botanist William Beal buried 20 glass bottles filled with sand and seeds from a variety of plants, including [[i]]Verbascum[[/i]], [[i]]Lepidium virginicum[[/i]], and [[i]]Oenothera biennis[[/i]].\n\nSince then, some of the bottles have been retrieved in the periodic checks of seed viability researchers are conducting. After 60 years had elapsed, most of the seeds in those bottles stopped germinating, but [[i]]Verbascum[[/i]] seeds have remained viable, including those from a bottle dug up in 2021 by Margaret Fleming, David Lowry, and colleagues.", "n": 33, "id": "ad854dac", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice best states a shared purpose of Text 1 and Text 2?", "cat": "Cross-text connections", "skill": "Cross-Text Connections", "dom": "Craft and Structure", "ans": "A", "choices": ["To suggest that the distinctive aesthetics of certain traditional needlework techniques both reflect and transcend these techniques’ functional origins", "To trace how two decorative forms of sewing influenced the development of certain utilitarian mending techniques that prioritize strength", "To evaluate the increasingly prevalent practice of incorporating visible mending techniques into the design of new clothing and textiles", "To highlight the complexity of the patterns that can emerge through the repetition of simple stitches in traditional needlework techniques"], "rev": {"formula": ["Find what both texts do: each links a practical mending technique with its visual appeal."], "steps": ["Text 1: sashiko repairs contribute to both strength and beauty.", "Text 2: kantha began as a practical technique but is valued for its visual appeal.", "Both suggest the aesthetics both reflect and go beyond the functional origin."], "tip": ["The correct choice must be true of both texts, not only one."], "trap": ["Choosing D, which fits Text 1 (patterns) but not Text 2."], "desmos": []}, "p": "[[b]]Text 1[[/b]]\nAlong with techniques such as darning and patching, the time-honored Japanese craft of [[i]]sashiko[[/i]] emphasizes rather than obscures repairs and has become a popular form of visible mending (which conserves natural resources used in clothing production by extending the life cycle of textiles).\n\nIn [[i]]seigaiha[[/i]] (wave) and other traditional patterns, repeated stitches of thick thread form striking geometric motifs that contribute to both the strength and the beauty of everyday textiles.\n\n[[b]]Text 2[[/b]]\nGenerally less ornate than [[i]]phulkari[[/i]] embroidery and other forms of decorative South Asian needlework, [[i]]kantha[[/i]] originated in northeastern India as a practical technique in which straight, parallel lines of visible stitching join layers of cloth, covering holes and renewing fragile or worn material. Some contemporary Indian designers value [[i]]kantha[[/i]] for its visual appeal, adapting this technique to adorn high-end garments.", "n": 34, "id": "add1a7f1", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Based on the text, what can be concluded about clothing made during the Ice Age?", "cat": "Inferences", "skill": "Inferences", "dom": "Information and Ideas", "ans": "A", "choices": ["Clothing made with awls at sites like Mladec likely had coarser seams than clothing made with needles at sites like Ust-Kova did.", "Clothing made with awls at sites like Mladec could likely be made more quickly than clothing made with needles at sites like Ust-Kova.", "Clothing made at sites like Mladec was likely made with needles, while clothing made at sites like Ust-Kova was likely made with awls.", "Clothing made with awls at sites like Mladec likely had finer seams than clothing made with needles at sites like Ust-Kova did."], "rev": {"formula": ["Use the text’s comparison: needles sped up the work and allowed smaller holes and finer seams."], "steps": ["Needles allowed smaller holes and thus finer seams.", "So awl-made clothing (the earlier method) likely had coarser seams."], "tip": ["Watch for reversed comparisons."], "trap": ["Choosing D, which flips the comparison, or B, which contradicts \"sped up\"."], "desmos": []}, "p": "Ian Gilligan et al. claim that during the Ice Age, humans at Mladec in Europe made fitted clothing by boring holes in pieces of hide and fur with a sharpened bone tool called an awl and then threading cord through the holes to bind the pieces together. Eventually, as evidenced by artifacts at Ust-Kova in Siberia, someone perforated the end of a bone awl to make an eye (hole) to hold the cord, thereby creating a sewing needle with which both steps could be performed in a single motion. This sped up the process of making clothing and, by freeing them from the need to push cord through holes manually, allowed artisans to make smaller holes and thus finer seams.", "n": 35, "id": "66b039d8", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Based on the text, Ang would most likely agree with which statement about initiatives such as the implementation of restrictions on personal gain by public officeholders?", "cat": "Inferences", "skill": "Inferences", "dom": "Information and Ideas", "ans": "B", "choices": ["They should not be regarded as having independent causes but rather as being the shared result of capitalist growth.", "They cannot be explained simply as either a precondition of capitalist growth or a consequence of capitalist growth.", "They show more variation across polities in their relationship to economic development than some theories suggest.", "They are overemphasized by both developmental-state theory and modernization theory."], "rev": {"formula": ["Ang says both theories assume one-way causality and that neither phenomenon is independent of the other."], "steps": ["Developmental-state theory: restrictions enable growth.", "Modernization theory: growth produces bureaucracies.", "Ang: both assume linear causality, but neither is independent of the other, so neither simple explanation works."], "tip": ["Do not attribute claims (shared cause, variation, overemphasis) that Ang does not make."], "trap": ["Choosing A, which replaces the interdependence with a new common cause."], "desmos": []}, "p": "Pointing to the rapid economic development of Japan and other polities under market capitalism, advocates of developmental-state theory hold that legal constraints on personal enrichment by public officeholders and other bureaucratic initiatives enable growth.\n\nCiting cases as distinct as the United States and Mauritius, proponents of modernization theory hold the inverse, that so-called Weberian bureaucracies emanate from capitalist growth. Yuen Yuen Ang has recently argued that both positions presume linear causality in situations in which neither phenomenon is truly independent of the other.", "n": 36, "id": "a1624685", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Taken together, the text and graph best support which conclusion about 2-methyl-1,3-butadiene?", "cat": "Command of evidence: quantitative", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "B", "choices": ["Although the compound’s emission deters most hornworms, a small percentage of hornworms appear insensitive to the compound and will consume leaves that emit it.", "Although the compound’s emission does not entirely prevent leaf consumption by hornworms, its emission is associated with reduced leaf consumption.", "Although leaves emit the compound in response to insect feeding, it does not appear to significantly reduce leaf consumption by hornworms.", "Although the compound is toxic to hornworms, the insects will consume leaves that emit it even when leaves that don’t emit it are available."], "rev": {"formula": ["Compare emitting versus nonemitting bars in every trial."], "steps": ["In all three trials, hornworms consumed less of the emitting leaves than the nonemitting leaves.", "But they still consumed some, so the compound reduces but does not prevent consumption."], "tip": ["Choosing A, C or D, which add claims (insensitive hornworms, toxicity, response to feeding) not supported by the data."], "trap": ["Choosing C, which says there is no significant reduction although the graph shows one in each trial."], "desmos": []}, "p": "Some plants’ leaves emit a chemical compound (2-methyl-1,3-butadiene) that is thought to be a defense against insects. Researchers modified leaves of the same plant species so that some emitted the compound and others didn’t, then placed hornworms—leaf-eating insects—between leaves of both types and allowed the hornworms to feed for 90 minutes.", "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAyYAAAG6CAIAAABybsV0AABr1klEQVR42u3dZ1gUSbg24JpAzjkIShAJCoggoqiACUEwY8Kwiopr3jWtawIVc845iwqKORBEVwVBAUUMoKhIkCDCkMMA8/2oc/qbM6CijLsqz/2Da6jp6VBV3f12VXU3SyAQEAAAAAD4ntjIAgAAAACEXAAAAAAIuQAAAAAAIRcAAAAAQi4AAAAAhFwAAAAAgJALAAAAACEXAAAAACDkAgAAAEDIBQAAAICQCwAAAAAQcgEAAAAg5AIAAABAyAUAAAAACLkAAAAAEHIBAAAAAEIuAAAAAIRcAAAAAAi5AAAAAAAhFwAAAABCLgAAAACEXAAAAAAgFlxkwc+urq7u1atXwimqqqoaGhrNJwdycnI2bNjw+PFjaWnpiRMnDhw4UPjbjIyM8vJyNpttYmLynVagqKho48aNMTExHA5n6N 8efPPmTXV19RYtWmRkZBQUFIwaNerEiRPifTYYAEIuAPiCe/fu0bFc2traTk5OeIw7/GIEAsGdO3fu3Lnz8eNHHR0dFxcXPMYdEHIBAAAANF/oXwAAAABAyAUAAACAkAsAAAAAEHIBAAAAIOQCAAAAQMgFAAAAAAi5AAAAABByAQAAAABCLgAAAACEXAAAAAAIuQAAAAAAIRcAAAAAQi4AAAAAhFwAAAAAgJALAAAAACEXAAAAACDkAgAAAEDIBQAAAICQCwAAAAAQcgEAAAAg5AIAAABAyAUAAAAACLkAAAAAEHIBAAAAAEIuAAAAAIRcAAAAAAi5AAAAAAAhFwAAAABCLgAAAACEXAAAAACAkAsAAAAAIRcAAAAA/K//BybyJAh1/EwkAAAAAElFTkSuQmCC", "tag": "Graph redrawn from the screenshot (bar heights approximate)", "n": 37, "id": "026ed456", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which finding, if true, would most directly support the researcher’s claim?", "cat": "Supporting a claim", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "C", "choices": ["Current users of the SPRINTER are satisfied with the number of stops along the line.", "Residents of Oceanside, California, are much less likely to use public transit on rainy days than on clear days.", "The enforcement of posted speed limits in the neighborhood that the light rail stop will service has increased substantially in the last ten years.", "There has been a sharp increase in the last ten years in cyclists who use the roads in the neighborhood that the light rail stop will service."], "rev": {"formula": ["The claim is that a ten-year-old survey no longer reflects residents’ feelings; evidence must show something relevant changed in ten years."], "steps": ["Well-enforced low speed limits influence willingness to walk to transit.", "If enforcement has increased substantially in ten years, residents’ willingness has probably changed."], "tip": ["The finding must be about a change over time AND about a factor named in the text."], "trap": ["Choosing B, which concerns weather but not change over the last ten years."], "desmos": []}, "p": "A team of public transportation experts in Oceanside, California, is creating a new light rail stop for the SPRINTER system that will service a neighborhood in which a stop does not currently exist. To decide where to place the stop, the team is using a survey from ten years ago that asked how far neighborhood residents would be willing to walk to a light rail stop. The team also looked at studies showing that people’s willingness to walk to public transit is influenced by factors like weather and the presence of well-enforced low speed limits for cars. A researcher has argued that the survey does not accurately reflect the feelings of today’s residents of this neighborhood.", "n": 38, "id": "b9deed7e", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most effectively uses data from the table to complete the assertion?", "cat": "Command of evidence: quantitative", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "B", "choices": ["the average male wing centroid size was 1.98 mm in May but was 2.31 mm in June.", "the average female wing centroid size was smaller in May than in July.", "the average male wing centroid size was consistently smaller than the average female wing centroid size in all four months in the table.", "the average monthly low temperature was lower in May than in June."], "rev": {"formula": ["The claim links cooler months to lower fitness (smaller wings), so compare a cooler month with a warmer month using wing size."], "steps": ["May (high 73, low 50) is cooler than July (high 87, low 62).", "Female wing size: May 2.27 mm, July 2.31 mm, so smaller in May."], "tip": ["Make sure the choice connects temperature to wing size and reports the table accurately."], "trap": ["Choosing A (2.31 mm is a female value, not male) or D (temperature only, no wing size)."], "desmos": []}, "p": "Drosophila (fruit flies) have generation times of 10–12 days, so seasonal changes in humidity and other environmental conditions can drive seasonal fluctuations in chromosome rearrangements in species such as [[i]]D. robusta[[/i]] and [[i]]D. subobscura[[/i]]. Drosophila body size (for which wing c
