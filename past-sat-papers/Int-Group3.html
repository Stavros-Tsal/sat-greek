agues' 1999 study of wild chimpanzees did not. According to a meta-analysis of studies of nonhuman primates, captive populations are more likely to be described as right-handed than wild populations are. Statistical analysis indicates a handedness study would need a minimum of 176 individuals to show a representative result; however, the study by Ferster included a total population of 1, and the study by McGrew and colleagues included a total population of 13. This suggests that ____", "n": 38, "id": "62d0e687", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "B", "choices": ["the brain regions associated with sensory-motor functions are often involved in general comprehension, even in contexts that don't involve descriptions of physical movement.", "the specific combination of brain regions involved in comprehending speech is likely contingent on the total context in which the speech is embedded.", "the areas of the brain that activate when processing speech will typically include areas primarily responsible for nonlinguistic functions, although the exact combination of areas may be impossible to determine.", "the brain regions most strongly associated with affective processing activate whenever a listener believes an utterance has emotional connotations, even if the speaker did not intend those connotations."], "rev": {"formula": ["The examples show that what the language describes (physical action, emotion) changes which regions activate."], "steps": ["Physical actions engage sensory-motor areas; emotional accounts engage affective areas.", "So the combination of regions depends on the context."], "tip": ["Stay within the evidence: do not generalize beyond the examples."], "trap": ["Choosing A or D, which add claims (always, whenever) that the text does not support."], "desmos": []}, "p": "While the brain regions most strongly associated with language tasks have some modularity in that different language tasks activate these areas to varying degrees, comprehension also invokes other areas of the brain more strongly associated with nonlinguistic functions. For example, understanding a description of a person performing physical actions might call on parts of the listener's brain associated with sensory-motor functions, whereas a highly emotive account will likely activate areas associated with affective processing. Thus, beyond the areas most strongly associated with linguistic functions, ____", "n": 39, "id": "ae1930ca", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "C", "choices": ["as a tree species in temperate forests becomes more abundant, individuals of that species are more likely to be found near conspecifics, enabling abundant species to exploit localized resources to a greater extent than rare species can.", "while an increase in abundance in one tree species often leads to a reduction in abundance of nearby species, temperate tree species tend to play different roles in the same ecosystem, reducing the expected effect of abundance on aggregation.", "although rare tree species in temperate forests encounter relatively high local competition from conspecifics, they can thrive by exploiting resources that are underexploited by other local species.", "even though rare tree species in temperate forests tend to cluster with conspecifics more than rare tree species in tropical forests do, they are sufficiently rare locally that they benefit from RSA more than rare tropical species do."], "rev": {"formula": ["\"Niche distinction\" means species use different resources. The risk is high competition among clustered rare species."], "steps": ["In temperate forests, rare species face competition from conspecifics (no RSA).", "Niche distinction lets them use resources others leave unused, so they can still survive."], "tip": ["Connect the completion to the exact term the sentence introduces (niche distinction)."], "trap": ["Choosing D, which claims temperate rare species benefit from RSA, contradicting the passage."], "desmos": []}, "p": "Rare species advantage (RSA) describes the situation in which there are few conspecifics (other members of the same species) in an organism's immediate surroundings, enabling the organism to avoid competition with conspecifics for the same resources; RSA is widely believed to play a crucial role in maintaining ecological stability. Among tree species in the Xishuangbanna rainforest plot (latitude 21.61° N) and other tropical forest sites, there is little correlation between conspecific aggregation and the abundance of a given species in the wider local area, so RSA is expected, but in the Harvard Forest (latitude 42.54° N) and other temperate forest sites, the aggregation-abundance correlation for tree species is strongly negative. Mathematical modeling suggests, however, that niche distinction may mitigate the apparent risk to temperate ecological stability engendered by this pattern: ____", "n": 40, "id": "03ad8d21", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Punctuation", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "C", "choices": ["age and built", "age, built", "age: built", "age built"], "rev": {"formula": ["A colon after a complete clause introduces an explanation."], "steps": ["\"Extensive radiocarbon dating ... confirmed ... hypothesis about the Peruvian site's age\" is a complete clause.", "The colon introduces what that age is: \"built nearly 5,000 years ago, the ancient city preceded ...\""], "tip": ["Check what comes before the colon: it must be a complete clause."], "trap": ["Using a comma, which cannot join these ideas."], "desmos": []}, "p": "Extensive radiocarbon dating of reed samples from Caral confirmed Ruth Shady Solís's hypothesis about the Peruvian site's ____ nearly 5,000 years ago, the ancient city preceded the Olmec civilization to the north by a full millennium, a revelation that fundamentally altered our understanding of urban development in the Western Hemisphere.", "n": 41, "id": "6301c4dc", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Subject-verb agreement", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "D", "choices": ["is", "has been", "was", "were"], "rev": {"formula": ["The subject is \"Commercial applications\" (plural), not the nearby singular nouns."], "steps": ["The dashes mark an interruption: \"beginning with the purple dye called mauve ...\".", "Plural subject + past context = \"were\"."], "tip": ["Cross out the interrupting phrase to find the subject."], "trap": ["Choosing \"was\" by agreeing with \"1856\" or \"mauve\"."], "desmos": []}, "p": "Chemists investigating the properties of coal tar in the mid-nineteenth century discovered compounds that led to the creation of vibrant artificial colorants. Commercial applications of this new synthetic dye technology—beginning with the purple dye called mauve, discovered by William Perkin in 1856—____ responsible for launching what one science historian calls a \"manufacturing revolution based on chemistry.\"", "n": 42, "id": "bd2c2426", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb form", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "B", "choices": ["dictates", "dictating", "dictated", "was dictating"], "rev": {"formula": ["\"rejects\" is already the main verb, so the blank must be a modifier."], "steps": ["\"Popper's theory dictating that scientific hypotheses must be refutable ... rejects the confirmationist position.\"", "The participle \"dictating\" modifies \"theory\"."], "tip": ["Never add a second finite verb to a sentence with a main verb."], "trap": ["Choosing \"dictates\", which creates a run-on structure."], "desmos": []}, "p": "The statement \"all cats have whiskers\" is scientific because it could be proved false by a single observation to the contrary, according to Karl Popper. Popper's theory ____ that scientific hypotheses must be refutable, termed the criterion of falsifiability, rejects the confirmationist position that uses verifiability as the standard for scientific hypotheses.", "n": 43, "id": "500ded28", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb form", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "A", "choices": ["seeking", "had sought", "sought", "were seeking"], "rev": {"formula": ["The main verb is \"analyzed\"; the blank must modify \"archaeologists\"."], "steps": ["\"Archaeologists seeking an explanation ... analyzed several sites.\"", "A participle phrase is the only choice that avoids a second main verb."], "tip": ["Find the main verb and make sure the blank does not add another."], "trap": ["Choosing \"sought\" because it matches the past tense."], "desmos": []}, "p": "During a recent investigation, archaeologists ____ an explanation for the consistent and seemingly deliberate placement of petroglyphs (rock carvings) near water analyzed several sites on Caribbean islands. They discovered that many of the pools near petroglyphs had consistent water levels year-round, creating perfect reflecting surfaces for the carved symbols on the rocks.", "n": 44, "id": "d4ba69e8", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Dashes and commas", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "C", "choices": ["Robin,\" a technique that", "Robin.\" A technique that", "Robin\"—a technique that,", "Robin\"; a technique that,"], "rev": {"formula": ["The dash introduces an appositive, and the interrupting phrase \"by inserting ...\" needs commas on both sides."], "steps": ["\"... 'Rockin' Robin'—a technique that, by inserting the grunge singer's vocal lines ..., creates ...\"", "Only C opens the dash and adds the comma after \"that\" to match the comma after \"framework\"."], "tip": ["Balance every interruption: opening mark and closing mark."], "trap": ["Choosing B, which creates a sentence fragment."], "desmos": []}, "p": "For his mash-up \"Smells Like Rockin' Robin,\" DJ Mark Vidler layered Kurt Cobain's minor-key vocals from \"Smells Like Teen Spirit\" over the Jackson 5's major-key blues progression from \"Rockin' ____ by inserting the grunge singer's vocal lines as pitch-shifted \"blue notes\" within the pop-soul group's harmonic framework, creates an intensified \"bluesy\" feeling and subverts the expectations of listeners familiar with either musical source.", "n": 45, "id": "77566589", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Boundaries", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "A", "choices": ["star). Occurring", "star), occurring", "star) and occurring", "star) occurring"], "rev": {"formula": ["The sentence after the parenthesis must be complete: \"Occurring in the constellation Lynx ..., the transient yet powerful blast propelled particles ...\""], "steps": ["\"Occurring ...\" is an introductory participle phrase describing \"the blast\".", "The period ends the first sentence (\"SN 2008D was a supernova ...\")."], "tip": ["Check that each choice gives two complete sentences, or one properly joined."], "trap": ["Choosing B or D, which join two complete clauses with only a comma or nothing."], "desmos": []}, "p": "Named for the year in which it was detected by American astronomers, SN 2008D was a supernova (the explosion of a massive ____ in the constellation Lynx, 88 million light-years from Earth, the transient yet powerful blast propelled particles and debris into space at extremely high speeds.", "n": 46, "id": "e96e3586", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "A", "choices": ["Thus,", "Furthermore,", "Instead,", "Similarly,"], "rev": {"formula": ["The classification system is applied to the saung-gauk: because it makes sound with strings, it is a chordophone."], "steps": ["The saung-gauk produces sound through string vibration.", "\"Thus,\" shows the conclusion under the classification system."], "tip": ["Cause and effect: description of how it works leads to the classification."], "trap": ["Choosing \"Instead,\" when there is no contrast."], "desmos": []}, "p": "The Hornbostel-Sachs system classifies musical instruments by how they produce sound. For example, an instrument that is popular in Myanmar called the saung-gauk produces sound primarily through the vibration of its strings. ____ under the Hornbostel-Sachs system, the saung-gauk is a chordophone.", "n": 47, "id": "42c97a2c", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "B", "choices": ["however,", "for example,", "meanwhile,", "additionally,"], "rev": {"formula": ["The sentence gives a specific case of the general statement about sleek vehicles."], "steps": ["General claim: sleek vehicles are more aerodynamic.", "The Northrop F-5 jet is a specific example."], "tip": ["General statement followed by a specific case = \"for example\"."], "trap": ["Choosing \"however,\" because of the \"while\" contrast later in the sentence."], "desmos": []}, "p": "Generally, sleek vehicles are more aerodynamic than bulkier ones. The streamlined nose of the Northrop F-5 jet, ____ helps it glide through wind with relative ease, while a boxy semitruck encounters more wind resistance, making it less aerodynamic.", "n": 48, "id": "993a32c2", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "B", "choices": ["In fact,", "Similarly,", "Regardless,", "First of all,"], "rev": {"formula": ["The next artwork is another one of the same kind: a postcard in a series of date-recording works."], "steps": ["Both works record a date in simple form.", "\"Similarly,\" links two parallel examples."], "tip": ["Look for parallel examples with the same structure."], "trap": ["Choosing \"In fact,\" because it suggests an intensification."], "desmos": []}, "p": "Japanese conceptual artist On Kawara focused his artistic career on recording the passage of time in simple ways. For example, [[i]]MAY 22, 1979[[/i]] is one of over three thousand paintings by Kawara on which he recorded the date in bold white strokes on a monochrome background. ____ [[i]]I Got Up at 8.18 A.M., Jun 22 1977[[/i]] is one of a series of postcards—this one of New York City's Greenwich Village—that Kawara titled after the postcard's message, which informed a friend of when Kawara got up that day.", "n": 49, "id": "0b62f27b", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "B", "choices": ["In addition,", "Indeed,", "Therefore,", "Nevertheless,"], "rev": {"formula": ["The last sentence emphasizes how many of the sports parades were for Olympians."], "steps": ["\"A number were for achievements in sports.\"", "The 1928 parade was just one of 7 for Olympic athletes: it strengthens the point. \"Indeed\" fits."], "tip": ["\"Indeed\" introduces a stronger or more specific confirmation."], "trap": ["Choosing \"Therefore,\" because the second sentence is not a result of the first."], "desmos": []}, "p": "On August 22, 1928, US Olympians received a ticker-tape parade in New York City in recognition of their participation in the 1928 Olympic Games. Of the 206 ticker-tape parades held between 1886 and 2022, a number were for achievements in sports. ____ the 1928 Olympians' parade was just one of 7 honoring Olympic athletes.", "n": 50, "id": "517907a4", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "The student wants to contrast the subject matter of the two prints. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "D", "choices": ["The scenes depicted in both works were first carved onto a printing block, then stamped onto paper; however, one work is a linocut, while the other is a relief print.", "The print by Cortéz is a color linocut; by contrast, Andrews's is a relief print.", "Andrews made [[i]]Hyde Park[[/i]] in 1931, while Cortéz made [[i]]¡Será toda nuestra![[/i]] (\"It will all be ours!\") later, in 1977.", "[[i]]¡Será toda nuestra![[/i]] features a scene with an explicitly political point of view, while [[i]]Hyde Park[[/i]] depicts a tranquil, everyday scene."], "rev": {"formula": ["Subject matter = what the prints depict."], "steps": ["Hyde Park depicts a tranquil park scene; ¡Será toda nuestra! depicts laborers preparing to strike.", "Choice D contrasts the two subjects."], "tip": ["Match the goal word exactly: subject matter, not technique or date."], "trap": ["Choosing A or B, which contrast printing techniques."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• [[i]]Hyde Park[[/i]] is a 1931 color linocut print by Canadian artist Sybil Andrews.\n• It depicts a tranquil, everyday scene (a spring day in a city park).\n• [[i]]¡Será toda nuestra![[/i]] (\"It will all be ours!\") is a 1977 color linocut print by Mexican American artist Carlos Cortéz.\n• It features a scene with an explicitly political point of view (a group of laborers preparing to go on strike).\n• Relief printing is a technique in which an image is carved onto a printing block, covered in ink or paint, and stamped onto paper.\n• Lino cutting is a type of relief printing that uses linoleum tile as the printing block.", "tag": "Choice D partly hidden by an overlay in the screenshot (text reconstructed)", "n": 51, "id": "45ff13ff", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "The student wants to explain why ERW is a superior method for capturing CO₂. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "B", "choices": ["ERW improves soil health and helps farmers increase their income from selling carbon credits.", "ERW removes CO₂ from the air in a way that is both low-cost and low-tech.", "ERW is a method of spreading crushed basalt on farmland to capture CO₂, improving rural economies.", "The CO₂ captured by ERW becomes stable bicarbonate, which eventually streams into the ocean to remain safely stored for hundreds of years."], "rev": {"formula": ["\"Superior\" means better than other methods, so use the comparison with expensive, energy-intensive methods."], "steps": ["The notes say ERW is a low-cost, low-tech alternative to expensive, energy-intensive carbon capture.", "B states exactly the advantages over other capture methods."], "tip": ["The goal is about capturing CO₂, not about farming or rural economies."], "trap": ["Choosing A or C, which discuss side benefits for farmers."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Enhanced rock weathering (ERW) is a method of spreading crushed basalt on farmland to capture carbon dioxide (CO₂) and improve soil health.\n• ERW increases crop yields and removes harmful CO₂ from the air.\n• ERW offers a low-cost, low-tech alternative to expensive, energy-intensive carbon capture methods.\n• The CO₂ captured by ERW becomes stable bicarbonate in soil water, which eventually streams into the ocean to remain safely stored for hundreds of years.\n• ERW can improve rural economies by reducing farmers' need for fertilizers and increasing their earnings from carbon credits.", "tag": "Choice D partly hidden by an overlay in the screenshot (text completed)", "n": 52, "id": "83440602", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "The function $f$ is defined by the equation $f(x)=100x+7$. What is the value of $f(x)$ when $x=5$?", "cat": "Function evaluation", "skill": "Linear Functions", "dom": "Algebra", "ans": "D", "rev": {"formula": ["Substitute the given $x$-value into the rule"], "tip": ["Replace $x$ with $5$ and follow the order of operations"], "trap": ["Adding $100+5+7$ instead of multiplying $100$ by $5$"], "steps": ["$f(5)=100(5)+7$", "$f(5)=500+7$", "$f(5)=507$"], "desmos": ["Type 100*5+7 and read 507"]}, "choices": ["$112$", "$135$", "$500$", "$507$"], "n": 53, "id": "fa5ab24e"}, {"diff": "Easy", "type": "mc", "q": "For a project, Kayla recorded the heights of $25$ people in her neighborhood. The histogram summarizes the heights, in inches (in), of these $25$ people. The first bar represents people with a height of at least $51$ in but less than $53$ in. The second bar represents people with a height of at least $53$ in but less than $55$ in, and so on. How many of these $25$ people had a height of at least $51$ in but less than $55$ in?", "cat": "Histograms", "skill": "One-Variable Data", "dom": "Problem-Solving & Data Analysis", "ans": s", "dom": "Algebra", "ans": "4.59", "rev": {"formula": ["In $ax+by=c$, the coefficient $a$ is the price (rate) per unit of $x$"], "tip": ["The number multiplying $x$ is the price of one smaller bottle"], "trap": ["Giving 6.09 (the larger bottle) or 910.53 (the total)"], "steps": ["$x$ counts smaller bottles", "Each smaller bottle contributes $4.59$ dollars per bottle", "Price $=4.59$"], "desmos": ["Not needed"]}, "n": 59, "id": "8671833e"}, {"diff": "Medium", "type": "mc", "q": "Triangle $ABC$ is similar to triangle $XYZ$, where $A$, $B$, and $C$ correspond to $X$, $Y$, and $Z$, respectively. In triangle $ABC$, the length of $\\overline{AB}$ is $180$ and the length of $\\overline{BC}$ is $900$. In triangle $XYZ$, the length of $\\overline{YZ}$ is $80$. What is the length of $\\overline{XY}$?", "cat": "Similar triangles", "skill": "Lines, Angles & Triangles", "dom": "Geometry & Trigonometry", "ans": "D", "rev": {"formula": ["Similar triangles: $\\frac{AB}{XY}=\\frac{BC}{YZ}$"], "tip": ["$AB$ matches $XY$ and $BC$ matches $YZ$"], "trap": ["Choosing 288 by multiplying 180 by 80/50 or mismatching the sides"], "steps": ["$\\frac{BC}{YZ}=\\frac{900}{80}=\\frac{45}{4}$", "$XY=\\frac{AB}{45/4}=180\\cdot\\frac{4}{45}$", "$XY=16$"], "desmos": ["Type 180*80/900 and read 16"]}, "choices": ["$288$", "$196$", "$80$", "$16$"], "n": 60, "id": "87dc9bf2"}, {"diff": "Easy", "type": "mc", "q": "In the $xy$-plane, line $k$ passes through the points $(0,-9)$ and $(1,-5)$. Which equation defines line $k$?", "cat": "Equation of a line", "skill": "Linear Functions", "dom": "Algebra", "ans": "C", "rev": {"formula": ["$y=mx+b$, with $m=\\frac{y_2-y_1}{x_2-x_1}$"], "tip": ["The point $(0,-9)$ gives the $y$-intercept directly"], "trap": ["Choosing $\\frac14x-9$ by flipping the slope"], "steps": ["$b=-9$", "$m=\\frac{-5-(-9)}{1-0}=4$", "$y=4x-9$"], "desmos": ["Plot both points and check each equation passes through them"]}, "choices": ["$y=\\frac14x-9$", "$y=-x+\\frac14$", "$y=4x-9$", "$y=-x+4$"], "n": 61, "id": "32c0291a"}, {"diff": "Medium", "type": "mc", "q": "Which of the following equations is the most appropriate linear model for the data shown in the scatterplot?", "cat": "Scatterplots and linear models", "skill": "Two-Variable Data & Scatterplots", "dom": "Problem-Solving & Data Analysis", "ans": "C", "rev": {"formula": ["A line of best fit follows the trend: matching slope and $y$-intercept"], "tip": ["The data rises about $2.2$ units for each step in $x$ and starts close to the origin"], "trap": ["Choosing a line with a slope that is too small or an intercept that is too high"], "steps": ["Points go from about $(1,3)$ to $(10,22.5)$", "Slope $\\approx\\frac{22.5-3}{9}\\approx 2.2$", "A line through the middle starts near $y=0.2$, so $y=2.2x+0.2$"], "desmos": ["Use Desmos: enter the points in a table and type y1~mx1+b for the regression"]}, "choices": ["$y=0.2x+2.2$", "$y=2.2x+7$", "$y=2.2x+0.2$", "$y=7x+2.2$"], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX4AAAFSCAIAAAB61iPmAABFTUlEQVR42u2deVxU1fvH7519BoZ9XwQFEQS3VNzXTFOzr4GamWtalnuipl+1MvWXW2qpmZiapGl9M9JQXHBBBTNEXEBkE4ZhH2aGYVZmuff3x/l1f/MFNJm5wADP+w9fOMuZc895zuc85zkbTpIkBgAA0LIwoAgAAADpAQAApAcAAACkBwAAkB4bgiRJgiCo/xIEYf5fAABsEFb7eAwcxxv9GwAA8Hqai4cPH65ataqgoADDMKPReOTIkePHj0PVAgB4Pc01zsIw7N69e9u2bUtNTdVqtbt37zYajdevXy8pKZkzZw64PwAAXk9zodfrd+zYMXHixMTERL1eb2dnFx4ezufzoWoBAKSnWcBxHMfxIUOG+Pn5hYeHSySS6upqDMO4XG7Xrl3B5QEAkJ7mhc1me3p64jheXl5uMBiqqqr69OkDVQsAID3NC0mSfD6fyWRKpdKKioqysrKhQ4dC1QIASE+zj7zs7e15PJ5cLo+Pjw8NDfX19YWqBQBbhtVunoQgiJSUlJqamq1btwoEAqhaAACvp5mfgcEgCEKv11++fHnevHlBQUFQrwAA0tPsmEymsrIyg8GwePHiUaNGwdwWANg+eDs4Kqy4uPjf//53ly5dVq9ebW9v/38PBgIEACA99EIQhFarffTokUAgkEqlycnJXl5eM2fOFAqFUKMAANLTjOTl5U2aNIkgiJEjR86cOfOVV16h/B0AAEB6mgWTyUQQREZGRm1t7dChQzkcTmZmpkAgQAFmGGoBAEgP/aDTeZhMJpVzo9F4+PBhlUoVExPDYDBAegDA9mmTM1wMBsNcMTUazYMHD+Lj47VaLdQoAID0NI+f1gCFQvH48eOsrCyRSAR3+wAASE8LUVRUVFJSotPp7t+/D6MtAADpaSEKCgrQksK7d+8ajUaoVAAA6WkJ0tLS0DnwDx8+VCgUUKkAANLTEpw/fx798eTJE5AeAADpaV5IkiR s": ["$f(2)=k(2)^2=4k=64$", "$k=16$", "Check: $f(-1)=16\\cdot\\frac12=8$"], "desmos": ["Type 64/4 and read 16"]}, "choices": ["$8$", "$9$", "$15$", "$16$"], "n": 64, "id": "6caa5b34"}, {"diff": "Easy", "type": "spr", "q": "The base of a right rectangular pyramid has a length of $27$ centimeters and a width of $7$ centimeters. The height of this pyramid is $5$ centimeters. What is the volume, in cubic centimeters, of this pyramid?", "cat": "Volume of a pyramid", "skill": "Area & Volume", "dom": "Geometry & Trigonometry", "ans": "315", "rev": {"formula": ["Pyramid volume: $V=\\frac13\\,lwh$"], "tip": ["Do not forget the $\\frac13$"], "trap": ["Giving 945 (the box volume)"], "steps": ["$V=\\frac13(27)(7)(5)$", "$=9\\cdot 7\\cdot 5$", "$V=315$"], "desmos": ["Type 27*7*5/3 and read 315"]}, "n": 65, "id": "d7e3621f"}, {"diff": "Medium", "type": "mc", "q": "For an object with a mass of $66$ kilograms, the given equation relates the kinetic energy $K$, in joules, of the object to the object's speed $v$, in meters per second, where $K$ and $v$ are positive. Which equation correctly expresses this object's speed, in meters per second, in terms of the object's kinetic energy, in joules?\n$66=\\frac{2K}{v^2}$", "cat": "Rearranging formulas", "skill": "Nonlinear Equations & Systems", "dom": "Advanced Math", "ans": "D", "rev": {"formula": ["Isolate $v^2$, then take the positive square root"], "tip": ["Multiply by $v^2$, divide by $66$, then take the square root"], "trap": ["Forgetting the square root (choice B) or inverting the fraction (choice C)"], "steps": ["$66v^2=2K$", "$v^2=\\frac{2K}{66}$", "$v=\\sqrt{\\frac{2K}{66}}$ (positive since $v>0$)"], "desmos": ["Test: choose K=33, then v should be 1"]}, "choices": ["$v=\\frac{2K}{66^2}$", "$v=\\frac{66^2}{2K}$", "$v=\\sqrt{\\frac{66}{2K}}$", "$v=\\sqrt{\\frac{2K}{66}}$"], "n": 66, "id": "144861d0"}, {"diff": "Medium", "type": "mc", "q": "If $\\frac{j}{k}=95$ and $\\frac{36j}{12xk}=95$, what is the value of $x$?", "cat": "Rational expressions", "skill": "Equivalent Expressions", "dom": "Advanced Math", "ans": "C", "rev": {"formula": ["$\\frac{36j}{12xk}=\\frac{3}{x}\\cdot\\frac{j}{k}$"], "tip": ["Simplify $\\frac{36}{12}=3$ first, then substitute $\\frac jk=95$"], "trap": ["Choosing 36 or 12 by cancelling the wrong terms"], "steps": ["$\\frac{36j}{12xk}=\\frac{3}{x}\\cdot\\frac{j}{k}$", "$\\frac{3}{x}(95)=95$", "$\\frac3x=1$, so $x=3$"], "desmos": ["Pick j=95, k=1 and solve 36*95/(12*x)=95"]}, "choices": ["$\\frac{12}{95}$", "$\\frac13$", "$3$", "$36$"], "n": 67, "id": "94238fe9"}, {"diff": "Medium", "type": "mc", "q": "$y\\ge x+15$\n$y\\le -5x-15$\nWhich point $(x,y)$ is a solution to the given system of inequalities in the $xy$-plane?", "cat": "Systems of inequalities", "skill": "Linear Inequalities", "dom": "Algebra", "ans": "A", "rev": {"formula": ["A solution point makes both inequalities true"], "tip": ["Test each point in both inequalities"], "trap": ["Checking only one inequality"], "steps": ["$(-6,13)$: $13\\ge -6+15=9$ ✓ and $13\\le -5(-6)-15=15$ ✓", "$(-6,8)$: $8\\ge 9$ ✗", "$(-4,13)$: $13\\le 5$ ✗ ; $(-4,8)$: $8\\ge 11$ ✗"], "desmos": ["Graph both inequalities and see which point lies in the overlap"]}, "choices": ["$(-6,13)$", "$(-6,8)$", "$(-4,13)$", "$(-4,8)$"], "n": 68, "id": "39212aad"}, {"diff": "Medium", "type": "mc", "q": "A plumbing company charges its customers $\\$111$ for the first hour of a plumbing service call and $\\$50$ for each additional hour, plus the cost of plumbing parts. Which equation represents the total cost $y$, in dollars, for an $x$-hour plumbing service call where the cost of parts was $\\$z$ and $x\\ge 1$?", "cat": "Linear models", "skill": "Linear Equations in Two Variables", "dom": "Algebra", "ans": "B", "rev": {"formula": ["Total $=$ first hour $+$ rate $\\times$ additional hours $+$ parts"], "tip": ["Only $x-1$ hours are charged at $\\$50$"], "trap": ["Using $50x$ and ignoring that the first hour costs $\\$111$ (not $\\$50$)"], "steps": ["$y=111+50(x-1)+z$", "$y=111+50x-50+z$", "$y=50x+z+61$"], "desmos": ["Test x=1: cost should be 111+z; only choice B gives 50+z+61"]}, "choices": ["$y=50x+z$", "$y=50x+z+61$", "$y=111x+z$", "$y=111x+50z+61$"], "n": 69, "id": "2812ec18"}, {"diff": "Easy", "type": "mc", "q": "In the triangle shown, the value of $x$ is $8$. What is the value of $\\sin A$?", "cat": "Right triangle trigonometry", "skill": "Right Triangles & Trigonometry", "dom": "Geometry & Trigonometry", "ans": "B", "rev": {"formula": ["$\\sin A=\\frac{\\text{opposite}}{\\text{hypotenuse}}$", "45-45-90: legs $=\\frac{\\text{hyp}}{\\sqrt2}$"], "tip": ["Both acute angles are $45^\\circ$, so $\\sin A=\\sin 45^\\circ$"], "trap": ["Using $\\frac{1}{\\sqrt3}$ from a 30-60-90 triangle"], "steps": ["Angle $B$ is $90^\\circ$ and $A=C=45^\\circ$", "Side $BC=\\frac{8}{\\sqrt2}$ is opposite $A$; the hypotenuse is $x=8$", "$\\sin A=\\frac{8/\\sqrt2}{8}=\\frac{1}{\\sqrt2}$"], "desmos": ["Type sin(45) and compare with 1/sqrt(2)=0.7071"]}, "choices": ["$\\frac{1}{\\sqrt3}$", "$\\frac{1}{\\sqrt2}$", "$\\frac12$", "$\\frac{\\sqrt3}{2}$"], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASQAAAEECAIAAAAON96NAAAxPklEQVR42u2dd3hU55X/b5s7o6kqiFHvGjUgyGAeg4MRCDUkUYyJTYxBXQgnzrPxeje7sZ/Fefw8+8Qb4pCAJFSQIAlJbJqQUBkVC/wsiw2mCQm1GRVUkFAdlan33t8f7/r+JjKxKRcWxPn8Jc3ckWbu3O8957znPefgHMdhAAA8fgg4BQAAYgMAEBsAACA2AACxAQCIDQCAJwIl1B9iWZbjOD6RgOM4juP2PwAAiO0h4aVFEATHcTqdrq2tbWRkxGQyEQShUqnc3Nx8fHzc3NwkEgnoDQDwh05qoxdyHPf1118fO3astbXV2dlZo9G4uLhMTk5evXq1t7dXpVKFh4f/6Ec/WrFihUgkgtMNgGV7SL+xr6+vvLy8srLSYDDEx8e//PLLPj4+crncaDSuXr26sbHx6NGjbW1tS5YsWb58OZxrAMT2kGZtbGystLS0qKhIo9Hs3bv3xRdfVCgUyKvEMMzHx2fJkiUzMzPl5eXOzs7oQQAAsT2w9zg7O3v69OmCggJvb+/33ntvzZo1c7xEFLZFR0e3trYGBgaCDwkADyM2i8Vy4cKF3NxcpVKZlZX1wx/+kKKoex6p0WiSk5OdnZ3hRAPAA3t3OI739/f/6U9/amtri4mJSUxMlEql/2ix0dvb+6233nJ3d4cTDQAPbNlYlr1582ZNTY2Hh8fatWvVajXLsizL8nrjf0BxGkmSKEkAq/8AWLYHw2QyNTQ0jI+P+/n5RUZG3qcxBKUBwINZNo7jTCbTpUuXSJIMCgpyc3OzN2UAAAhm2TiOm56evnv3roODg4+PD5w+AHiMYpucnGQYRiQSqVQq -1$?", "cat": "Systems with a quadratic", "skill": "Nonlinear Equations & Systems", "dom": "Advanced Math", "ans": "C", "rev": {"formula": ["Substitute one equation into the other"], "tip": ["Since $y=x-1$, the quantity $x-1$ equals $y$"], "trap": ["Choosing $-\\frac{28}{27}$ (the sign slip: it is $+\\frac{28}{27}$)"], "steps": ["Let $u=x-1$; then $y=u$ and $u=27u^2-28$", "$27u^2-u-28=0$", "$(27u-28)(u+1)=0$, so $u=\\frac{28}{27}$ or $u=-1$"], "desmos": ["Graph both equations and read the intersections' x-values minus 1"]}, "choices": ["$-2$", "$-\\frac{28}{27}$", "$-1$", "$-\\frac{1}{27}$"], "n": 72, "id": "4e2de8fb"}, {"diff": "Hard", "type": "spr", "q": "$10x+14y=6y+5$\n$ty=\\frac13+5x$\nIn the given system of equations, $t$ is a constant. If the system has no solution, what is the value of $t$?", "cat": "No-solution systems", "skill": "Systems of Two Linear Equations", "dom": "Algebra", "ans": "-4", "rev": {"formula": ["No solution $\\Rightarrow$ parallel lines: same slope, different intercepts"], "tip": ["Write both equations as $y=mx+b$"], "trap": ["Matching the intercepts instead of the slopes"], "steps": ["First: $8y=-10x+5$, so $y=-\\frac54x+\\frac58$", "Second: $y=\\frac5t x+\\frac{1}{3t}$", "$\\frac5t=-\\frac54\\Rightarrow t=-4$; intercepts $-\\frac1{12}\\ne\\frac58$ ✓"], "desmos": ["Test t=-4 in Desmos: the two lines are parallel"]}, "n": 73, "id": "80bc5386"}, {"diff": "Medium", "type": "spr", "q": "$4|x+3|-2=22$\nWhat is the sum of the solutions to the given equation?", "cat": "Absolute value equations", "skill": "Nonlinear Equations & Systems", "dom": "Advanced Math", "ans": "-6", "rev": {"formula": ["$|u|=k\\Rightarrow u=k$ or $u=-k$"], "tip": ["Isolate the absolute value first"], "trap": ["Adding the numbers inside, giving 6, or reporting a single solution"], "steps": ["$4|x+3|=24\\Rightarrow |x+3|=6$", "$x+3=6$ or $x+3=-6$, so $x=3$ or $x=-9$", "Sum $=3+(-9)=-6$"], "desmos": ["Graph y=4abs(x+3)-2 and y=22; add the two x-values"]}, "n": 74, "id": "b9670790"}, {"diff": "Easy", "type": "spr", "q": "In the figure shown, lines $\\ell$ and $k$ are parallel and line $t$ intersects both lines. If $x=120$, what is the value of $y$?", "cat": "Parallel lines and transversals", "skill": "Lines, Angles & Triangles", "dom": "Geometry & Trigonometry", "ans": "60", "rev": {"formula": ["Same-side angles on a straight line add to $180^\\circ$; parallel lines repeat the angles"], "tip": ["The angle $y^\\circ$ is the supplement of $x^\\circ$"], "trap": ["Answering 120"], "steps": ["$x^\\circ$ and the angle next to it on line $\\ell$ sum to $180^\\circ$, so that angle is $60^\\circ$", "Parallel lines: the matching angle at $k$ is also $60^\\circ$", "$y=60$"], "desmos": ["Not needed"]}, "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX4AAAGCCAIAAABo6D/JAABMa0lEQVR42u2dd1wU197/d2Z2ti9b2F1ggaULWEFEEVQEFbHEgr2AJe0+uXnSbm5yc1Nucp97n9y8kptiihoVNYICSqyJNZZY0YiV3jssdSnbZ+b3x3kyv72gxiiL7fv+gxcsu7Mz55z5nM/3e8pgDMNwAAAABhYcigAAAJAeAABAegAAAEB6AAAA6QEAAADpAQAApKcX7Pi94y8wqA8AID3OhaZpVm7MZrPBYKBpmqZp5legGgAApKf/IQiCw+FgGNbd3b179+6ysjIcxzEMg9IHAJAe57oeu91eX1+/efPmrKwskiSR5YHSB4AnFu4AfAdFUQUFBZmZmWlpab6+vi0tLXq93s3NDUofAMD1OAuGYZqamn7++ecLFy50dHTIZLKcnJza2lrMAagGAADX089gGObu7j5nzpycnBwXF5fXXntt2LBhYrEYFAcAQHqc/B1cLsMwjY2NarV61KhRIpEIEj0AAAHXQFBcXNzV1TVq1Cg+n8/hcHAcpjICAEiP88nNzbXb7RMmTIASBwBggKSHoqirV68yDBMdHY1SPJDoAQCQHudC03RVVVVtba1Op9NoNBaLhQMLKQAApMfZX8AwzPXr19vb24OCgjo6OgoKCiiKgnIHAJAep7ueK1eutLS0WCyW9PT04cOHkyQJ03kAAKTH6ajV6tDQ0O7u7vj4eC6XC4UOAADm7JwLTdNtbW2NjY1SqVSr1ZIkCYUOAAA2MOlehmEgwgIAgMXp4Q+MZAEA8MBcDwAAgCOwoAEAAJAeAABAeu4TmLIMAAC4HgAAniTpAeMDAMDASQ+Ktpqamn744YeSkhL0PBwAAADnSg9apSUWi6uqqr788svy8nKwPwAADETAhWGYVCpNSkpyd3ffuHFjQUEBqA8AAP+nD86WAxR2paen9/T0LFmyJCAgAHZHBQDA6SqAnkjxzDPP8Hi8jz76SK/XQ94HAIABWkhB03RjY+PGjRs7Ozufe+65QYMGQdEDAEiP03UHfUt7e3tGRkZra+v8+fOHDBkCpQ8AEHA5+WtwHMdxV1fXBQsWuLi4ZGZmFhUVQeQFACA9ztUd9hnHarV60aJFGo1m27ZtVVVVoD4AANIzIAEehnm4uy9atEgul//973+vrKyEOgCAJ5CB3q8HbVeIss5bt27t6elZtGjRsGHDoCYAAKTHudLD/tLS0rJjx4 , "steps": ["$a(x+25)=ax+25a$", "$ax=13x\\Rightarrow a=13$", "Check: $25a=325$ ✓"], "desmos": ["Test a=13: both sides give the same line"]}, "n": 77, "id": "44024359"}, {"diff": "Easy", "type": "mc", "q": "$y=-\\frac{1}{11}x$\n$y=\\frac14x$\nThe solution to the given system of equations is $(x,y)$. What is the value of $x$?", "cat": "Systems of equations", "skill": "Systems of Two Linear Equations", "dom": "Algebra", "ans": "C", "rev": {"formula": ["Set the two expressions for $y$ equal"], "tip": ["Both lines pass through the origin, and they have different slopes"], "trap": ["Choosing 4 or $-11$ from the denominators"], "steps": ["$-\\frac{x}{11}=\\frac{x}{4}$", "$-4x=11x\\Rightarrow 15x=0$", "$x=0$"], "desmos": ["Graph both lines: they intersect at the origin"]}, "choices": ["$-11$", "$-7$", "$0$", "$4$"], "n": 78, "id": "c2b3ba93"}, {"diff": "Medium", "type": "mc", "q": "An organization sells tickets to a fundraiser for $\\$50$ per person. The organization's expenses are $\\$600$ for a rental space and $\\$18$ per person for food. The organization's goal is to earn at least $\\$1{,}500$ after paying all expenses. What is the minimum number of tickets that must be sold to meet this goal?", "cat": "Inequality word problem", "skill": "Linear Inequalities", "dom": "Algebra", "ans": "D", "rev": {"formula": ["Profit $=$ revenue $-$ expenses $\\ge$ goal"], "tip": ["Round UP, because the goal must be met"], "trap": ["Rounding 65.6 down to 65 or forgetting the food cost per person"], "steps": ["$50n-600-18n\\ge1500$", "$32n\\ge2100$", "$n\\ge65.625$, so the minimum whole number is $66$"], "desmos": ["Type 2100/32 and read 65.625"]}, "choices": ["$30$", "$42$", "$47$", "$66$"], "n": 79, "id": "975680ab"}, {"diff": "Medium", "type": "mc", "q": "$f(x)=\\frac{a-15}{x}+5$\nIn the given function $f$, $a$ is a constant. The graph of function $f$ in the $xy$-plane, where $y=f(x)$, is translated $3$ units down and $2$ units to the right to produce the graph of $y=g(x)$. Which equation defines function $g$?", "cat": "Transformations of functions", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "B", "rev": {"formula": ["Right $h$: replace $x$ with $x-h$; down $k$: subtract $k$"], "tip": ["Right $2$ gives $x-2$; down $3$ gives $5-3=2$"], "trap": ["Using $x+2$ for a right shift, or changing the numerator"], "steps": ["$g(x)=f(x-2)-3$", "$g(x)=\\frac{a-15}{x-2}+5-3$", "$g(x)=\\frac{a-15}{x-2}+2$"], "desmos": ["Pick a=15: f(x)=5; g should be 2 everywhere"]}, "choices": ["$g(x)=\\frac{a-15}{x+2}+2$", "$g(x)=\\frac{a-15}{x-2}+2$", "$g(x)=\\frac{a-18}{x+2}+5$", "$g(x)=\\frac{a-18}{x-2}+5$"], "n": 80, "id": "096c883e"}, {"diff": "Medium", "type": "mc", "q": "Line $p$ is defined by $2y+18x=11$. Line $r$ is perpendicular to line $p$ in the $xy$-plane. What is the slope of line $r$?", "cat": "Perpendicular lines", "skill": "Linear Equations in Two Variables", "dom": "Algebra", "ans": "B", "rev": {"formula": ["Perpendicular slopes are negative reciprocals"], "tip": ["Find the slope of $p$ first"], "trap": ["Choosing $-9$ (the slope of $p$) or $9$"], "steps": ["$2y=-18x+11$, so $y=-9x+\\frac{11}{2}$", "Slope of $p$ is $-9$", "Slope of $r=-\\frac{1}{-9}=\\frac19$"], "desmos": ["Type -1/(-9) and read 0.111"]}, "choices": ["$9$", "$\\frac19$", "$-\\frac19$", "$-9$"], "n": 81, "id": "72659eaf"}, {"diff": "Easy", "type": "mc", "q": "What is the $y$-intercept of the graph of $y=\\left(\\frac{2}{17}\\right)^{x+1}$ in the $xy$-plane?", "cat": "y-intercept of an exponential", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "D", "rev": {"formula": ["$y$-intercept: set $x=0$"], "tip": ["$x=0$ gives exponent $1$"], "trap": ["Choosing $(0,2)$ or $(0,17)$"], "steps": ["$y=\\left(\\frac2{17}\\right)^{0+1}=\\frac{2}{17}$", "Point: $\\left(0,\\frac2{17}\\right)$"], "desmos": ["Type (2/17)^(0+1)"]}, "choices": ["$(2,17)$", "$(0,17)$", "$(0,2)$", "$\\left(0,\\frac{2}{17}\\right)$"], "n": 82, "id": "3ecf9c97"}, {"diff": "Medium", "type": "spr", "q": "A beaker containing a liquid is placed on a table. The function $g(t)=294+(364-294)(2.72)^{-0.104t}$ gives the approximate temperature, in kelvins, of the liquid $t$ minutes after the beaker was placed on the table. According to this function, what was the approximate temperature, in kelvins, of the liquid when the beaker was placed on the table?", "cat": "Exponential models", "skill": "Nonlinear Functions", "dom": "Advanced Math", "ans": "364", "rev": {"formula": ["The start of the process is $t=0$", "$b^0=1$"], "tip": ["At $t=0$ the exponential factor equals $1$"], "trap": ["Giving 294 (the room temperature the liquid approaches)"], "steps": ["$g(0)=294+(364-294)(2.72)^0$", "$=294+70\\cdot 1$", "$g(0)=364$"], "desmos": ["Type 294+(364-294)*2.72^(0)"]}, "n": 83, "id": "a928b492"}, {"diff": "Medium", "type": "mc", "q": "Hannah and Wyatt are saving money to purchase a car. Hannah saves $\\frac15$ of her salary each month, and Wyatt saves $\\frac27$ of his salary each month. Together, they save a total of $\\$3{,}160$ from their monthly salaries each month. If $h$ and $w$ represent Hannah's and Wyatt's monthly salaries, in dollars, respectively, which equation shows the relationship between $h$ and $w$?", "cat": "Linear models with fractions", "skill": "Linear Equations in Two Variables", "dom": "Algebra", "ans": "D", "rev": {"formula": ["Total saved $=\\frac15h+\\frac27w$"], "tip": ["Multiply by the common denominator $35$ to clear fractions"], "trap": ["Using the common denominator $35$ but swapping the coefficients (choice C)"], "steps": ["$\\frac15h+\\frac27w=3160$", "Multiply by $35$: $7h+10w=110{,}600$"], "desmos": ["Type 35*3160 and read 110,600 to check the right-hand side"]}, "choices": ["$h+w=3{,}160$", "$h+2w=3{,}160$", "$10h+7w=110{,}600$", "$7h+10w=110{,}600$"], "n": 84, "id": "a3c1bcd7"}, {"diff": "Hard", "type": "mc", "q": "$f(x)=\\sqrt{7x+6}$\nThe function $f$ is defined by the given equation. If $f(a)=-7a$, where $a$ is a constant, what is the value of $a$?", "cat": "Radical equations", "skill": "Nonlinear Equations & Systems", "dom": "Advanced Math", "ans": "B", "rev": {"formula": ["Square both sides, then check for extraneous solutions"], "tip": ["A square root cannot be negative, so $-7a\\ge0$ and $a\\le0$"], "trap": ["Choosing $\\frac37$ or $\\frac27$, which make $-7a$ negative or $\\sqrt{}$ negative"], "steps": ["$\\sqrt{7a+6}=-7a$", "$7a+6=49a^2\\Rightarrow 49a^2-7a-6=0$", "$(7a-3)(7a+2)=0$, so $a=\\frac37$ or $a=-\\frac27$", "Only $a\\le0$ works: $a=-\\frac27$"], "desmos": ["Graph y=sqrt(7x+6) and y=-7x; read the intersection x=-0.2857"]}, "choices": ["$-\\frac37$", "$-\\frac27$", "$\\frac27$", "$\\frac37$"], "n": 85, "id": "810c5c2f"}, {"diff": "Medium", "type": "spr", "q": "A car dealership has only sedans, SUVs, and minivans for sale. On Monday, $20\\%$ of the vehicles for sale were sedans and $50\\%$ were SUVs. If there were $22$ sedans for sale at the dealership on Monday, how many minivans were for sale?", "cat": "Percent word problem", "skill": "Percentages", "dom": "Problem-Solving & Data Analysis", "ans": "33", "rev": {"formula": ["Part $=$ percent $\\times$ whole"], "tip": ["Minivans are the remaining $100\\%-20\\%-50\\%=30\\%$"], "trap": ["Giving 55 (the SUVs) or 22 (the sedans)"], "steps": ["$0.20T=22\\Rightarrow T=110$", "Minivans: $100-20-50=30\\%$", "$0.30\\times110=33$"], "desmos": ["Type 22/0.2*0.3 and read 33"]}, "n": 86, "id": "d6400cc4"}, {"diff": "Hard", "type": "spr", "q": "$4x^2+14=32x+r$\nIn the given equation, $r$ is a constant. The equation has exactly one real solution. What is the value of $r$?", "cat": "Discriminant", "skill": "Nonlinear Equations & Systems", "dom": "Advanced Math", "ans": "-50", "rev": {"formula": ["One real solution $\\iff b^2-4ac=0$"], "tip": ["Move everything to one side first"], "trap": ["Using $+50$ or forgetting to move $r$ with its sign"], "steps": ["$4x^2-32x+(14-r)=0$", "$(-32)^2-4(4)(14-r)=0$", "$1024-16(14-r)=0\\Rightarrow 14-r=64$, so $r=-50$"], "desmos": ["Graph y=4x^2-32x+14 and y=r; the line must touch the vertex at y=-50"]}, "n": 87, "id": "7d97d815"}, {"diff": "Hard", "type": "mc", "q": "In the figure, $3r>11s$. Which of the following values must be the greatest?", "cat": "Trigonometry of complementary angles", "skill": "Right Triangles & Trigonometry", "dom": "Geometry & Trigonometry", "ans": "A", "rev": {"formula": ["In a right triangle $r+s=90$, so $\\sin r^\\circ=\\cos s^\\circ$"], "tip": ["The condition $3r>11s$ with $r+s=90$ forces $s<19.3^\\circ$ and $r>70.7^\\circ$"], "trap": ["Choosing $\\tan s^\\circ$ or $\\sin s^\\circ$, which are small angles' values"], "steps": ["$3(90-s)>11s\\Rightarrow 270>14s\\Rightarrow s<19.3$", "So $r>70.7^\\circ$: $\\sin r>0.94$", "$\\cos r$, $\\sin s$ and $\\tan s$ are all below $0.35$"], "desmos": ["Test r=75, s=15 in Desmos"]}, "choices": ["$\\sin r^\\circ$", "$\\cos r^\\circ$", "$\\sin s^\\circ$", "$\\tan s^\\circ$"], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX4AAAE5CAIAAAAY5dx/AABOYUlEQVR42u2dd1xT1/vHc28GGUBISFgJYYMCggwFq7itA7e2asU96q5VtM66tc7WWhfura17D9wDB6hM2XsECARICNn398f5fe8rX2z7tRqs43n/4QvwJrk5957PfdZ5DkYQBAUAAOD9gsMQAAAA0gMAAEgPAAAASA8AACA9AAAAID0AAHzy0kMQhNFohLEDAOD9SQ/UAQEA8O9YPWDyAADwjtD+qZ+VlJSUmprq6+vbrFkzFouFYRj5v+TPAAAAfw/25g6UwWDIz8+fMGFCWlqaUCgcPnz4kCFDJBIJlUqlUCh6vR7HcRyHuDUAAOa2ejIzM9PT0ysqKioqKjZs2JCRkfHtt9+2bNmSyWSC6AAA8Ob8A70gCEKr1VL+E2murq4+fPjwwoULz507p1AowOQBAKBJrB7kc5kqkV6vv3PnTlFR0atXr2bPnm1lZYUOQC4YAACAGaweUzAMYzAYVCrVaDRmZ2f/+uuvEyZMSExM1Ol0GIZBAh4AAHNaPSQ2NjZdunTRarV3796tra2Vy+UXL16sqqoaM2ZM165dBQIBZLsAADC/9NBotDZt2vTs2XPbtm1nz54tKiqqr6+/detWbm5uQUHB8OHDJRIJDC4AAH8FdenSpW94qNFozMzMvHz5slKpZLPZHTp06NWr1xdffGFpaSmVSsvLywmCqKmpefnyZWVlpUgk4vP5VCoVzB8AAF7nLWM9OI4jWeFyuWPGjFm3bl3//v1pNBpBEHK5/ODBg1OmTDl79mxDQwMMMQAAZnO4yBWkBEGw2ey2bdtKJBKJRHLo0CG5XK7VauPj4xcuXJidnT1y5EiRSGSad0dBaLCGAAAcrn/scHE4nPbt27dq1QopCJVK5fF4gYGBIpFILpcj56u6ujo5ObmkpMTOzs7Ozg5ZSUizMAwD6QEAcLjeBlI7MAxD/peTk9Po0aOXL1/eqVMnOp1OEIRMJvv9999nz559/fr16upqs function parseNum(v){v=String(v).trim().replace(/\s+/g,'').replace('−','-').replace(/,/g,'');if(!v)return NaN;let m=v.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);m=v.match(/^-?\d*\.?\d+$/)||v.match(/^-?\d+\.?$/);return m?parseFloat(v):NaN}
function isRight(i){const q=Q[i],a=S.ans[i];if(a==null||a==='')return false;if(q.type==='mc')return a===q.ans;
 const x=parseNum(a);if(isNaN(x))return false;return q.ans.split(';').some(k=>{const y=parseNum(k);return Math.abs(x-y)<=(Number.isInteger(y)?1e-9:0.0007)})}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
/* ---------- screens ---------- */

/* ---------- full-length: two locked modules ---------- */
const MODS=TEST.mods; S.mod=0;
const DOMS=['Algebra','Advanced Math','Problem-Solving & Data Analysis','Geometry & Trigonometry'];
function modOf(i){return MODS.findIndex(m=>i>=m.s&&i<m.e)}
function home(){S.phase='home';$('hmod').textContent=TEST.kindLabel;$('timer').textContent='';
  const base=TEST.minutes;
  $('app').innerHTML=`<div class="card"><div class="kick">${esc(TEST.domain)}</div><h2>${esc(TEST.title)}</h2>
  <p>${MODS.length>1?MODS.length+' modules · '+MODS.map(m=>m.e-m.s).join(' + ')+' questions':(MODS[0].e-MODS[0].s)+' questions · one module'} · 32 min per Reading & Writing module, 35 min per Math module · Desmos calculator and reference sheet available in the Math modules.</p>
  <p class="muted">${esc(TEST.note)}</p>
  <h3>Choose your timing (applies to each module)</h3><p><label><input type="radio" name="t" value="1" checked> Standard (32 / 35 min per module)</label><br>
  <label><input type="radio" name="t" value="1.25"> +25% extra time (${Math.round(32*1.25)} / ${Math.round(35*1.25)} min per module)</label><br><label><input type="radio" name="t" value="1.5"> +50% extra time (${Math.round(32*1.5)} / ${Math.round(35*1.5)} min per module)</label></p>
  <div class="stop">Within a module you can move back and forth, flag questions for review and open the overview to see what you have answered. There is a 10-minute break between the Reading and Writing part and the Math part. Once you submit a module it is locked, and you cannot return to a module once the next one begins. Answers and explanations appear only after you finish the last module.</div>
  <button class="btn" onclick="begin()">Begin ${esc(MODS[0].name)}</button></div>`}
function begin(){const r=document.querySelector('input[name=t]:checked');if(r)S.mult=parseFloat(r.value);startMod()}
function startMod(){S.total=Math.round(MODS[S.mod].min*60*S.mult);S.left=S.total;S.phase='test';
  clearInterval(S.tint);S.tint=setInterval(()=>{S.left--;if(S.left<=0){clearInterval(S.tint);endMod(true)}tick()},1000);
  (MODS[S.mod].rw?['tt']:['tt','calcb','refb']).forEach(i=>$(i).classList.remove('hide'));$('hmod').textContent=MODS[S.mod].name;tick();S.cur=MODS[S.mod].s;render()}
function tick(){$('timer').textContent=S.timerHidden?'--:--':fmt(S.left)}
function toggleTimer(){S.timerHidden=!S.timerHidden;$('tt').textContent=S.timerHidden?'Show':'Hide';tick()}
function stemEl(q){const f=q.fig?`<div class="nqfig"><img alt="Figure" class="zoomable" title="Click to enlarge" src="${q.fig}"><button class="zbtn" onclick="zoomImg(this.previousElementSibling.src)">\uD83D\uDD0D Enlarge</button></div>`:'';const ps=q.p?`<div class="rwp">${rich(q.p)}</div>`:'';return `${f}${ps}<div class="nqstem">${rich(q.q)}</div>`}
function render(){const q=Q[S.cur],i=S.cur,m=MODS[S.mod];let inp='';
  if(q.type==='mc'){inp='<div class="nqch">'+q.choices.map((c,k)=>{const L='ABCD'[k];return `<button class="nqc ${S.ans[i]===L?'sel':''}" onclick="pick('${L}')"><b>${L})</b><span>${rich(c)}</span></button>`}).join('')+'</div>'}
  else{inp=`<div class="nqspr"><label>STUDENT-PRODUCED RESPONSE</label><input id="sprin" value="${esc(S.ans[i]||'')}" oninput="S.ans[${i}]=this.value;$('sprprev').textContent=this.value" autocomplete="off"><small>Enter a number or a fraction, such as 3/4 or -2.5. Your answer: <b id="sprprev">${esc(S.ans[i]||'')}</b></small></div>`}
  const last=i===m.e-1,lbl='Submit '+m.name;
  $('app').innerHTML=`<div class="nq"><div class="nqh"><div class="nqn">${i-m.s+1}</div><div class="nqs"><span>${esc(m.name)}</span><span>${q.type==='mc'?'Multiple choice':'Student-produced response'}<button class="nqflag ${S.flag[i]?'on':''}" onclick="toggleFlag()">${S.flag[i]?'\u2691 Flagged':'\u2690 Flag for review'}</button></span></div></div><div class="nqb">${stemEl(q)}${inp}</div></div>
  <div class="nav" style="max-width:760px;margin:0 auto"><span><button class="btn alt" onclick="overview()">Question ${i-m.s+1} of ${m.e-m.s} \u25BE</button></span><div>${i>m.s?'<button class="btn alt" onclick="go(-1)">Back</button> ':''}${last?`<button class="btn gold" onclick="confirmMod()">${lbl}</button>`:'<button class="btn" onclick="go(1)">Next</button>'}</div></div>`;
  window.scrollTo(0,0)}
function pick(L){S.ans[S.cur]=L;render()}
S.flag={};
function go(d){const m=MODS[S.mod],n=S.cur+d;if(n>=m.s&&n<m.e){S.cur=n;render()}}
function jump(i){S.cur=i;closeOv();render()}
function toggleFlag(){S.flag[S.cur]=!S.flag[S.cur];render()}
function closeOv(){$('ovw').classList.remove('on')}
function isAns(i){return !(S.ans[i]==null||S.ans[i]==='')}
function gridHtml(m){let h='<div class="qgrid">';for(let i=m.s;i<m.e;i++)h+=`<button class="qc ${isAns(i)?'ans':''} ${S.flag[i]?'fl':''} ${i===S.cur?'cur':''}" onclick="jump(${i})">${i-m.s+1}</button>`;return h+'</div><div class="qleg"><span><i style="background:#e9f4ee;border-color:#2e8b57"></i>Answered</span><span><i></i>Unanswered</span><span><span style="color:#0D5EAF">\u2691</span> Flagged for review</span><span><i style="border-color:#111"></i>Current</span></div>'}
function counts(m){let un=0,fl=0;for(let i=m.s;i<m.e;i++){if(!isAns(i))un++;if(S.flag[i])fl++}return{un,fl}}
function overview(){const m=MODS[S.mod],c=counts(m);$('ovwp').innerHTML=`<h3>${esc(m.name)} overview</h3><p class="muted">Unanswered: <b>${c.un}</b> &nbsp;\u00b7&nbsp; Flagged: <b>${c.fl}</b>. Click a number to go to that question.</p>${gridHtml(m)}<div class="center"><button class="btn alt" onclick="closeOv()">Close</button></div>`;$('ovw').classList.add('on')}
function confirmMod(){const m=MODS[S.mod],c=counts(m);
  $('app').innerHTML=`<div class="card"><h2>Check your work</h2><p>${esc(m.name)}: unanswered <b>${c.un}</b> \u00b7 flagged for review <b>${c.fl}</b>. Click a number to return to that question.</p>${gridHtml(m)}<div class="stop">After you submit, ${esc(m.name)} is locked and you cannot return to it.</div><button class="btn alt" onclick="S.cur=Math.min(Math.max(S.cur,${m.s}),${m.e-1});render()">Back to questions</button> <button class="btn" onclick="endMod(false)">Submit ${esc(m.name)}</button></div>`;window.scrollTo(0,0)}
function endMod(auto){clearInterval(S.tint);const m=MODS[S.mod];S['secs'+S.mod]=S.total-Math.max(S.left,0);S.auto=S.auto||auto;
  ['tt','calcb','refb'].forEach(i=>$(i).classList.add('hide'));closeCalc();closeOv();$('timer').textContent='';
  if(S.mod<MODS.length-1){const nx=MODS[S.mod+1],brk=!!(m.rw&&!nx.rw);S.phase='break';$('hmod').textContent=m.name+' complete';
    $('app').innerHTML=`<div class="card"><div class="kick">${esc(m.name)} submitted${auto?' (time expired)':''}</div><h2>${esc(m.name)} is locked</h2><p>You answered ${modScore(S.mod).c} of ${m.e-m.s} correctly. The focus bar below shows where to put your effort. Full explanations unlock when you finish the test.</p>${focusBar(S.mod)}${brk?`<div class="brkbox"><div class="muted">10-minute break</div><div class="brkt" id="brkt">10:00</div><p class="muted">Stretch, drink some water, rest your eyes. ${esc(nx.name)} starts automatically when the break ends.</p></div>`:''}<div class="stop">${esc(nx.name)} starts when you press the button. You cannot return to ${esc(m.name)}.</div><button class="btn" onclick="nextMod()">${brk?'Skip break and begin ':'Begin '}${esc(nx.name)}</button></div>`;window.scrollTo(0,0);if(brk)startBreak()}
  else{S.phase='done';S.secs=MODS.reduce((a,_,k)=>a+(S['secs'+k]||0),0);results(S.auto)}}
var ZW=90;function zoomImg(u){$('zimg').src=u;zoomFit();$('zoomov').classList.add('on')}
function zoomBy(f){ZW=Math.min(400,Math.max(20,ZW*f));$('zimg').style.width=ZW+'vw'}
function zoomFit(){ZW=90;$('zimg').style.width='90vw'}
function closeZoom(){$('zoomov').classList.remove('on')}
document.addEventListener('click',e=>{const t=e.target;if(t.classList&&t.classList.contains('zoomable'))zoomImg(t.src)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
function nextMod(){clearInterval(S.bint);$('timer').textContent='';S.mod++;startMod()}
function startBreak(){S.bleft=600;const t=()=>{const v=fmt(S.bleft);const e=document.getElementById('brkt');if(e)e.textContent=v;$('timer').textContent='Break '+v};t();clearInterval(S.bint);S.bint=setInterval(()=>{S.bleft--;if(S.bleft<=0){nextMod();return}t()},1000)}
function modScore(k){const m=MODS[k];let c=0;for(let i=m.s;i<m.e;i++)if(isRight(i))c++;return{c,n:m.e-m.s}}
/* ---------- results ---------- */
function groupBy(key,a,b){const m={};for(let i=a;i<b;i++){const q=Q[i],k=key(q);(m[k]=m[k]||{n:0,c:0}).n++;if(isRight(i))m[k].c++}return m}
function col(p){return p<50?'#0D5EAF':p<75?'#5DADE2':'#2e8b57'}
function bars(m,sub){return Object.entries(m).map(([k,v])=>({k,...v,p:Math.round(100*v.c/v.n)})).sort((a,b)=>a.p-b.p||b.n-a.n).map(b=>`<div class="frow"><div>${esc(b.k)}${sub&&sub[b.k]?`<div class="muted">${esc(sub[b.k])}</div>`:''}</div><div class="bar"><i style="width:${b.p}%;background:${col(b.p)}"></i></div><div><b>${b.p}%</b> <span class="muted">${b.c}/${b.n}</span></div></div>`).join('')}
function weakest(m,k){return Object.entries(m).map(([n,v])=>({n,...v,p:v.c/v.n})).sort((a,b)=>a.p-b.p||b.n-a.n).slice(0,k)}
function focusBar(k){const m=MODS[k],byDom=groupBy(q=>q.dom,m.s,m.e),bySk=groupBy(q=>q.skill,m.s,m.e),dom={};Q.forEach(q=>dom[q.skill]=q.dom);
  const w=weakest(bySk,3).filter(x=>x.p<1);
  return `<div class="card"><h3>${esc(m.name)} Focus Bar</h3><p class="muted">Where to emphasize: red first, then gold.</p>${bars(byDom)}
  <h4>By skill</h4>${bars(bySk,dom)}
  <div class="emph"><b>Emphasize:</b> ${w.length?w.map(x=>esc(x.n)+' ('+x.c+'/'+x.n+')').join('; '):'No weak spots in this module. Keep your pace and accuracy.'}</div></div>`}
function focusHtml(){const byDiff=groupBy(q=>q.diff,0,N);let h='';
  MODS.forEach((m,k)=>h+=focusBar(k));
  if(MODS.length===1){return h+`<div class="card"><h3>Focus Report: By difficulty</h3>${['Easy','Medium','Hard'].map(k=>{const v=byDiff[k];if(!v)return '';const p=Math.round(100*v.c/v.n);return `<div class="frow"><div>${k}</div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div><div><b>${p}%</b> <span class="muted">${v.c}/${v.n}</span></div></div>`}).join('')}</div>`}
  const all=groupBy(q=>q.dom,0,N),allS=groupBy(q=>q.skill,0,N),dom={};Q.forEach(q=>dom[q.skill]=q.dom);
  h+=`<div class="card"><h3>Whole-test Focus Report: By domain</h3>${bars(all)}</div><div class="card"><h3>Whole-test Focus Report: By skill</h3>${bars(allS,dom)}</div>`;
  h+=`<div class="card"><h3>Focus Report: By difficulty</h3>${['Easy','Medium','Hard'].filter(k=>byDiff[k]).map(k=>{const v=byDiff[k],p=Math.round(100*v.c/v.n);return `<div class="frow"><div>${k}</div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div><div><b>${p}%</b> <span class="muted">${v.c}/${v.n}</span></div></div>`}).join('')}</div>`;
  return h}
function results(auto){const R=Q.map((q,i)=>isRight(i)),tot=R.filter(Boolean).length;$('hmod').textContent='Results and Review';
  const ms=MODS.map((m,k)=>{const s=modScore(k);return `<div><div class="muted">${esc(m.name)}</div><h1 style="margin:0">${s.c} / ${s.n}</h1></div>`}).join('');
  $('app').innerHTML=`<div class="card"><div class="kick">${esc(TEST.domain)}</div><h2>Your Results${auto?' (time expired in a module)':''}</h2><div class="scorebox"><div><div class="muted">${esc(TEST.title)}</div><h1 style="margin:0">${tot} / ${N}</h1></div>${ms}<div><div class="muted">Percent correct</div><h1 style="margin:0">${Math.round(100*tot/N)}%</h1></div><div><div class="muted">Time used</div><h1 style="margin:0">${fmt(S.secs)}</h1></div></div>
  <p class="muted">Practice score only; unofficial. Use the focus bars below to decide what to study next.</p>
  <div class="noprint" style="margin-top:14px"><button class="btn alt" onclick="document.getElementById('rv').scrollIntoView()">Go to review</button> <button class="btn alt" onclick="showRev('wrong')">Show incorrect only</button> <button class="btn alt" onclick="showRev('all')">Show all</button></div></div>
  ${focusHtml()}<div id="rv"></div>
  <div class="card noprint" id="export"><h3>Export</h3><p class="muted">Save your results and the full review.</p><button class="btn" onclick="window.print()">Export review as PDF (Print → Save as PDF)</button> <button class="btn alt" onclick="csv()">Download results as CSV</button> <button class="btn alt" onclick="dl()">Download review as HTML</button></div>`;
  showRev('all');window.scrollTo(0,0)}
function lst(t,a){return a&&a.length?`<h4>${t}</h4><ul>${a.map(x=>`<li>${rich(x)}</li>`).join('')}</ul>`:''}
function ordl(t,a){return a&&a.length?`<h4>${t}</h4><ol>${a.map(x=>`<li>${rich(x)}</li>`).join('')}</ol>`:''}
function showRev(f){let h='';Q.forEach((q,i)=>{const a=S.ans[i],ok=isRight(i);if(f==='wrong'&&ok)return;const rv=q.rev;
 const body=lst(q.rw?'Key idea':'Formula',rv.formula)+ordl(q.rw?'Why it is correct':'How to solve it (steps)',rv.steps)+lst('Tip',rv.tip)+lst('Trap',rv.trap)+ordl('How to use Desmos',rv.desmos);
 const chs=q.type==='mc'?'<div class="rchoices">'+q.choices.map((c,k)=>{const L='ABCD'[k];return `<div class="rch ${L===q.ans?'right':''} ${a===L&&!ok?'wrong':''}"><span class="cl">${L}</span><span class="ctext">${rich(c)}</span></div>`}).join('')+'</div>':'';
 const corr=q.type==='mc'?q.ans:(q.disp?rich(q.disp):esc(q.ans.split(';').join(' or ')));
 h+=`<div class="card rev ${ok?'ok':'bad'}"><div><span class="qbadge">${esc(MODS[modOf(i)].name)} · Q${i-MODS[modOf(i)].s+1}</span><span class="pill">${esc(q.skill)}</span>${q.cat.toLowerCase()===q.skill.toLowerCase()?'':`<span class="pill">${esc(q.cat)}</span>`}<span class="pill">${esc(q.diff)}</span>${q.tag?`<span class="otag">${esc(q.tag)}</span>`:''}<span class="pill g">${esc(MODS[modOf(i)].name)}</span></div>
 <p class="ansline"><b>Your answer:</b> ${a?esc(a):'<i>blank</i>'} &nbsp; <b>Correct:</b> ${corr} &nbsp; ${ok?'✓':'✗'}</p>
 ${stemEl(q)}${chs}<div class="sect">${body}</div></div>`});
 $('rv').innerHTML='<h2>Question Review</h2>'+h}
function csv(){let r=[['Q','Skill','Topic','Difficulty','Your answer','Correct','Result']];Q.forEach((q,i)=>{const a=S.ans[i];r.push([i+1,q.skill,q.cat,q.diff,a||'',q.ans.split(';').join(' / '),isRight(i)?'Correct':'Incorrect'])});
 const b=new Blob([r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GreekSAT_'+TEST.id+'_Results.csv';a.click()}
function dl(){const logo=document.querySelector('header img').src;const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(TEST.title)+' Review</title>'+document.querySelector('style').outerHTML+'</head><body><header><div class="brandrow"><img alt="Greek flag" src="'+logo+'"><div class="brand">Greek SAT · '+esc(TEST.title)+'</div></div></header><div class="wrap">'+$('app').innerHTML+'</div></body></html>';const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GreekSAT_'+TEST.id+'_Review.html';a.click()}
function openCalc(){const f=$('calc-frame');if(!f.getAttribute('src'))f.setAttribute('src','https://www.desmos.com/calculator');$('calc-overlay').classList.add('on')}
function closeCalc(){$('calc-overlay').classList.remove('on')}
function openRef(){$('refov').classList.add('on')}
home();
</script></body></html>
