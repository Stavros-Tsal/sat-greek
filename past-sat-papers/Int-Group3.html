<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Full Practice Test · Int-Group3 · October 2026 · Greek SAT</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--crim:#0D5EAF;--gold:#5DADE2;--ink:#1a1a1a;--bg:#faf8f4;--line:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:Jost,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif}
header{background:var(--crim);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:4px solid var(--gold)}
header .brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.5px}
header .mid{font-size:14px;opacity:.95;white-space:nowrap;margin:0 12px}
header .brand{font-size:19px!important;line-height:1.15}
.tools{display:flex;gap:8px;align-items:center}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--crim);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-size:15px;font-weight:500}
.btn.alt{background:#fff;color:var(--crim);border:1.5px solid var(--crim)}
.btn.gold{background:var(--gold)}
.hbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:5px;padding:6px 12px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px}
#timer{font-weight:600;font-size:18px;min-width:70px;text-align:center}
.qbadge{display:inline-block;background:#111;color:#fff;font-weight:600;padding:4px 12px;border-radius:3px;margin-right:10px}
.flagb{background:#fff;border:1px solid #888;border-radius:5px;padding:6px 12px;font-size:14px}.flagb.on{background:#fff3cd;border-color:var(--gold)}
.qimg{width:100%;display:block;margin:14px 0;border:1px solid #eee;background:#fff}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.opt{display:flex;align-items:center;gap:4px}
.optb{width:54px;height:54px;border-radius:50%;border:2px solid #444;background:#fff;font-size:20px;font-weight:600}
.optb.sel{background:var(--crim);color:#fff;border-color:var(--crim)}
.optb.x{opacity:.35;text-decoration:line-through}
.xb{border:0;background:none;font-size:13px;color:#777;text-decoration:underline}
.spr input{font-size:20px;padding:10px;border:2px solid #444;border-radius:6px;width:200px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin:12px 0}
.gq{height:42px;border:1.5px dashed #888;background:#fff;border-radius:4px;font-weight:600;position:relative}
.gq.ans{border-style:solid;background:#e9f3ff}.gq.cur{outline:3px solid var(--crim)}
.gq.fl::after{content:'⚑';position:absolute;top:-6px;right:2px;color:var(--gold);font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}.panel{background:#fff;border-radius:10px;padding:20px;max-width:900px;width:92%;max-height:88vh;overflow:auto}
#calc-panel{width:94%;height:88vh;max-width:1100px;display:flex;flex-direction:column}
#calc-panel iframe{flex:1;border:1px solid #ccc;border-radius:6px}
.bar{height:16px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.frow{display:grid;grid-template-columns:260px 1fr 70px;gap:12px;align-items:center;margin:8px 0;font-size:15px}
.rev{border:1px solid var(--line);border-left:6px solid var(--line)}.rev.ok{border-left-color:#2e8b57}.rev.bad{border-left-color:var(--crim)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:#eee;margin-right:6px}.pill.g{background:var(--gold);color:#fff}
.sect h4{margin:12px 0 4px;color:var(--crim);font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.sect ul{margin:0;padding-left:20px}.sect li{margin:2px 0}
.hide{display:none}.center{text-align:center}.muted{color:#666;font-size:14px}
.stop{border:2px solid #111;padding:12px;margin:14px 0;font-weight:600}
@media print{header,.noprint,.nav{display:none!important}body{background:#fff}.card{break-inside:avoid;border:1px solid #bbb}}

.qtop{display:flex;justify-content:space-between;align-items:center}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #9aa0a6;border-radius:10px;padding:10px 14px;min-height:56px}
.choice:hover{border-color:var(--crim)}
.choice.sel{border-color:var(--crim);background:#EAF4FC;box-shadow:0 0 0 2px var(--crim) inset}
.choice img,.rch img{max-width:calc(100% - 50px);height:auto;display:block}
.cl{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-weight:600;background:#fff}
.choice.sel .cl{background:var(--crim);border-color:var(--crim);color:#fff}
.rchoices{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rch{display:flex;align-items:center;gap:12px;border:1.5px solid #ccc;border-radius:8px;padding:6px 10px;background:#fff}
.rch.right{border-color:#2e8b57;background:#eef8f1}.rch.wrong{border-color:var(--crim);background:#EAF4FC}
.rch.right .cl{background:#2e8b57;color:#fff;border-color:#2e8b57}.rch.wrong .cl{background:var(--crim);color:#fff;border-color:var(--crim)}
.poe{list-style:none;padding-left:0}.poe li{padding:6px 10px;border-left:4px solid #ddd;margin:4px 0;background:#faf8f4}.poe li.best{border-left-color:#2e8b57;background:#eef8f1}
.vocab{margin-top:10px;padding:8px 12px;border:1px solid var(--gold);border-radius:6px;background:#fffaf0}
.modh{margin:26px 0 8px;color:var(--crim);border-bottom:2px solid var(--gold)}
.textstem{font-family:Georgia,serif;font-size:18px;line-height:1.65;margin:14px 0;padding:6px 2px}.textstem p{margin:0 0 12px}.ctext{font-size:17px;line-height:1.45}.otag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:#fff3cd;border:1px solid var(--gold);margin-right:6px}
.choices{gap:0;margin-top:10px}
.choice{border:0;border-bottom:1px solid #d9d9d9;border-radius:0;background:transparent;box-shadow:none!important;min-height:44px;padding:12px 8px;gap:10px;align-items:center}
.choice:hover{background:#f5f1ea;border-color:#d9d9d9}
.choice.sel{background:#E3F0FA;border-color:#d9d9d9;box-shadow:none}
.cl,.choice.sel .cl,.rch .cl,.rch.right .cl,.rch.wrong .cl{flex:0 0 auto;width:auto;height:auto;border:0;border-radius:0;background:transparent!important;color:#111!important;font-weight:700;font-size:18px;display:inline}
.cl::after{content:")"}
.choice.sel .cl{color:var(--crim)!important}
.rch{border:0;border-bottom:1px solid #e3e3e3;border-radius:0;background:transparent}
.rch.right{background:#eef8f1}.rch.wrong{background:#EAF4FC}
.brandrow{display:flex;align-items:center;gap:12px}.brandrow img{height:44px;width:auto;background:#fff;border-radius:6px;padding:2px}
.choice img,.rch img{mix-blend-mode:multiply}
/* math */
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 2px;font-size:.92em;line-height:1.2}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span+span{padding:0 3px}
.rt{border-top:1.5px solid currentColor;padding:0 2px}
.op{padding:0 .22em}
.m i{font-family:"Cambria Math",Georgia,serif}
.m .tx{font-style:normal;font-family:inherit}

.textstem .m,.ctext .m,.sect .m,.stop .m{font-size:1.04em}
.textstem{font-family:Jost,Arial,sans-serif;font-size:18px;line-height:1.7}
.textstem .fig{display:block;max-width:100%;margin:6px auto 14px}
.fr{vertical-align:middle}
.sect li .m,.sect ol li .m{font-size:1em}
.sect ol{margin:0;padding-left:22px}.sect ol li{margin:4px 0}
.ansline{margin:6px 0 4px}
.kick{font-size:12px;letter-spacing:.16em;color:var(--crim);font-weight:600;text-transform:uppercase}
.scorebox{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0}
.emph{border-left:5px solid var(--gold);background:#fffaf0;padding:10px 14px;margin:14px 0;border-radius:4px}
.hbadge{background:#fff;color:var(--crim);font-weight:600;font-size:12px;padding:3px 10px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase}
.spr input{font-family:inherit}
.textstem .qimg{width:auto;max-width:min(100%,640px);margin:10px auto;display:block}
@media print{.overlay{display:none!important}}
.ov{border-top:1.3px solid currentColor;padding-top:0}

/* Test Ninjas question layout */
.nq{background:#fff;border:1px solid #cfcfcf;border-radius:4px;padding:0 0 18px;max-width:760px;margin:0 auto 16px}
.nqh{display:flex;align-items:stretch;border-bottom:1px solid #fff}
.nqn{background:#111;color:#fff;font:600 15px Jost,Arial,sans-serif;min-width:40px;display:flex;align-items:center;justify-content:center}
.nqs{flex:1;background:#dedede;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font:600 10.5px Jost,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#333}
.nqs span:last-child{color:#777;font-weight:500}
.nqb{padding:18px 34px 0}
.nqfig{border:1px solid #e3e3e3;background:#fbfbfb;padding:10px;margin:0 0 16px;text-align:center}
.zbtn{display:block;margin:8px auto 0;border:1px solid #bbb;background:#fff;border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}.zbtn:hover{background:#eee}.nqfig img{cursor:zoom-in;max-width:100%;max-height:340px;height:auto;display:inline-block;mix-blend-mode:multiply}
.nqstem{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55;color:#111;margin:0 0 14px}
.nqch{display:flex;flex-direction:column;gap:2px}
.nqc{display:flex;gap:12px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:3px;padding:5px 8px;font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:#111;cursor:pointer}
.nqc:hover{background:#f3efe7}.nqc.sel{background:#E3F0FA;outline:1.5px solid var(--crim)}
.nqc b{font-weight:600;min-width:26px}
.nqspr{border:1px solid #bbb;border-radius:3px;padding:10px 14px;margin-top:6px;max-width:420px}
.nqspr label{display:block;font:600 10.5px Jost,Arial,sans-serif;letter-spacing:.1em;color:#555;margin-bottom:8px}
.nqspr input{width:100%;border:0;border-bottom:1.5px solid #333;font:20px 'Source Serif 4',Georgia,serif;padding:4px 2px;background:transparent;outline:none}
.nqspr small{display:block;margin-top:6px;color:#777;font:12px Jost,Arial,sans-serif}
@media(max-width:600px){.nqb{padding:14px 16px 0}}
.nqflag{background:transparent;border:0;cursor:pointer;font:600 11px Jost,Arial,sans-serif;letter-spacing:.06em;color:#333;text-transform:uppercase;padding:0 0 0 14px}
.nqflag.on{color:var(--crim)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:14px 0}
.qc{position:relative;border:1.5px solid #bbb;background:#fff;border-radius:6px;padding:10px 0;font:600 15px Jost,Arial,sans-serif;cursor:pointer;color:#555}
.qc.ans{background:#e9f4ee;border-color:#2e8b57;color:#1d5c3a}.qc.cur{outline:2.5px solid #111}
.qc.fl::after{content:"\2691";position:absolute;top:-8px;right:-4px;color:var(--crim);font-size:17px}
.qleg{display:flex;gap:16px;flex-wrap:wrap;font:13px Jost,Arial,sans-serif;color:#555;margin:6px 0}
.qleg i{display:inline-block;width:14px;height:14px;border:1.5px solid #bbb;border-radius:3px;vertical-align:-2px;margin-right:5px}
.rwp{border:1px solid #ddd;border-left:5px solid var(--gold);background:#fcfbf8;border-radius:6px;padding:14px 16px;margin:0 0 16px;line-height:1.55;font-size:16px}.rwp u{text-decoration:underline}
.brkbox{text-align:center;border:1px solid #e3e3e3;background:#f6faff;border-radius:10px;padding:16px;margin:16px 0}.brkt{font-size:56px;font-weight:700;color:#0D5EAF;font-variant-numeric:tabular-nums}
#zoomov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:none;flex-direction:column}#zoomov.on{display:flex}
#zoomov .zbar{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:#111}#zoomov .zbar button{border:0;border-radius:6px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;background:#fff}
#zoomov .zscroll{flex:1;overflow:auto;text-align:center;padding:12px}#zoomov img{background:#fff;max-width:none;width:90vw;height:auto;transition:width .15s}
</style></head><body>

<script>
const TEST={"id": "OCT26FULL", "title": "Digital SAT Full Practice Test · Int-Group3 · October 2026", "domain": "Digital SAT Reading & Writing + Math · Full-Length", "kindLabel": "FULL-LENGTH TEST", "minutes": 35, "note": "Reading & Writing (2 modules) followed by Math (2 modules). Questions transcribed from Digital SAT screenshots; every explanation, key idea, formula and tip is written by Greek SAT. Questions marked in the review were partly cut off in the screenshots and have been completed or reconstructed.", "questions": [{"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["doubts about", "misunderstandings of", "contributions to", "imitations of"], "rev": {"formula": ["The blank must describe why someone receives an award for honoring the arts."], "steps": ["The fellowship honors exceptional artists, so Tanaka was chosen for what he gave to the arts.", "\"contributions to\" fits; the other three are negative."], "tip": ["Predict the word before looking at the choices."], "trap": ["Picking a word that sounds academic but has a negative meaning."], "desmos": []}, "p": "The National Heritage Fellowship was created to honor exceptional folk and traditional artists in the United States. One artist who received the fellowship is taiko drummer Seiichi Tanaka. Tanaka was chosen for his lifetime ____ the arts.", "n": 1, "id": "9de1de23", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["Fabricating", "Adapting", "Isolating", "Incorporating"], "rev": {"formula": ["The technician tests components one by one until the specific faulty part is identified."], "steps": ["Testing one component at a time separates the faulty part from the rest.", "\"Isolating\" the source of a malfunction matches that process."], "tip": ["Use the clue after the colon: it explains the blank."], "trap": ["Choosing \"Fabricating\" or \"Incorporating\", which describe building rather than finding."], "desmos": []}, "p": "____ the source of a malfunction in a complex electrical system can be a painstaking, time-consuming process: a repair technician may need to test each individual component one by one until the specific part causing the problematic behavior is identified.", "n": 2, "id": "6bebcd68", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Contrast clue", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "D", "choices": ["idealistic", "predictable", "timeworn", "innovative"], "rev": {"formula": ["\"Though most studies ... usually ... instead chosen\" signals a contrast with the usual approach."], "steps": ["Most studies focus on people above sea level.", "These researchers study people below sea level instead, so their path is new: \"innovative\"."], "tip": ["Contrast words (though, instead) tell you the blank is the opposite of \"usual\"."], "trap": ["Choosing \"predictable\" or \"timeworn\", which match the usual approach rather than contrast with it."], "desmos": []}, "p": "Though most studies of the effect of altitude on blood chemistry usually concentrate on people who live above sea level, researchers Suleiman A. Al-Sweedan and Moath Alhaj have instead chosen the ____ path in their recent work of studying the blood of people who live below sea level, in locations such as the California towns of Salton Sea Beach and Imperial.", "n": 3, "id": "a5a3329a", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "As used in the text, what does the word \"traces\" most nearly mean?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "A", "choices": ["Indications", "Debris", "Copies", "Recollections"], "rev": {"formula": ["Replace \"traces\" with each choice and keep the sentence meaning."], "steps": ["The fog hides \"traces\" (visible signs) of familiar landscapes.", "\"Indications\" means visible signs, so it fits."], "tip": ["Test every choice in the sentence."], "trap": ["Choosing \"Debris\" because \"traces\" can mean small remains in other contexts."], "desmos": []}, "p": "The following text is adapted from John Matheus's 1925 short story \"Fog.\"\n\nThe fog extended its tentacles over city and river, gradually obliterating traces of familiar landscapes. At five-thirty the old Panhandle bridge, supported by massive sandstone pillars, stalwart, as when erected fifty years before to serve a generation now passed behind the portals of life, had become a spectral outline against the sky.", "n": 4, "id": "6c4c0eed", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Contrast clue", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["affordable", "uncommon", "sufficient", "superficial"], "rev": {"formula": ["\"While once ____ ... cannot provide enough protection\" sets up a contrast with \"enough\"."], "steps": ["\"Cannot provide enough\" is the present situation.", "The past situation was the opposite: such training was once sufficient."], "tip": ["\"While once ...\" signals that the past is the opposite of the present."], "trap": ["Choosing \"superficial\", which repeats the negative idea instead of contrasting it."], "desmos": []}, "p": "While once ____, basic computer security training that only teaches recognition of obvious scams cannot provide enough protection against today's sophisticated fake emails, which employ such subtle deception techniques that many organizations now require their staff to complete comprehensive cybersecurity education programs.", "n": 5, "id": "ed93ab7e", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best states the main purpose of the text?", "cat": "Main purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "C", "choices": ["To depict the man's insistence on meeting despite the inconvenience of traveling on horseback", "To compare the upcoming meeting to a far more serious experience from earlier in the man's life", "To portray the man's anxiety about the meeting as reflected by his physical state and demeanor", "To contrast the man's desire to attend the meeting with his awareness of the risk involved in attending it"], "rev": {"formula": ["Look at what the details do: breathing hard, sweating, a tense expression."], "steps": ["The text says his hard breathing is not from galloping.", "It compares his expression to a man approaching a dud shell: tense speculation.", "So the details show his anxiety through his body and manner."], "tip": ["Name what the details show, not just what happens."], "trap": ["Choosing the choice that mentions the \"risk\" (D): the text never says the man chooses between desire and risk."], "desmos": []}, "p": "The following text is adapted from the 1940 novel [[i]]The Hamlet[[/i]] by William Faulkner. In rural Mississippi, a man is riding a horse toward the residence of someone he intends to meet with about a business matter.\n\nHe was breathing hard but not because he had been galloping. On the contrary, since he had approached near enough to his destination to believe he could have seen smoke if there had been smoke, he had ridden slower and slower. Nevertheless he now sat the horse before the gap in the fence, breathing hard enough through his nose and even sweating a little, looking at the sagging broken-backed cabin set in its inevitable treeless and grassless plot and weathered to the color of an old bee-hive, with that expression of tense and rapid speculation of a man approaching a dud howitzer [artillery] shell.", "n": 6, "id": "304d8ab9", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice best describes the main purpose of the text?", "cat": "Main purpose", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "B", "choices": ["To compare career opportunities in modern forestry and explain which positions offer the best job security", "To highlight career opportunities in modern forestry and describe how they integrate scientific knowledge and hands-on work", "To explain technological advances in modern forestry and demonstrate how they've transformed traditional practices", "To analyze environmental challenges facing forests and describe how modern professionals address these problems"], "rev": {"formula": ["The text names several forestry jobs and shows each mixes science with practical work."], "steps": ["Arborists, technicians and ecologists are all described.", "The first sentence frames them as careers that integrate science with hands-on work."], "tip": ["Match the choice to the first and last sentences."], "trap": ["Choosing A (no comparison of job security) or C (no technology is discussed)."], "desmos": []}, "p": "Modern forestry offers diverse career opportunities that integrate scientific knowledge with hands-on environmental work. Arborists assess tree health and perform maintenance such as pruning to promote safety and prevent problems. Forestry technicians collect data on growth rates and biodiversity in the wild. Forest ecologists conduct field research and analyze ecosystems to understand how forests respond to changes in weather patterns. With this blend of scientific understanding and practical application, forestry professionals address a variety of complex environmental challenges.", "n": 7, "id": "54104bd6", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best describes the function of the underlined portion in the text as a whole?", "cat": "Function of a sentence part", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "D", "choices": ["It presents a component of the researchers' methodology that enabled them to convert all prices to the same currency for comparison.", "It describes an aspect of the study design that allowed the researchers to see how buyers in a given country reacted to pricing strategies rarely used in that country.", "It discusses how the researchers controlled for the possibility that pricing strategies could change depending on the goods being sold.", "It explains a step that the researchers took to ensure that their data accurately reflected sellers' intended prices."], "rev": {"formula": ["The website converts prices to the buyer's currency, which would distort what sellers chose; the underlined step avoids that."], "steps": ["\"Although the website will convert prices...\" names the problem.", "Using VPNs to see prices in each country's own currency avoids the conversion.", "So the step makes the data reflect sellers' intended prices."], "tip": ["Ask: what problem does this step solve?"], "trap": ["Choosing A, which says the opposite (they avoided conversion)."], "desmos": []}, "p": "Using data from a global consumer-to-consumer retail website, Alfio Ventura, Eve Sarah Troll, and colleagues evaluated whether pricing approaches vary across countries. Although the website will convert prices to the buyers' home currency, most sellers target local markets, so [[u]]the researchers used virtual private networks to collect prices in each country's predominant currency.[[/u]] They found some striking inter-country differences in pricing strategy, such as the fact that 84.0% of sellers in Puerto Rico price their goods in whole numbers (e.g., \\$17) but only 0.3% of sellers in Indonesia do.", "n": 8, "id": "41df648e", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "According to the text, how can the color olo be seen?", "cat": "Reading comprehension", "skill": "Central Ideas and Details", "dom": "Information and Ideas", "ans": "C", "choices": ["By activating both the long and short cones in the retina", "By activating the long, medium, and short cones in the retina", "By activating only the medium cones in the retina", "By activating only the long cones in the retina"], "rev": {"formula": ["Find the sentence that directly states how olo can be seen."], "steps": ["\"Olo can only be seen by activating the medium cones alone.\""], "tip": ["Copy the key phrase from the text, then match it."], "trap": ["Choosing B: natural vision activates all three cone types, and olo cannot be seen that way."], "desmos": []}, "p": "James Fong and his team claim to have discovered a new color, which they named olo. Olo is a very saturated blue-green color that can't be seen with the human eye under natural conditions. In the human eye, long, medium, and short cones in the retina help sense bright light and color. Olo can only be seen by activating the medium cones alone. Fong and team activated these cones by using a targeted laser technology to stimulate just the medium cone cells.", "n": 9, "id": "1ce03cfe", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best states the main idea of the text?", "cat": "Main idea", "skill": "Central Ideas and Details", "dom": "Information and Ideas", "ans": "C", "choices": ["According to a team of biologists, black garden ants build larger nests when exposed to a harmful fungus than they otherwise would build.", "A study noted that black garden ants exposed to a harmful fungus tend to dig longer tunnels in their nests instead of reducing the centrality of the nest's chambers.", "A study found that black garden ants deliberately modify their nest architecture to keep a harmful fungus from spreading.", "A team of scientists noticed that fungal pathogen exposure causes black garden ants to abandon their existing nest structures."], "rev": {"formula": ["The main idea covers the whole text: ants change nest design to limit fungal spread."], "steps": ["Ants modified excavation patterns and reduced centrality.", "The changes were not random but arranged to minimize fungal spread."], "tip": ["A main-idea answer is broad but still accurate."], "trap": ["Choosing A or B, which state details the text does not give or contradict."], "desmos": []}, "p": "Biologist Nathalie Stroeymeyt and her team found that black garden ants demonstrated a sophisticated form of \"architectural immunity.\" When confronted with fungal pathogens, these ants modified their excavation patterns in several strategic ways to speed up nest growth, increase spacing between entrances, and reduce the centrality of key chambers (containing the queen, food, or nursery). The team noted that these architectural modifications weren't random but specifically arranged to minimize fungal spread.", "n": 10, "id": "829a51be", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice most effectively uses data from the graph to complete the statement?", "cat": "Reading a graph", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "C", "choices": ["the same number of volcanoes that have been active since 1800 as Portugal has.", "no volcanoes that have been active since 1800.", "more volcanoes that have been active since 1960 than Portugal has.", "fewer volcanoes that have been active since 1960 than Portugal has."], "rev": {"formula": ["Compare the two bars for the same category."], "steps": ["Active since 1960: Ecuador is about 11 and Portugal about 1.", "So Ecuador has more volcanoes active since 1960 than Portugal."], "tip": ["Check the legend to see which bar belongs to which country."], "trap": ["Mixing up the shades of the bars."], "desmos": []}, "p": "A student is collecting data about countries with volcanoes that have been active in the time since 1800 and in the time since 1960. The student records that Ecuador has ____", "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAVQAAAF8CAIAAAAfD9S5AACajUlEQVR42u19Z1wT2fd3eoOQQOi9F+kgIKi e is a direct comparison of the claim's two conditions."], "trap": ["Choosing B: variation in SOC is not the same as higher SOC."], "desmos": []}, "p": "Cover crops, such as teff, are planted by many farmers between main growing seasons. While these crops are known for reducing drought stress, Christopher Poeplau and his coauthor argued in a 2015 study that cover crops' role in supporting soil carbon sequestration deserves more attention. Cover crops remove carbon dioxide (CO₂) from the air and convert it to organic compounds; some of these compounds are stored in the soil as soil organic carbon (SOC), which contributes to the buildup of SOC stocks over time. Based on data from numerous farm fields, Poeplau and his coauthor concluded that cover crops contribute meaningfully to soil carbon sequestration and, if widely adopted, could help offset agricultural emissions of atmospheric CO₂ and other greenhouse gases.", "n": 12, "id": "c486c1a9", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most effectively uses data from the graph to complete the assertion?", "cat": "Reading a graph", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "A", "choices": ["those that filed Form 4720 in 2003 because they failed to meet the minimum charitable distribution requirement collectively paid a larger percentage of the total penalty assessed that year than those that filed Form 4720 in 2005 for the same reason.", "those that filed Form 4720 because they engaged in self-dealing paid an increasing percentage of the total penalty each year from 2003 to 2005.", "those that filed Form 4720 because they had excess holdings in a business enterprise paid, on average, a larger penalty than those that filed Form 4720 because they engaged in self-dealing.", "those that filed Form 4720 in 2005 because they engaged in self-dealing collectively paid a larger percentage of the total penalty assessed that year than those that filed Form 990 but also : 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most effectively uses a quotation from the first act of [[i]]The Vortex[[/i]] to illustrate the underlined claim?", "cat": "Quoting to illustrate", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "D", "choices": ["Pawnie exclaims his distaste for a particular lampshade, to which Helen responds, \"I gave it to [Florence] last Christmas.\"", "Helen comments that the home's decorations are not offensive to her tastes, to which Pawnie sarcastically replies, \"Dear Helen, you're such a loyal friend.\"", "Pawnie suggests that Clara would prefer him to leave the room, to which Clara responds, \"No, Pawnie, I should never expect the least consideration from you.\"", "Helen says she wonders about Florence's future, to which Pawnie replies, \"My dear, I'm far too occupied in wondering what's going to happen to me to worry about other people.\""], "rev": {"formula": ["The claim: other characters consider Pawnie a thoughtless person."], "steps": ["Look for a quotation in which Pawnie shows no concern for others.", "In D he says he is too busy worrying about himself to care about other people."], "tip": ["The quote must show the idea in the claim, not just mention the characters."], "trap": ["Choosing C: Clara's reply says she would not expect consideration from him, but the choice shows her view, not Pawnie's behavior in the act."], "desmos": []}, "p": "[[i]]The Vortex[[/i]] is a 1924 satirical play by Noël Coward. During the first act of the play Pawnie, Clara, and Helen are at the home of Florence, whose arrival they are awaiting. [[u]]In this act, Coward conveys the idea that other characters consider Pawnie to be a thoughtless person.[[/u]]", "n": 14, "id": "d42748f2", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most logically completes the text?", "cat": "Logical completion", "skill": "Inferences", "dom": "Information and Ideas", "ans": "C", "choices": ["implying his belief that both figurative and abstract art can portray the complexity of tribal identity.", "suggesting that even when practiced by Indigenous artists, abstract forms of art are ill-suited to portraying tribally specific content.", "transmitting his culture through particularities of content rather than through a tribally specific painting technique.", "casting doubt on the feasibility of developing a new style of painting grounded in traditionally figurative art forms."], "rev": {"formula": ["Monkman uses a European style (figurative) but takes his subject matter from pre-colonial tribal traditions."], "steps": ["So the culture comes through the content, not through the style.", "Choice C states this contrast."], "tip": ["Stay within what the passage says about Monkman."], "trap": ["Choosing B: the passage does not claim abstract art is ill-suited to Indigenous content."], "desmos": []}, "p": "Muscogee painter Starr Hardridge often eschews the European tradition of figurative painting, with its proportionality of human form and depth between foreground and background; instead, he assembles compositions out of abstract motifs common in the traditional beadwork and graphic art of his own tribe, thus ensuring cultural continuity. Cree painter Kent Monkman, on the other hand, works in the European figurative mode; however, he draws his subject matter from cultural traditions that predate the European colonization of the lands of his own tribe, thereby ____", "n": 15, "id": "c7b13c26", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Unnecessary punctuation", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "A", "choices": ["areas", "areas, who", "areas; they", "areas,"], "rev": {"formula": ["The subject \"people in El Paso and the surrounding areas\" is not interrupted, so no punctuation is needed before the verb."], "steps": ["\"... people in El Paso and the surrounding areas must set their clocks.\"", "Any comma, semicolon or extra pronoun breaks the subject from its verb."], "tip": ["Never separate a subject from its verb with a single comma."], "trap": ["Adding a comma because the sentence feels long."], "desmos": []}, "p": "Home to the city of El Paso, the far western corner of Texas follows Mountain time rather than Central time. As a result, people in El Paso and the surrounding ____ must set their clocks one hour behind those in the rest of the state.", "n": 16, "id": "d6a10588", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb tense", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "D", "choices": ["rose", "will rise", "had risen", "rises"], "rev": {"formula": ["A fact about a mountain that is true now uses the simple present tense."], "steps": ["The sentence states a permanent fact: \"ranks\" is present tense.", "So the verb should be present: \"rises\"."], "tip": ["Match the tense of nearby verbs and think about whether the fact is permanent."], "trap": ["Choosing \"rose\" because it sounds natural in narration."], "desmos": []}, "p": "Mount Meru ranks among the world's tallest mountains. Specifically, the peak's highest point ____ 14,977 feet above sea level.", "n": 17, "id": "af9964ff", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Modifier placement", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "A", "choices": ["this activity effectively uncovers potential problems early,", "teams effectively uncover potential problems early with this activity,", "potential problems are effectively uncovered by this activity early,", "effective uncovering of potential problems by the team in this activity is done early,"], "rev": {"formula": ["\"Despite its apparent pessimism,\" must be followed by the noun it describes: the activity."], "steps": ["\"Its\" refers to the premortem activity.", "Only A puts \"this activity\" right after the comma."], "tip": ["After an introductory phrase, the next noun is what the phrase modifies."], "trap": ["Choosing B, which makes \"teams\" the pessimistic thing."], "desmos": []}, "p": "A premortem is an exercise in which teams imagine their project has already failed, then brainstorm possible reasons for that failure. Despite its apparent pessimism, ____ prompting teams to proactively develop mitigation strategies during the planning stage. As a result, the project is more likely to succeed.", "n": 18, "id": "6d3298c3", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Dashes", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "C", "choices": ["box,", "box", "box—", "box:"], "rev": {"formula": ["The dash after \"made\" opens an interruption; it needs a matching dash to close."], "steps": ["\"The modifications she made—adding a stiffened leather sole and hardened toe box—began ...\"", "So the closing punctuation must be a dash."], "tip": ["Dashes (like parentheses) come in pairs."], "trap": ["Using a comma to close a dash."], "desmos": []}, "p": "To more easily balance the weight of her body on her toes while performing the demanding pointe work that became increasingly common in early 20th-century ballet, internationally known ballerina Anna Pavlova redesigned her pointe shoes. The modifications she made—adding a stiffened leather sole and hardened toe ____ began the modernization of ballet's iconic footwear.", "n": 19, "id": "73ef28ef", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Colon", "skill": "Boundaries", "dom": "Standard English Conventions", "ans": "A", "choices": ["threefold: to", "threefold; to", "threefold to", "threefold. To"], "rev": {"formula": ["A colon after a complete clause introduces a list or explanation."], "steps": ["\"The purpose ... was threefold\" is a complete clause.", "The three infinitives that follow explain \"threefold\", so use a colon."], "tip": ["Colon = \"here it comes\" after a complete clause."], "trap": ["Using a semicolon, which needs a complete clause on both sides."], "desmos": []}, "p": "Archaeological evidence indicates that board games have existed in human societies for at least five millennia, with examples discovered in the tombs of ancient Egypt and the ruins of Mesopotamia. The purpose of these ancient games was ____ provide entertainment during leisure time, to reflect cultural beliefs, and to develop strategic thinking skills among players.", "n": 20, "id": "a616d08b", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "cat": "Verb form", "skill": "Form, Structure, and Sense", "dom": "Standard English Conventions", "ans": "B", "choices": ["are focused", "focusing", "have focused", "focus"], "rev": {"formula": ["The sentence already has the main verb \"are likely\"; the blank needs a modifier, not another verb."], "steps": ["\"Certain approaches focusing on quantum collective phenomena ... are likely to face significant challenges.\"", "The participle \"focusing\" modifies \"approaches\"."], "tip": ["Find the main verb first; then decide whether the blank needs another verb."], "trap": ["Choosing \"focus\" or \"have focused\", which create a second main verb."], "desmos": []}, "p": "Theoretical physicists have begun to develop novel methods for detecting dark matter. Certain approaches ____ on quantum collective phenomena, like phonons in crystals or excitations in superfluid helium, are likely to face significant challenges, acknowledges physicist Kathryn Zurek, unless researchers can reduce background processes that might mimic the signals they're attempting to detect.", "n": 21, "id": "d8c21a7f", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "C", "choices": ["In other words,", "In conclusion,", "Similarly,", "As a result,"], "rev": {"formula": ["The two sentences give parallel examples: humans inherit traits and cats inherit traits."], "steps": ["Both sentences describe inheritance from parents.", "\"Similarly,\" links two parallel ideas."], "tip": ["Decide the relationship: parallel, contrast, cause or example."], "trap": ["Choosing \"As a result,\" because the second sentence is not caused by the first."], "desmos": []}, "p": "Humans inherit specific physical traits (like having blue or hazel eyes) from their parents. ____ cats inherit specific physical traits (like having brown or white fur) from their parents.", "n": 22, "id": "e8eb1751", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "Which choice completes the text with the most logical transition?", "cat": "Transitions", "skill": "Transitions", "dom": "Expression of Ideas", "ans": "B", "choices": ["Nevertheless,", "Specifically,", "In conclusion,", "Alternatively,"], "rev": {"formula": ["The second sentence explains in detail how endophytes act as a defense mechanism."], "steps": ["The first sentence says endophytes serve as a defense mechanism.", "The next sentence specifies how: they fight off diseases and boost immunity."], "tip": ["\"Specifically,\" introduces more precise detail."], "trap": ["Choosing \"Nevertheless,\" when there is no contrast."], "desmos": []}, "p": "Scientists studying forest restoration have discovered that trees depend on complex partnerships with microscopic organisms for survival. The researchers found that special fungi called endophytes live inside tree leaves and serve as a defense mechanism. ____ these endophytes help by fighting off diseases and boosting the tree's immune system.", "n": 23, "id": "654eed8e", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "The student wants to introduce pistol shrimp to an audience unfamiliar with these crustaceans. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "B", "choices": ["Some crustaceans use a specialized claw to create high-speed water jets and a bubble that stuns the small fish they prey on.", "Pistol shrimp are small marine creatures that use a specialized oversized claw to generate shock waves powerful enough to stun small fish.", "Pistol shrimp are preyed on by small marine crustaceans that create high-speed water jets to stun their prey.", "Pushing water through a narrow groove at extreme speeds, the snapping shut of the shrimp's claw sets the shock-wave hunting process in motion."], "rev": {"formula": ["To introduce an unfamiliar subject, name it and say what it is and what it does."], "steps": ["B names pistol shrimp, says they are small marine creatures, and states their key ability.", "A does not name them; C reverses who preys on whom; D skips the introduction."], "tip": ["Match the goal: introduce = name + basic description."], "trap": ["Choosing A, which never mentions pistol shrimp."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Pistol shrimp are small marine crustaceans that hunt using a specialized oversized claw.\n• When the claw snaps shut rapidly, it pushes water through a narrow groove at extreme speeds.\n• This high-speed water jet creates a bubble that pops forcefully near the shrimp's prey.\n• The popping bubble generates shock waves powerful enough to stun small fish.", "n": 24, "id": "cf4b91c5", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "The student wants to provide an example of one of Catlett's sculptures. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "A", "choices": ["The sculpture [[i]]Rejecting Injustice[[/i]] was created by celebrated artist Elizabeth Catlett in 2003.", "Artist Elizabeth Catlett is best known for creating sculptures and prints that explore the Black experience.", "The print [[i]]Survivor[[/i]] was created by celebrated artist Elizabeth Catlett in 1983.", "Elizabeth Catlett, a celebrated artist, was born in 1915."], "rev": {"formula": ["The goal asks for a specific sculpture."], "steps": ["[[i]]Rejecting Injustice[[/i]] is the only sculpture named in the notes.", "[[i]]Survivor[[/i]] is a print, not a sculpture."], "tip": ["Check the exact word in the goal: sculpture vs print."], "trap": ["Choosing C, which is an example of a print."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Elizabeth Catlett (1915–2012) was a celebrated African American artist.\n• She is best known for creating sculptures and prints that explore the Black experience.\n• [[i]]Rejecting Injustice[[/i]] is a 2003 sculpture by Catlett.\n• [[i]]Survivor[[/i]] is a 1983 print by Catlett.", "n": 25, "id": "ade46004", "rw": 1}, {"diff": "Easy", "type": "mc", "q": "The student wants to emphasize the 2020 population of Tlaxcoapan. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "cat": "Rhetorical synthesis", "skill": "Rhetorical Synthesis", "dom": "Expression of Ideas", "ans": "B", "choices": ["As a municipality in Hidalgo, Tlaxcoapan is responsible for providing public services to its population.", "In 2020, the municipality of Tlaxcoapan had a population of 28,626.", "As of 2020, Tlaxcoapan was one of 84 municipalities in Hidalgo, Mexico.", "Home to 26,758 people, the governmental region was responsible for providing street lighting to its population in 2010."], "rev": {"formula": ["The goal asks for the 2020 population figure."], "steps": ["Only B gives the 2020 population: 28,626.", "D uses the 2010 population."], "tip": ["Underline the key detail the goal asks for, then find it."], "trap": ["Choosing D, which uses the 2010 number."], "desmos": []}, "p": "While researching a topic, a student has taken the following notes:\n• Tlaxcoapan is a municipality in the state of Hidalgo, Mexico.\n• Municipalities are governmental regions responsible for providing many public services to their residents.\n• One service they provide is street lighting.\n• Tlaxcoapan's population was 28,626 in 2020.\n• Its population was 26,758 in 2010.\n• Hidalgo is divided into 84 municipalities.", "n": 26, "id": "fbad42a7", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "A", "choices": ["interplay", "resolution", "neglect", "misinterpretation"], "rev": {"formula": ["The variables \"may affect each other\"; the blank names that mutual effect."], "steps": ["\"it is this interplay of factors in particular that makes farm management challenging.\"", "\"Interplay\" means mutual influence."], "tip": ["Use the clause \"how they may affect each other\" as your clue."], "trap": ["Choosing \"resolution\" because it sounds formal."], "desmos": []}, "p": "Weather patterns, market trends, input costs, labor availability, equipment maintenance, and biological cycles are all variables that farmers must consider separately and in terms of how they may affect each other, and it is this ____ of factors in particular that makes successful farm management so challenging.", "n": 27, "id": "2561479a", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "D", "choices": ["liability", "overhead", "staffing", "throughput"], "rev": {"formula": ["The text describes moving goods quickly so trucks are filled in minutes."], "steps": ["To maximize the amount of goods processed in a given time, centers use fast systems.", "\"Throughput\" means volume processed over time."], "tip": ["Identify what the described systems improve."], "trap": ["Choosing \"overhead\" or \"staffing\", which are costs, not output."], "desmos": []}, "p": "To maximize ____, package distribution centers employ advanced scheduling systems and strategic staging areas that allow for goods received from warehouses to be immediately transferred to trucks for delivery to their final destinations. Some centers are so efficient that even the largest delivery trucks can be filled in a matter of minutes.", "n": 28, "id": "aedcc982", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "C", "choices": ["anomalies", "optimizations", "parameters", "predictions"], "rev": {"formula": ["The algorithms process \"quantifiable inputs (e.g., demand patterns and capacity constraints)\"."], "steps": ["The blank names the variables that influence production schedules.", "\"Parameters\" are the measurable inputs of a problem."], "tip": ["The parenthetical example defines the blank."], "trap": ["Choosing \"optimizations\", which would be a result of the algorithm, not an input."], "desmos": []}, "p": "Researchers have developed algorithms that take into account how various ____ influence production schedules, allowing rapid solution generation for manufacturing planning problems. The algorithms help identify efficient production schedules by processing those quantifiable inputs (e.g., demand patterns and capacity constraints) without exhaustively testing all possible scenarios.", "n": 29, "id": "3d23eaac", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice completes the text with the most logical and precise word or phrase?", "cat": "Vocabulary in context", "skill": "Words in Context", "dom": "Craft and Structure", "ans": "B", "choices": ["exonerations", "admonitions", "obfuscations", "venerations"], "rev": {"formula": ["The portrayals of powerful heroines are \"unflattering\"; Jean Grey's story shows \"the corrupting influence of power\"."], "steps": ["The portrayals warn about what power can do.", "\"Admonitions\" are warnings."], "tip": ["Look for the tone: the examples are cautionary."], "trap": ["Choosing \"venerations\" (worship), which conflicts with \"unflattering\"."], "desmos": []}, "p": "The Invisible Girl's ability to turn invisible is illustrative of the lamentably lackluster powers bestowed on many female superheroes, but even those with more formidable powers have been subject to unflattering portrayals that often serve as ____: as the Phoenix, Jean Grey loses control of a cosmic force and destroys an entire planet, showing the corrupting influence of power.", "n": 30, "id": "8b9dab22", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best describes the function of the underlined sentence in the text as a whole?", "cat": "Function of a sentence", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "B", "choices": ["It acknowledges an exception to the pattern described in the first sentence of the text.", "It describes a natural phenomenon that is explained later in the text.", "It discusses a natural occurrence that leads to the consequences explained later in the text.", "It presents a research finding that challenges the view mentioned in the first sentence of the text."], "rev": {"formula": ["The underlined sentence states what happens to the material; the next sentences explain why."], "steps": ["\"Material ... follows a narrow arc trajectory back to the Sun's surface\" is the pattern.", "Later the text explains that the speeds are not enough to escape the Sun's gravity and magnetic field."], "tip": ["Ask what the sentence does: describe, explain, contradict, give an example."], "trap": ["Choosing D, because the text does not mention an opposing view."], "desmos": []}, "p": "Research on minor solar eruptions in magnetically quiet regions reveals an interesting pattern. [[u]]Material expelled during these events follows a narrow arc trajectory back to the Sun's surface.[[/u]] High-resolution images show these eruptions produce thin streams of hot gas moving at speeds between 55 and 200 kilometers per second. Although these are impressive velocities, they are not sufficient to overcome the confining forces of the Sun's gravity and magnetic field, so the material is pulled back down.", "n": 31, "id": "19bdb2fb", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice best describes the function of the underlined sentence in the text as a whole?", "cat": "Function of a sentence", "skill": "Text Structure and Purpose", "dom": "Craft and Structure", "ans": "A", "choices": ["It provides a specific illustration of the point the novel's author makes about the spread of digital dystopia.", "It describes an example of a technological solution that the novel presents as environmentally conscious but that in actuality would prevent meaningful systemic change.", "It explains how the protagonist's perspective on the company evolves from sincere to cynical over the course of the novel's plot.", "It conveys how the novel's central message is advanced through a series of increasingly satirical anecdotes."], "rev": {"formula": ["The sentence after it states the message: dystopia spreads through willing participation in technologies promising social change."], "steps": ["The underlined app is an example of such a technology.", "So it illustrates the author's point."], "tip": ["An \"example\" sentence usually comes right before the point it supports."], "trap": ["Choosing D, which mentions a \"series\" of anecdotes though only one is given."], "desmos": []}, "p": "In Dave Eggers's novel [[i]]The Every[[/i]], protagonist Delaney Wells infiltrates a monopolistic technology company with the intention to destroy it. Instead, she becomes ensnared in its corporate ideology. [[u]]She even helps the company launch an app that awards points for sustainable purchases while publicly shaming users with high carbon footprints.[[/u]] Through this satirical portrayal, Eggers drives home his central message: digital dystopia spreads not through coercion but through willing participation in technologies that promise social change but that encourage self-centered and moralizing behavior rather than collective action to bring about systemic improvements.", "n": 32, "id": "1c38fa40", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which choice best describes a notable difference in how the references to palm trees function in Text 1 and Text 2?", "cat": "Cross-text connections", "skill": "Cross-Text Connections", "dom": "Craft and Structure", "ans": "D", "choices": ["While the narrator of Text 1 and the author of Text 2 both discuss palm trees to suggest the value of experiencing the natural world, only the narrator of Text 1 alludes to the labor that goes into cultivating real palm trees.", "While palm trees form part of a series conveying the variety of the natural world in both texts, only the author of Text 2 recognizes how closely interconnected palm trees are with other plants in their environment.", "While the narrator of Text 1 and the author of Text 2 both refer to metaphorical palm trees, only the narrator of Text 1 suggests that the palm trees are representative of home.", "While palm trees serve to evoke natural beauty in both texts, only the author of Text 2 expresses a close sense of identification with palm trees."], "rev": {"formula": ["Both texts use palm trees to evoke natural beauty; compare how each author relates to them."], "steps": ["Text 1: tropic palms are exotic scenery that thrill less than the home scene.", "Text 2: the author feels his consciousness stream \"through the trees... in the rustling palm leaves\", a deep identification."], "tip": ["Eliminate choices that add details neither text contains (labor, metaphor)."], "trap": ["Choosing B or C, which attribute ideas to the texts that are not stated."], "desmos": []}, "p": "[[b]]Text 1[[/b]] is from George Eliot's 1860 novel [[i]]The Mill on the Floss[[/i]]. [[b]]Text 2[[/b]] is from Rabindranath Tagore's 1921 nonfiction book [[i]]Glimpses of Bengal[[/i]].\n\n[[b]]Text 1[[/b]]\nThe wood I walk in on this mild May day, with the young yellow-brown foliage of the oaks between me and the blue sky, the white star-flowers and the blue-eyed speedwell and the ground ivy at my feet, what grove of tropic palms, what strange ferns or splendid broad-petalled blossoms, could ever thrill such deep and delicate fibres within me as this home scene?\n\n[[b]]Text 2[[/b]]\nMy feelings seem to be those of our ancient earth in the daily ecstasy of its sun-kissed life; my own consciousness seems to stream through each blade of grass, each sucking root, to rise with the sap through the trees, to break out with joyous thrills in the waving fields of corn, in the rustling palm leaves.", "n": 33, "id": "730dbf29", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Information in the text best supports which statement about the consonant [[i]]s[[/i]]?", "cat": "Inference", "skill": "Inferences", "dom": "Information and Ideas", "ans": "B", "choices": ["The pronunciation of this consonant in Nahuatl may have been affected by its pronunciation in Mexican Spanish.", "The pronunciation of this consonant requires greater tension in the tongue in Nahuatl than in Castilian.", "This consonant appears in a higher percentage of Nahuatl vocabulary than of Castilian vocabulary.", "The pronunciation of this consonant is the principal difference between the Mexican and Castilian dialects of Spanish."], "rev": {"formula": ["Mexican Spanish has more tension than Castilian, and it got that pronunciation from Nahuatl."], "steps": ["Mexican Spanish acquired the sharper s from Nahuatl.", "So Nahuatl's s has greater tension than Castilian's."], "tip": ["Follow the chain of influence: Nahuatl → Mexican Spanish."], "trap": ["Choosing A, which reverses the direction of influence."], "desmos": []}, "p": "In the Mexican dialect of Spanish, the consonant [[i]]s[[/i]] is pronounced with greater tension in the tongue than it is in Castilian, the dominant dialect in Spain, resulting in a sharper sound. Margarita Hidalgo, a linguist at San Diego State University, argues that Mexican Spanish acquired this pronunciation from Nahuatl, the language of the Nahua people in Central Mexico: as the Spanish colonizers of Mexico incorporated Nahuatl words into their speech, and as more and more Nahuas spoke Spanish as a second language, the Nahuatl pronunciation of the [[i]]s[[/i]] consonant replaced the Castilian pronunciation.", "n": 34, "id": "aeac56f9", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which quotation from a literary critic would be the most effective evidence in support of the underlined claim?", "cat": "Supporting a claim", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "D", "choices": ["\"Not all the stories anthologized in [[i]]The Big Book of Cyberpunk[[/i]] were first published as stand-alone short stories in magazines or journals: for example, qntm's 2021 story 'Lena' was originally self-published on the author's site qntm.org.\"", "\"The stories in [[i]]The Big Book of Cyberpunk[[/i]] share a number of common themes indicative of cyberpunk as a whole: body modification; resistance to authority; the ways in which technological advancements alter human behavior.\"", "\"Shurin's characterization of cyberpunk is remarkably generous: it is a categorization that might well serve for the entire field of science fiction in general, rather than cyberpunk in particular.\"", "\"A key component of cyberpunk that differentiates it from other subgenres of science fiction is an affection for the totems of 1980s pop culture, such as the mirrored sunglasses that were then popular.\""], "rev": {"formula": ["The claim: cyberpunk is largely about aesthetic, not ideas."], "steps": ["Choice D names a defining feature that is purely aesthetic (pop-culture totems, sunglasses).", "B lists themes (ideas), which weakens the claim."], "tip": ["Pick evidence that matches the claim, not the topic."], "trap": ["Choosing B, which supports the opposite claim (idea-driven)."], "desmos": []}, "p": "Editor Jared Shurin's enormous 2023 anthology [[i]]The Big Book of Cyberpunk[[/i]] comprises 108 stories. Shurin's volume is chronologically expansive, featuring such stories as James Tiptree Jr.'s \"The Girl Who Was Plugged In\" (1973) and Lavanya Lakshminarayan's \"Études\" (2020). In his introduction, Shurin defines cyberpunk as a subgenre of speculative fiction concerning \"the influence of technology on the scale, the pace, or the pattern of human affairs\"; however, some critics assert that [[u]]cyberpunk is a literary movement that is in large part aesthetic rather than idea driven.[[/u]]", "n": 35, "id": "d29e87e2", "rw": 1}, {"diff": "Hard", "type": "mc", "q": "Which quotation from a literary scholar would most directly support the underlined claim?", "cat": "Supporting a claim", "skill": "Command of Evidence: Textual", "dom": "Information and Ideas", "ans": "A", "choices": ["\"Seriality in Mackey's long song operates recursively, meaning that, in combination with the work's marshaling of an eclectic array of cultural allusions, it endlessly reiterates and recontextualizes the same archetypal images and narrative incidents, uncovering in these elements new and unexpected meanings with each repetition.\"", "\"The intellectual scope of Mackey's work is capacious, drawing on such wide-ranging cultural influences as the traditional stories of the Dogon people of West Africa, philosophical schools of the ancient Mediterranean, the history of the African diaspora, quantum mechanics, modernist poetry, and experimental jazz music.\"", "\"Though nominally an epic whose band of wandering travelers evoke the ancient Greek epic hero Odysseus, unlike traditional Western epics, which often conclude with the hero's return home, Mackey's long song possesses an open-endedness that renders the final homecoming elusive.\"", "\"Though at the outset of his project Mackey conceived of [[i]]Song of the Andoumboulou[[/i]] and [[i]]Mu[[/i]] as two discrete series, in the preface of 2006's [[i]]Splay Anthem[[/i]], Mackey indicates that their seriality eventually …\""], "rev": {"formula": ["The claim: the open-ended, associative structure keeps readers from settling on one definitive interpretation of the work's world cultures."], "steps": ["A links the cultural allusions to a structure that reiterates and recontextualizes images, producing new meanings each time.", "That directly supports \"no definitive interpretation\"."], "tip": ["The quote must tie structure (open-endedness) to its effect on interpretation."], "trap": ["Choosing B, which only describes the range of influences, not the effect on readers."], "desmos": []}, "p": "The 2021 poetry collection [[i]]Double Trio[[/i]] continues Nathaniel Mackey's \"long song,\" a sprawling work that consists of a pair of serialized poems called [[i]]Song of the Andoumboulou[[/i]] and [[i]]Mu[[/i]], whose joint publication spans multiple installments over several decades. In this long song, Mackey actualizes what he calls \"discrepant engagement,\" a compositional strategy that involves continuously revising and remixing diverse cultural references to illuminate the complex interconnectedness of global cultures. [[u]]Mackey's long song's open-endedness is essential to the way it manifests discrepant engagement—that is, the work's associative logic and resistance to linear narrative prevent readers from imposing a definitive and coherent interpretation on its presentation of world cultures.[[/u]]", "tag": "Choice D partly cut off in screenshot (text completed)", "n": 36, "id": "f44c236d", "rw": 1}, {"diff": "Medium", "type": "mc", "q": "Which choice most effectively uses data from the table to complete the example?", "cat": "Reading a table", "skill": "Command of Evidence: Quantitative", "dom": "Information and Ideas", "ans": "D", "choices": ["Saser Kangri I / K22 has an elevation of 7,672 meters and is considered the highest mountain from the Saser Karakoram range.", "Nanda Devi has a much higher prominence than does Langpo.", "Nanda Devi has a high prominence but is from a different mountain range than Rimo I, which has a lower prominence.", "Nanda Devi has an elevation of 7,816 meters but a considerably lower prominence of 3,139 meters."], "rev": {"formula": ["The example must show that elevation and prominence can differ significantly for the same mountain."], "steps": ["Nanda Devi: elevation 7,816 m, prominence 3,139 m.", "D contrasts both values for one Indian mountain."], "tip": ["The example must illustrate the claim, not just state data."], "trap": ["Choosing B, which compares prominence only and does not contrast the two measures."], "desmos": []}, "p": "Mountain summits are often described in terms of their elevation, or height above sea level. But a summit's elevation may not be as good an indication of how high the mountain appears to observers as is the summit's prominence, or its height above its surroundings, and these values can differ significantly. For example, the Indian mountain of ____", "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfkAAAEdCAIAAACAAYknAACad0lEQVR42uzdZVwUWxsA8GdnO+jubkQ6BEEMRLEVOzARxe5uxS4sLExsBbEbUBCQTunuXNjenfcDBnr11nu91zj/Hx9gdubMzDNnnj1z5sxAwHEcEARB
