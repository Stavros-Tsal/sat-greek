<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 2 · Part 6</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>
<style>
:root{--ink:#14213d;--blue:#1d4ed8;--navy:#0f2a5c;--pale:#eef3fb;--line:#c9d6ec;--ok:#0f7b45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif}
header{background:var(--navy);color:#fff;padding:22px 20px 18px}
header .in{max-width:820px;margin:auto}
header .who{font:600 15px/1.2 system-ui,sans-serif;opacity:.85;margin-bottom:8px}
header h1{margin:0;font-size:28px;font-weight:700}
header p{margin:6px 0 0;font:14px system-ui,sans-serif;opacity:.8}
header .hbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.timer-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 14px;font:700 14px system-ui,sans-serif;letter-spacing:.02em}
.timer-pill.warn{background:var(--bad);border-color:var(--bad)}
.calc-link{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:20px;font:600 13px system-ui,sans-serif;text-decoration:none}
.calc-link:hover{background:rgba(255,255,255,.24)}
main{max-width:820px;margin:0 auto;padding:22px 16px 90px}
.sec{font:600 15px system-ui,sans-serif;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.q.right{border-left:6px solid var(--ok)}.q.wrong{border-left:6px solid var(--bad)}
.n{font:700 14px system-ui,sans-serif;color:var(--blue);margin-bottom:4px}
.txt{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--pale)}
.opt input{margin:0}.opt b{font:700 14px system-ui,sans-serif;color:var(--navy);width:16px}
.opt.sel{border-color:var(--blue);background:#e6eeff}
.opt.key{border-color:var(--ok);background:#e5f6ec}
.open input[type=text]{font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:220px}
.open small{display:block;color:#5b6b8c;font:13px system-ui,sans-serif;margin-top:4px}
.fb{font:14px system-ui,sans-serif;margin-top:8px}.fb.r{color:var(--ok)}.fb.w{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;justify-content:center;align-items:center;font:15px system-ui,sans-serif;flex-wrap:wrap}
button{font:600 15px system-ui,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#score{font-weight:700;color:var(--navy)}
table{border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:5px 14px;text-align:center}
.start-overlay{position:fixed;inset:0;background:rgba(15,42,92,.94);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.start-box{background:#fff;border-radius:14px;padding:28px 26px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.start-box h2{margin:0 0 6px;color:var(--navy);font-size:22px;font-weight:700}
.start-box p{margin:0 0 18px;font:14px system-ui,sans-serif;color:#5b6b8c}
.timing-opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;text-align:left;transition:.15s}
.timing-opt:hover{background:var(--pale)}
.timing-opt.selected{border-color:var(--blue);background:#e6eeff}
.timing-opt .t-name{font:700 15px system-ui,sans-serif;color:var(--navy)}
.timing-opt .t-min{font:12px system-ui,sans-serif;color:#5b6b8c;margin-top:2px}
#start-btn{margin-top:14px;width:100%}
@media print{.bar{display:none}.start-overlay{display:none}}
</style></head><body>
<div class="start-overlay" id="start-overlay">
  <div class="start-box">
    <h2>Module 2 · Part 6</h2>
    <p>17 questions · choose a time limit to begin</p>
    <div id="timing-options"></div>
    <button id="start-btn">Start</button>
  </div>
</div>
<header><div class="in"><div class="who">Tsalapatis Stavros</div><h1>Module 2 · Part 6</h1>
<p>SAT Math · Module 2 practice · 17 questions · calculator allowed</p>
<div class="hbar" id="hbar"><span class="timer-pill" id="timer-pill">--:--</span><a class="calc-link" id="calc-link" href="https://www.desmos.com/calculator" target="_blank" rel="noopener">📊 Desmos Calculator ↗</a></div>
</div></header>
<main id="m" style="display:none"></main>
<div class="bar" id="bar" style="display:none"><span id="prog">0 / 17 answered</span><button id="chk">Check answers</button><button class="alt" id="rst">Reset</button><span id="score"></span></div>
<script>
const Q=[{"q": "$$7x + 9y = 26$$ $$kx + 36y = 104$$ In the given system of equations, $k$ is a constant. If the system has infinitely many solutions, what is the value of $k$?", "open": true, "ans": "28"}, {"q": "In the $xy$-plane, a line passes through the points $(0, 2)$ and $(9, 8)$. What is the $x$-coordinate of the $x$-intercept of the line?", "opts": ["-5", "-4", "-3", "0"], "ans": "C"}, {"q": "A student has \\$125 to spend on school supplies. She must buy at least 3 pens at \\$5 each, and she wants to buy as many notebooks as possible at \\$7 each. What is the greatest number of notebooks she can buy?", "opts": ["12", "13", "14", "15"], "ans": "D"}, {"q": "At a fair, 4 adult tickets and 3 child tickets cost \\$29 in total, and 5 adult tickets and 1 child ticket cost \\$28 in total. What is the total cost, in dollars, of 1 adult ticket and 1 child ticket?", "open": true, "ans": "8"}, {"q": "$|3x - 9| = 9$ What is the positive difference between the solutions to the given equation?", "opts": ["3", "6", "9", "12"], "ans": "B"}, {"q": "A rental company's charge, in dollars, for driving $m$ miles is given by $C(m) = 4m + 30$. One customer drove a certain number of miles and was charged \\$102. A second customer drove twice as many miles as the first customer. What was the second customer's charge, in dollars?", "opts": ["120", "144", "174", "204"], "ans": "C"}, {"q": "In the $xy$-plane, the graph of the quadratic function $f$ has a vertex at $(-3, -4)$ and passes through the point $(0, -31)$. What is the value of $f(-4)$?", "opts": ["-25", "-19", "-13", "-7"], "ans": "D"}, {"q": "$$2x^2 + bx + 2 = 0$$ In the given equation, $b$ is a positive constant. If the equation has exactly one real solution, what is the value of $b$?", "open": true, "ans": "4"}, {"q": "$$2x^2 - 8x - 64 = 0$$ What is the sum of the squares of the two solutions to the given equation?", "opts": ["64", "80", "84", "144"], "ans": "B"}, {"q": "A certain culture of bacteria triples in number every 30 minutes. At the start of an experiment, there are 50 bacteria in the culture. How many hours after the start of the experiment will there be 36,450 bacteria in the culture?", "opts": ["1", "2", "3", "4"], "ans": "C"}, {"q": "$$16^{x + 1} = 2^{3x + 4}$$ What is the value of $x$ in the given equation?", "open": true, "ans": "0"}, {"q": "For $x > 6$, which of the following expressions is equivalent to $\\dfrac{x^2 - 9}{x^2 + 9x + 18}$?", "opts": ["$\\dfrac{x - 3}{x + 6}$", "$\\dfrac{x + 3}{x + 6}$", "$\\dfrac{x - 3}{x - 6}$", "$\\dfrac{x - 3}{x + 3}$"], "ans": "A"}, {"q": "A faucet leaks water at a constant rate of 0.5 liter per hour. How many liters of water will leak from the faucet in 3 days?", "opts": ["12", "36", "39", "90"], "ans": "B"}, {"q": "A poll of a random sample of 500 adult residents of a city found that 52% of the residents surveyed support building a new library. The poll reported a margin of error of 5 percentage points. Which of the following is the most appropriate conclusion?", "opts": ["Exactly 52% of all adult residents of the city support building the library.", "More than half of all adult residents of the city support building the library.", "It is plausible that the percent of all adult residents of the city who support building the library is between 47% and 57%.", "The percent of the 500 residents in the sample who support the library is between 47% and 57%."], "ans": "C"}, {"q": "A line of best fit for a data set is $\\hat{y} = 4x + 40$. For the data point $(6, 69)$, the residual is defined as the actual $y$-value minus the predicted $y$-value. What is the residual for this data point?", "open": true, "ans": "5"}, {"q": "An equilateral triangle has side length $10\\sqrt{3}$. What is the length of the altitude drawn to one of its sides?", "opts": ["15", "17", "19", "30"], "ans": "A"}, {"q": "In the $xy$-plane, a circle has its center at $(-5, 7)$ and is tangent to the $y$-axis. Which of the following is an equation of the circle?", "opts": ["$(x + 5)^2 + (y - 7)^2 = 49$", "$(x + 5)^2 + (y - 7)^2 = 25$", "$(x + 5)^2 + (y - 7)^2 = 5$", "$(x + 5)^2 + (y - 7)^2 = 35$"], "ans": "B"}];
const SEC=[[0,'Algebra'],[6,'Advanced Math'],[12,'Problem-Solving and Data Analysis'],[15,'Geometry and Trigonometry']];
const given={};let checked=false;
function num(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');
 let m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
 m=s.match(/^-?(\d+)?\.?\d+$/);return m?parseFloat(s):NaN}
function dec(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');if(s.indexOf('/')>-1)return Infinity;const m=s.match(/\.(\d+)$/);return m?m[1].length:0}
function ok(q,g){if(g===undefined||g==='')return false;if(q.open){const a=num(q.ans),b=num(g);if(isNaN(a)||isNaN(b))return false;if(Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a)))return true;const k=dec(g);if(String(q.ans).indexOf('/')>-1){if(k===Infinity||k<3||k>12)return false;const f=Math.pow(10,k),r=Number(a.toFixed(k)),t=Math.trunc(a*f+(a>0?1e-9:-1e-9))/f;return Math.abs(b-r)<1e-12||Math.abs(b-t)<1e-12}if(/\bround(?:ed|ing)?\b|nearest|decimal place|tenth|hundredth|thousandth/i.test(q.q||'')){const d=dec(q.ans);return k>d&&Math.abs(b-a)<0.5*Math.pow(10,-d)-1e-9}return false}return g===q.ans}
function sectionName(i){let name=SEC[0][1];for(const s of SEC){if(s[0]<=i)name=s[1];else break}return name}
function weight(i){const n=sectionName(i);return (n==='Algebra'||n==='Advanced Math')?0.5:1}
function render(){const m=document.getElementById('m');m.innerHTML='';
 Q.forEach((q,i)=>{const s=SEC.find(x=>x[0]===i);if(s){const h=document.createElement('div');h.className='sec';h.textContent=s[1];m.appendChild(h)}
  const d=document.createElement('div');d.className='q'+(checked?(ok(q,given[i])?' right':' wrong'):'');
  let h='<div class="n">Question '+(i+1)+'</div><div class="txt">'+q.q+'</div>';
  if(q.open){h+='<div class="open"><input type="text" inputmode="text" autocomplete="off" data-i="'+i+'" value="'+(given[i]||'')+'" '+(checked?'disabled':'')+' aria-label="Answer to question '+(i+1)+'"><small>Student-produced response. Fractions and decimals are accepted.</small></div>'}
  else{q.opts.forEach((o,k)=>{const L='ABCD'[k];const cls='opt'+(given[i]===L?' sel':'')+(checked&&q.ans===L?' key':'');
   h+='<label class="'+cls+'"><input type="radio" name="q'+i+'" data-i="'+i+'" value="'+L+'" '+(given[i]===L?'checked':'')+' '+(checked?'disabled':'')+'><b>'+L+'</b><span>'+o+'</span></label>'})}
  if(checked){const r=ok(q,given[i]);h+='<div class="fb '+(r?'r':'w')+'">'+(r?'Correct.':'Incorrect.')+' Answer: '+(q.open?q.ans:q.ans)+'</div>'}
  d.innerHTML=h;m.appendChild(d)});
 bind();typeset();prog()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{given[e.dataset.i]=e.value;render()});
 document.querySelectorAll('input[type=text]').forEach(e=>e.oninput=()=>{given[e.dataset.i]=e.value;prog()})}
function prog(){const n=Object.values(given).filter(v=>v!==''&&v!==undefined).length;document.getElementById('prog').textContent=n+' / 17 answered'}
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
function fmtScore(x){return (Math.round(x*10)/10).toString()}
function doCheck(){checked=true;let earned=0,maxW=0;Q.forEach((q,i)=>{const w=weight(i);maxW+=w;if(ok(q,given[i]))earned+=w});document.getElementById('score').textContent='Score: '+fmtScore(earned)+' / '+fmtScore(maxW);try{if(window.clcReport&&!window.__clcFtDone){window.__clcFtDone=1;let c=0;Q.forEach((q,i)=>{if(ok(q,given[i]))c++});clcReport({src:'fasttrack',correct:c,total:Q.length,score:Math.round(1000*earned/(maxW||1))/10})}}catch(_e){}render();window.scrollTo(0,0)}
document.getElementById('chk').onclick=doCheck;
document.getElementById('rst').onclick=()=>{for(const k in given)delete given[k];checked=false;window.__clcFtDone=0;document.getElementById('score').textContent='';render();window.scrollTo(0,0)};
render();window.addEventListener('load',()=>setTimeout(typeset,600));

// ── Timer / start screen ──
const TIMING_CHOICES=[{label:'Standard',minutes:35},{label:'Extra Time (25%)',minutes:50},{label:'Extra Time (50%)',minutes:60}];
let chosenMinutes=35,timeLeft=0,timerInterval=null;
function renderTimingOptions(){const wrap=document.getElementById('timing-options');wrap.innerHTML='';
 TIMING_CHOICES.forEach((t,i)=>{const div=document.createElement('div');div.className='timing-opt'+(i===0?' selected':'');
  div.innerHTML='<div class="t-name">'+t.label+'</div><div class="t-min">'+t.minutes+' minutes</div>';
  div.onclick=()=>{document.querySelectorAll('.timing-opt').forEach(el=>el.classList.remove('selected'));div.classList.add('selected');chosenMinutes=t.minutes};
  wrap.appendChild(div)})}
renderTimingOptions();
function updateTimerDisplay(){const mnt=Math.floor(timeLeft/60),s=timeLeft%60;const str=String(mnt).padStart(2,'0')+':'+String(s).padStart(2,'0');const pill=document.getElementById('timer-pill');pill.textContent=str;pill.classList.toggle('warn',timeLeft<=60)}
function startTimer(){timeLeft=chosenMinutes*60;updateTimerDisplay();timerInterval=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timerInterval);timeLeft=0;updateTimerDisplay();if(!checked)doCheck();return}updateTimerDisplay()},1000)}
document.getElementById('start-btn').onclick=()=>{document.getElementById('start-overlay').style.display='none';document.getElementById('m').style.display='block';document.getElementById('bar').style.display='flex';document.getElementById('hbar').style.display='flex';startTimer()};
</script><script src="results.js"></script><script src="module-export.js"></script></body></html>
